<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SGMC Rider</title>
    
    <link rel="manifest" href="manifest.json">
    
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --bg: #050505; --card: #141414; --accent: #F97316; --text: #fff; }
        body { background-color: var(--bg); color: var(--text); font-family: sans-serif; -webkit-tap-highlight-color: transparent; padding-bottom: 100px; }
        
        .rider-card { background: var(--card); border: 1px solid #333; border-radius: 16px; padding: 16px; margin-bottom: 12px; position: relative; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        
        .btn-action { display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: bold; border-radius: 12px; padding: 12px; transition: 0.2s; }
        .btn-action:active { transform: scale(0.95); }
        
        .status-pill { font-size: 10px; font-weight: 900; text-transform: uppercase; padding: 4px 8px; border-radius: 4px; letter-spacing: 0.5px; }
        
        /* Swipe Button Style */
        .swipe-btn-container { background: #222; height: 50px; border-radius: 25px; position: relative; overflow: hidden; border: 1px solid #444; margin-top: 12px; }
        .swipe-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: #666; pointer-events: none; letter-spacing: 1px; }
        .swipe-handle { width: 50px; height: 100%; background: var(--accent); border-radius: 25px; position: absolute; left: 0; top: 0; display: flex; align-items: center; justify-content: center; color: white; cursor: grab; transition: background 0.3s; box-shadow: 0 0 15px rgba(249, 115, 22, 0.4); }
        
        .bottom-stat { position: fixed; bottom: 0; left: 0; right: 0; background: #111; border-top: 1px solid #333; padding: 15px; display: flex; justify-content: space-between; align-items: center; z-index: 50; padding-bottom: 25px; }
        
        #login-screen { position: fixed; inset: 0; background: #000; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    </style>
</head>
<body>

    <div class="fixed top-0 left-0 right-0 bg-[#050505]/95 backdrop-blur-sm z-40 px-4 py-4 flex justify-between items-center border-b border-white/10">
        <h1 class="text-xl font-bold italic text-white"><span class="text-orange-500">RIDER</span> APP</h1>
        <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
            <span class="text-xs font-bold text-gray-400" id="rider-name-display">Guest</span>
            <button onclick="logout()" class="text-red-500 ml-2"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </div>

    <div class="h-20"></div>

    <div class="px-4 mb-4 flex gap-2">
        <button onclick="switchTab('active')" id="tab-active" class="flex-1 py-2 rounded-lg bg-orange-600 text-white text-xs font-bold">Active</button>
        <button onclick="switchTab('history')" id="tab-history" class="flex-1 py-2 rounded-lg bg-gray-800 text-gray-400 text-xs font-bold">History</button>
    </div>

    <div id="view-active" class="px-4 pb-24">
        <p class="text-center text-gray-600 text-xs mt-10 hidden" id="no-orders-msg">No deliveries assigned</p>
        <div id="active-list" class="space-y-4"></div>
    </div>

    <div id="view-history" class="px-4 pb-24 hidden">
        <div id="history-list" class="space-y-4"></div>
    </div>

    <div class="bottom-stat">
        <div>
            <p class="text-[10px] text-gray-500 uppercase font-bold">Cash to Deposit</p>
            <p class="text-xl font-bold text-green-400">₹<span id="cash-hand">0</span></p>
        </div>
        <div class="text-right">
             <p class="text-[10px] text-gray-500 uppercase font-bold">Status</p>
             <p class="text-xs font-bold text-green-500">ONLINE</p>
        </div>
    </div>

    <div id="login-screen">
        <i class="fas fa-motorcycle text-6xl text-orange-500 mb-6"></i>
        <h2 class="text-2xl font-bold text-white mb-2">SGMC Delivery</h2>
        <p class="text-gray-500 text-sm mb-8 text-center">Login with your verified phone number</p>
        <input type="tel" id="r-phone" placeholder="Registered Phone Number" class="w-full bg-[#222] border border-[#333] p-4 rounded-xl text-white mb-6 outline-none focus:border-orange-500 text-center text-lg font-bold tracking-widest">
        <button onclick="riderLogin()" id="login-btn" class="w-full bg-gradient-to-r from-orange-600 to-yellow-500 text-black font-bold py-4 rounded-xl text-lg shadow-lg">LOGIN</button>
        <p class="text-xs text-red-500 mt-4 hidden" id="login-error">Rider not found. Contact Admin.</p>
    </div>

    <div id="toast-box" class="fixed top-5 left-1/2 -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded-full text-xs font-bold opacity-0 transition pointer-events-none z-50"></div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyBadYpoNTL0dHkBQO4UddRVtPIfUOlf-bA", authDomain: "sgmc-16568.firebaseapp.com", projectId: "sgmc-16568", storageBucket: "sgmc-16568.firebasestorage.app", messagingSenderId: "339041646158", appId: "1:339041646158:web:85d9a50a3b51b30aae351f", measurementId: "G-4996NPF55N" };
        firebase.initializeApp(firebaseConfig); 
        const db = firebase.firestore();

        let rider = null;

        function init() {
            const stored = localStorage.getItem('sgmc_rider_profile');
            if(stored) {
                rider = JSON.parse(stored);
                verifyRiderStatus(); // Check if still valid rider
            }
        }

        function verifyRiderStatus() {
            db.collection('riders').doc(rider.phone).onSnapshot(doc => {
                if(doc.exists) {
                    rider = doc.data(); // Get latest data (Cash balance etc)
                    localStorage.setItem('sgmc_rider_profile', JSON.stringify(rider));
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('rider-name-display').innerText = rider.name;
                    document.getElementById('cash-hand').innerText = rider.cashInHand || 0;
                    
                    // Update Online Status
                    db.collection('riders').doc(rider.phone).update({isOnline: true, lastActive: firebase.firestore.FieldValue.serverTimestamp()});
                    
                    startListening();
                } else {
                    logout(); // Removed from admin
                }
            });
        }

        function riderLogin() {
            const phone = document.getElementById('r-phone').value.trim();
            const btn = document.getElementById('login-btn');
            const err = document.getElementById('login-error');
            
            if(phone.length < 10) return showToast("Invalid Phone");
            
            btn.innerText = "Checking...";
            db.collection('riders').doc(phone).get().then(doc => {
                if(doc.exists) {
                    rider = doc.data();
                    localStorage.setItem('sgmc_rider_profile', JSON.stringify(rider));
                    verifyRiderStatus();
                } else {
                    err.classList.remove('hidden');
                    btn.innerText = "LOGIN";
                }
            }).catch(() => { btn.innerText = "LOGIN"; showToast("Network Error"); });
        }

        function logout() {
            localStorage.removeItem('sgmc_rider_profile');
            location.reload();
        }

        function startListening() {
            // Listen for orders
            db.collection('orders').orderBy('timestamp', 'desc').limit(50).onSnapshot(snap => {
                const list = document.getElementById('active-list');
                const histList = document.getElementById('history-list');
                list.innerHTML = '';
                histList.innerHTML = '';
                let hasActive = false;

                snap.docs.forEach(doc => {
                    const d = doc.data();
                    const id = doc.id;
                    
                    // SHOW IF: Order is Ready (For pickup) OR Assigned to me
                    if(d.status === 'ready' || (d.status === 'out_delivery' && d.riderPhone === rider.phone)) {
                        hasActive = true;
                        renderOrderCard(id, d, list, 'active');
                    } else if (d.status === 'completed' && d.riderPhone === rider.phone) {
                        renderOrderCard(id, d, histList, 'history');
                    }
                });
                document.getElementById('no-orders-msg').style.display = hasActive ? 'none' : 'block';
            });
        }

        function renderOrderCard(id, d, container, type) {
            const isAssigned = d.status === 'out_delivery';
            const isCOD = d.paymentMode === 'Cash' || d.paymentMode === 'Udhaar'; // Treat Udhaar like cash for handover, or handle separate
            const address = d.customerAddress || "No Address";
            
            let mapLink = d.customerCoordinates 
                ? `https://www.google.com/maps/dir/?api=1&destination=${d.customerCoordinates.lat},${d.customerCoordinates.lng}`
                : `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(address)}`;

            const html = `
            <div class="rider-card border-l-4 ${type==='history'?'border-gray-600':'border-orange-500'}">
                <div class="flex justify-between items-start mb-3">
                    <div>
                        <h3 class="font-bold text-lg text-white">${d.customerName}</h3>
                        <p class="text-xs text-gray-400 font-mono">#${d.shortId || 'ID'}</p>
                    </div>
                    <div class="text-right">
                        <span class="status-pill ${d.paymentMode==='Cash' ? 'bg-red-900/30 text-red-400' : 'bg-blue-900/30 text-blue-400'} border border-white/10">${d.paymentMode}</span>
                        <p class="text-xl font-bold text-white mt-1">₹${d.totalAmount}</p>
                    </div>
                </div>

                <div class="bg-[#111] p-3 rounded-lg mb-3">
                    <p class="text-xs text-gray-500 mb-1"><i class="fas fa-map-marker-alt text-red-500 mr-1"></i> Drop Location:</p>
                    <p class="text-sm font-bold text-gray-200 leading-tight">${address}</p>
                    ${d.recipient ? `<p class="text-xs text-blue-400 mt-1">Receiver: ${d.recipient.name} (${d.recipient.phone})</p>` : ''}
                </div>

                ${type === 'active' ? `
                    <div class="grid grid-cols-2 gap-2 mb-3">
                        <a href="tel:${d.recipient ? d.recipient.phone : d.customerPhone}" class="btn-action bg-gray-800 text-white hover:bg-gray-700 text-xs"><i class="fas fa-phone"></i> Call</a>
                        <a href="${mapLink}" target="_blank" class="btn-action bg-gray-800 text-green-400 hover:bg-gray-700 text-xs"><i class="fas fa-location-arrow"></i> Map</a>
                    </div>

                    ${!isAssigned ? `
                        <button onclick="acceptOrder('${id}')" class="w-full py-3 rounded-xl bg-orange-600 text-white font-bold text-sm shadow-lg active:scale-95 transition">
                            PICK UP ORDER (HANDOVER)
                        </button>
                    ` : `
                        <div class="swipe-btn-container" id="swipe-${id}">
                            <div class="swipe-text">SLIDE TO DELIVER</div>
                            <div class="swipe-handle" ontouchstart="startDrag(event, '${id}', ${d.totalAmount}, '${d.paymentMode}')" ontouchmove="drag(event)" ontouchend="endDrag(event)"><i class="fas fa-chevron-right"></i></div>
                        </div>
                    `}
                ` : `<p class="text-xs text-green-500 font-bold text-center border-t border-gray-800 pt-2">Completed ${d.deliveryTime ? new Date(d.deliveryTime.toDate()).toLocaleTimeString() : ''}</p>`}
            </div>`;
            
            container.innerHTML += html;
        }

        // --- ACTIONS ---
        function acceptOrder(id) {
            if(confirm("Accepting Handover. You are responsible for this order.")) {
                db.collection('orders').doc(id).update({
                    status: 'out_delivery',
                    riderName: rider.name,
                    riderPhone: rider.phone,
                    pickupTime: firebase.firestore.FieldValue.serverTimestamp()
                });
                showToast("Order Picked Up!");
            }
        }

        // --- SLIDER LOGIC ---
        let startX, currentX, activeSwipeId, activeAmount, activePayMode;
        
        function startDrag(e, id, amt, mode) {
            activeSwipeId = id; activeAmount = amt; activePayMode = mode;
            startX = e.touches[0].clientX;
            const handle = e.target.closest('.swipe-handle');
            handle.style.transition = 'none';
        }

        function drag(e) {
            if(!activeSwipeId) return;
            const handle = e.target.closest('.swipe-handle');
            const containerWidth = handle.parentElement.offsetWidth;
            currentX = e.touches[0].clientX - startX;
            
            if(currentX > 0 && currentX < containerWidth - 50) {
                handle.style.left = currentX + 'px';
                handle.style.background = `rgba(249, 115, 22, ${1 - currentX/200})`; 
            }
        }

        function endDrag(e) {
            if(!activeSwipeId) return;
            const handle = e.target.closest('.swipe-handle');
            const containerWidth = handle.parentElement.offsetWidth;
            
            if(currentX > containerWidth - 80) { // Success
                handle.style.left = (containerWidth - 50) + 'px';
                handle.style.background = '#22c55e';
                
                // Logic: Order Complete + Update Cash Balance
                const updates = {
                    status: 'completed',
                    deliveryTime: firebase.firestore.FieldValue.serverTimestamp(),
                    paymentVerified: true
                };
                
                // DB UPDATE
                db.collection('orders').doc(activeSwipeId).update(updates).then(() => {
                    // Update Rider Cash if COD
                    if(activePayMode === 'Cash') {
                        const newCash = (rider.cashInHand || 0) + activeAmount;
                        db.collection('riders').doc(rider.phone).update({ cashInHand: newCash });
                    }
                    showToast("Delivered Successfully!");
                });

            } else { // Reset
                handle.style.transition = '0.3s';
                handle.style.left = '0px';
                handle.style.background = '#F97316';
            }
            activeSwipeId = null;
        }

        function switchTab(t) {
            document.getElementById('view-active').classList.toggle('hidden', t !== 'active');
            document.getElementById('view-history').classList.toggle('hidden', t !== 'history');
            document.getElementById('tab-active').className = t==='active' ? "flex-1 py-2 rounded-lg bg-orange-600 text-white text-xs font-bold" : "flex-1 py-2 rounded-lg bg-gray-800 text-gray-400 text-xs font-bold";
            document.getElementById('tab-history').className = t==='history' ? "flex-1 py-2 rounded-lg bg-orange-600 text-white text-xs font-bold" : "flex-1 py-2 rounded-lg bg-gray-800 text-gray-400 text-xs font-bold";
        }

        function showToast(msg) {
            const t = document.getElementById('toast-box');
            t.innerText = msg;
            t.style.opacity = '1';
            setTimeout(() => t.style.opacity = '0', 2000);
        }

        init();
    </script>
</body>
</html>
