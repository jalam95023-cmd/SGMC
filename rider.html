<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SGMC Rider Pro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* Cyberpunk / High-Tech Rider Theme */
        :root { --bg: #050505; --card: #121212; --accent: #F97316; --text: #fff; --success: #22c55e; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; padding-bottom: 90px; }
        
        .glass-panel { background: rgba(20, 20, 20, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid #333; }
        .rider-card { background: linear-gradient(145deg, #1a1a1a, #0f0f0f); border: 1px solid #333; border-radius: 16px; padding: 16px; margin-bottom: 16px; position: relative; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        
        .status-pill { font-size: 10px; font-weight: 900; text-transform: uppercase; padding: 4px 10px; border-radius: 6px; letter-spacing: 0.5px; display: inline-block; }
        
        /* Sidebar Styles */
        .sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: 280px; background: #000; z-index: 100; transform: translateX(-100%); transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); border-right: 1px solid #333; }
        .sidebar.open { transform: translateX(0); }
        .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); opacity: 0; pointer-events: none; transition: 0.3s; z-index: 90; backdrop-filter: blur(3px); }
        .sidebar-overlay.open { opacity: 1; pointer-events: auto; }
        
        /* Swipe Button */
        .swipe-btn-container { background: #222; height: 55px; border-radius: 28px; position: relative; overflow: hidden; border: 1px solid #444; margin-top: 15px; box-shadow: inset 0 2px 5px rgba(0,0,0,0.5); }
        .swipe-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; color: #888; pointer-events: none; letter-spacing: 1px; text-transform: uppercase; animation: pulseText 2s infinite; }
        .swipe-handle { width: 55px; height: 100%; background: var(--accent); border-radius: 28px; position: absolute; left: 0; top: 0; display: flex; align-items: center; justify-content: center; color: white; cursor: grab; transition: background 0.3s; box-shadow: 0 0 20px rgba(249, 115, 22, 0.5); z-index: 10; font-size: 18px; }
        
        @keyframes pulseText { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        /* Bottom Floating Bar */
        .bottom-stat { position: fixed; bottom: 20px; left: 15px; right: 15px; background: rgba(30,30,30,0.95); border: 1px solid #444; padding: 15px; display: flex; justify-content: space-between; align-items: center; z-index: 50; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); backdrop-filter: blur(10px); }
        
        /* Modal */
        .full-modal { position: fixed; inset: 0; background: #000; z-index: 110; transform: translateY(100%); transition: 0.3s; overflow-y: auto; }
        .full-modal.open { transform: translateY(0); }

        #login-screen { position: fixed; inset: 0; background: #000; z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; }
    </style>
</head>
<body>

    <div id="sidebar-overlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <div id="sidebar" class="sidebar flex flex-col p-6">
        <div class="flex items-center gap-4 mb-8">
            <div class="w-14 h-14 rounded-full bg-orange-500/20 flex items-center justify-center text-orange-500 text-2xl font-bold border border-orange-500/50" id="sb-avatar">R</div>
            <div>
                <h3 class="font-bold text-lg text-white" id="sb-name">Rider</h3>
                <p class="text-xs text-green-500 font-bold">● ONLINE</p>
            </div>
        </div>

        <div class="space-y-2 flex-1">
            <button onclick="toggleSidebar()" class="w-full text-left p-3 rounded-xl bg-gray-900/50 text-white font-bold text-sm border border-gray-800"><i class="fas fa-home w-8 text-orange-500"></i> Home</button>
            <button onclick="openProfile(); toggleSidebar()" class="w-full text-left p-3 rounded-xl hover:bg-gray-900 text-gray-300 font-bold text-sm transition"><i class="fas fa-user w-8 text-gray-500"></i> My Profile</button>
            <button onclick="openCashHistory(); toggleSidebar()" class="w-full text-left p-3 rounded-xl hover:bg-gray-900 text-gray-300 font-bold text-sm transition"><i class="fas fa-wallet w-8 text-gray-500"></i> Cash History</button>
            <button onclick="showToast('Feature coming soon'); toggleSidebar()" class="w-full text-left p-3 rounded-xl hover:bg-gray-900 text-gray-300 font-bold text-sm transition"><i class="fas fa-chart-line w-8 text-gray-500"></i> Earnings</button>
        </div>

        <div class="mt-auto">
            <button onclick="logout()" class="w-full py-3 rounded-xl bg-red-900/20 text-red-500 font-bold border border-red-900/50"><i class="fas fa-sign-out-alt mr-2"></i> Log Out</button>
            <p class="text-center text-[10px] text-gray-700 mt-4">v2.0.1 PRO</p>
        </div>
    </div>

    <div class="fixed top-0 left-0 right-0 glass-panel z-40 px-4 py-3 flex justify-between items-center">
        <button onclick="toggleSidebar()" class="w-10 h-10 rounded-full bg-gray-800 flex items-center justify-center text-white active:scale-95"><i class="fas fa-bars"></i></button>
        <div class="flex flex-col items-center">
            <span class="text-xs font-bold text-gray-400 tracking-widest">DUTY STATUS</span>
            <div class="flex items-center gap-2" id="duty-indicator">
                <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                <span class="text-sm font-black text-white">ON DUTY</span>
            </div>
        </div>
        <button onclick="forceRefresh()" class="w-10 h-10 rounded-full bg-gray-800 flex items-center justify-center text-orange-500 active:scale-95"><i class="fas fa-sync-alt"></i></button>
    </div>

    <div class="h-24"></div>

    <div class="px-4 mb-5 flex gap-2">
        <button onclick="switchTab('assigned')" id="tab-assigned" class="flex-1 py-3 rounded-xl bg-orange-600 text-white text-xs font-bold shadow-lg shadow-orange-900/20 relative">
            New <span id="badge-new" class="absolute -top-1 -right-1 bg-red-600 text-white w-5 h-5 rounded-full flex items-center justify-center text-[10px] hidden">0</span>
        </button>
        <button onclick="switchTab('active')" id="tab-active" class="flex-1 py-3 rounded-xl bg-gray-900 border border-gray-800 text-gray-400 text-xs font-bold">Ongoing</button>
        <button onclick="switchTab('history')" id="tab-history" class="flex-1 py-3 rounded-xl bg-gray-900 border border-gray-800 text-gray-400 text-xs font-bold">Done</button>
    </div>

    <div id="view-assigned" class="px-4 pb-32">
        <div id="assigned-list" class="space-y-4"></div>
    </div>

    <div id="view-active" class="px-4 pb-32 hidden">
        <div id="active-list" class="space-y-4"></div>
    </div>

    <div id="view-history" class="px-4 pb-32 hidden">
        <div id="history-list" class="space-y-4"></div>
    </div>

    <div class="bottom-stat">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-green-500/20 flex items-center justify-center text-green-500"><i class="fas fa-rupee-sign"></i></div>
            <div>
                <p class="text-[10px] text-gray-400 uppercase font-bold">Cash in Hand</p>
                <p class="text-xl font-black text-white">₹<span id="cash-hand">0</span></p>
            </div>
        </div>
        <button onclick="openCashHistory()" class="px-4 py-2 rounded-lg bg-gray-800 text-xs font-bold text-gray-300 border border-gray-700">View History</button>
    </div>

    <div id="cash-history-modal" class="full-modal bg-[#050505]">
        <div class="p-4 border-b border-gray-800 flex justify-between items-center sticky top-0 bg-[#050505] z-10">
            <h2 class="text-xl font-bold text-white">Cash History</h2>
            <button onclick="document.getElementById('cash-history-modal').classList.remove('open')" class="w-8 h-8 rounded-full bg-gray-800 text-white"><i class="fas fa-times"></i></button>
        </div>
        <div id="cash-logs-list" class="p-4 space-y-3"></div>
    </div>

    <div id="profile-modal" class="full-modal bg-[#050505]">
        <div class="p-4 border-b border-gray-800 flex justify-between items-center">
            <h2 class="text-xl font-bold text-white">My Profile</h2>
            <button onclick="document.getElementById('profile-modal').classList.remove('open')" class="w-8 h-8 rounded-full bg-gray-800 text-white"><i class="fas fa-times"></i></button>
        </div>
        <div class="p-6 text-center">
            <div class="w-24 h-24 rounded-full bg-gradient-to-tr from-orange-500 to-yellow-500 mx-auto flex items-center justify-center text-4xl font-bold text-black mb-4" id="pf-avatar">R</div>
            <h2 class="text-2xl font-bold text-white" id="pf-name">Rider Name</h2>
            <p class="text-gray-500 font-mono mb-6" id="pf-phone">+91 XXXXXXXXXX</p>
            
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="p-4 rounded-xl bg-gray-900 border border-gray-800">
                    <p class="text-xs text-gray-500 uppercase">Joined</p>
                    <p class="font-bold" id="pf-join">...</p>
                </div>
                <div class="p-4 rounded-xl bg-gray-900 border border-gray-800">
                    <p class="text-xs text-gray-500 uppercase">Total Deliveries</p>
                    <p class="font-bold text-orange-500" id="pf-total">0</p>
                </div>
            </div>
            
            <button class="w-full py-4 rounded-xl bg-red-600/10 text-red-500 border border-red-600/30 font-bold mb-4 animate-pulse"><i class="fas fa-exclamation-triangle mr-2"></i> EMERGENCY SOS</button>
        </div>
    </div>

    <div id="login-screen">
        <div class="w-full max-w-sm">
            <div class="text-center mb-10">
                <i class="fas fa-bolt text-6xl text-orange-500 mb-4"></i>
                <h1 class="text-3xl font-black text-white">SGMC<span class="text-orange-500">RIDER</span></h1>
                <p class="text-gray-500 text-sm mt-2">Delivery Partner App</p>
            </div>
            
            <div class="space-y-4">
                <div class="relative">
                    <i class="fas fa-phone absolute left-4 top-4 text-gray-500"></i>
                    <input type="tel" id="r-phone" placeholder="Registered Mobile Number" class="w-full bg-[#111] border border-[#333] p-4 pl-12 rounded-xl text-white outline-none focus:border-orange-500 font-mono text-lg transition duration-300">
                </div>
                <button onclick="riderLogin()" id="login-btn" class="w-full bg-gradient-to-r from-orange-600 to-orange-500 text-black font-bold py-4 rounded-xl text-lg shadow-xl shadow-orange-900/20 active:scale-95 transition">SECURE LOGIN</button>
            </div>
            <p class="text-xs text-red-500 mt-4 text-center hidden" id="login-error"><i class="fas fa-times-circle mr-1"></i> Access Denied. Contact Admin.</p>
        </div>
        <p class="absolute bottom-6 text-[10px] text-gray-600">Powered by SGMC Tech</p>
    </div>

    <div id="toast-box" class="fixed top-5 left-1/2 -translate-x-1/2 bg-gray-800/90 backdrop-blur text-white px-5 py-3 rounded-full text-xs font-bold opacity-0 transition pointer-events-none z-[200] border border-gray-700 shadow-2xl flex items-center gap-2"></div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyBadYpoNTL0dHkBQO4UddRVtPIfUOlf-bA", authDomain: "sgmc-16568.firebaseapp.com", projectId: "sgmc-16568", storageBucket: "sgmc-16568.firebasestorage.app", messagingSenderId: "339041646158", appId: "1:339041646158:web:85d9a50a3b51b30aae351f", measurementId: "G-4996NPF55N" };
        firebase.initializeApp(firebaseConfig); 
        const db = firebase.firestore();

        let rider = null;
        let locationInterval = null;

        function init() {
            const stored = localStorage.getItem('sgmc_rider_profile');
            if(stored) {
                rider = JSON.parse(stored);
                verifyRiderStatus(); 
            }
        }

        // --- AUTH & PROFILE ---
        function verifyRiderStatus() {
            db.collection('riders').doc(rider.phone).onSnapshot(doc => {
                if(doc.exists) {
                    const data = doc.data();
                    rider = {...rider, ...data}; // Merge updates
                    localStorage.setItem('sgmc_rider_profile', JSON.stringify(rider));
                    
                    // Update UI
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('sb-name').innerText = rider.name;
                    document.getElementById('sb-avatar').innerText = rider.name.charAt(0);
                    document.getElementById('pf-name').innerText = rider.name;
                    document.getElementById('pf-avatar').innerText = rider.name.charAt(0);
                    document.getElementById('pf-phone').innerText = rider.phone;
                    document.getElementById('pf-join').innerText = rider.joinedAt ? new Date(rider.joinedAt.toDate()).toLocaleDateString() : 'N/A';
                    document.getElementById('cash-hand').innerText = rider.cashInHand || 0;
                    
                    // Start Tracking
                    startLocationTracking();
                    startOrderListening();
                } else {
                    logout();
                }
            });
        }

        function riderLogin() {
            const phone = document.getElementById('r-phone').value.trim();
            const btn = document.getElementById('login-btn');
            const err = document.getElementById('login-error');
            
            if(phone.length < 10) return showToast("Enter valid number", "error");
            
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Checking...';
            db.collection('riders').doc(phone).get().then(doc => {
                if(doc.exists) {
                    rider = doc.data();
                    localStorage.setItem('sgmc_rider_profile', JSON.stringify(rider));
                    verifyRiderStatus();
                } else {
                    err.classList.remove('hidden');
                    btn.innerText = "SECURE LOGIN";
                }
            }).catch(e => { console.log(e); btn.innerText = "SECURE LOGIN"; showToast("Network Error", "error"); });
        }

        function logout() {
            localStorage.removeItem('sgmc_rider_profile');
            if(locationInterval) clearInterval(locationInterval);
            location.reload();
        }

        // --- REAL TIME LOCATION ---
        function startLocationTracking() {
            if(!navigator.geolocation) return;
            
            // Send update immediately then every 30s
            updateLocation();
            if(locationInterval) clearInterval(locationInterval);
            locationInterval = setInterval(updateLocation, 30000); 
        }

        function updateLocation() {
            navigator.geolocation.getCurrentPosition(pos => {
                const { latitude, longitude } = pos.coords;
                // Update Firestore
                db.collection('riders').doc(rider.phone).update({
                    location: { lat: latitude, lng: longitude },
                    lastActive: firebase.firestore.FieldValue.serverTimestamp(),
                    isOnline: true
                });
            }, err => console.log("Loc Error:", err));
        }

        // --- ORDER MANAGEMENT ---
        function startOrderListening() {
            db.collection('orders').orderBy('timestamp', 'desc').limit(50).onSnapshot(snap => {
                const assignedEl = document.getElementById('assigned-list');
                const activeEl = document.getElementById('active-list');
                const historyEl = document.getElementById('history-list');
                
                assignedEl.innerHTML = ''; activeEl.innerHTML = ''; historyEl.innerHTML = '';
                
                let newCount = 0;
                let activeCount = 0;
                let totalDeliveries = 0;

                snap.docs.forEach(doc => {
                    const d = doc.data();
                    const id = doc.id;
                    
                    // LOGIC FOR TABS
                    // 1. New/Assigned: Status is Ready OR (Assigned to me but not picked up yet)
                    // Note: You can customize 'assigned' logic if you add an 'assigned' status later. 
                    // For now, 'ready' means available for all.
                    if(d.status === 'ready') {
                        newCount++;
                        renderCard(id, d, assignedEl, 'assigned');
                    }
                    // 2. Active: Status is 'out_delivery' AND Rider matches
                    else if(d.status === 'out_delivery' && d.riderPhone === rider.phone) {
                        activeCount++;
                        renderCard(id, d, activeEl, 'active');
                    }
                    // 3. History: Completed by me
                    else if(d.status === 'completed' && d.riderPhone === rider.phone) {
                        totalDeliveries++;
                        renderCard(id, d, historyEl, 'history');
                    }
                });

                document.getElementById('badge-new').innerText = newCount;
                document.getElementById('badge-new').classList.toggle('hidden', newCount === 0);
                document.getElementById('pf-total').innerText = totalDeliveries;
                
                // Empty states
                if(newCount===0) assignedEl.innerHTML = '<div class="text-center mt-10 opacity-30"><i class="fas fa-check-circle text-4xl mb-2"></i><p>All caught up!</p></div>';
                if(activeCount===0) activeEl.innerHTML = '<div class="text-center mt-10 opacity-30"><i class="fas fa-motorcycle text-4xl mb-2"></i><p>No active runs</p></div>';
            });
        }

        function renderCard(id, d, container, type) {
            const isCOD = d.paymentMode === 'Cash' || d.paymentMode === 'Udhaar';
            const address = d.customerAddress || "No Address Provided";
            const mapLink = d.customerCoordinates ? `http://googleusercontent.com/maps.google.com/?q=${d.customerCoordinates.lat},${d.customerCoordinates.lng}` : `http://googleusercontent.com/maps.google.com/?q=${encodeURIComponent(address)}`;
            
            let btnHtml = '';
            
            if(type === 'assigned') {
                btnHtml = `<button onclick="acceptOrder('${id}')" class="w-full py-3 rounded-xl bg-gradient-to-r from-orange-600 to-orange-500 text-white font-bold text-sm shadow-lg shadow-orange-900/30 active:scale-95 transition mt-3">ACCEPT & PICKUP</button>`;
            } else if (type === 'active') {
                btnHtml = `
                <div class="grid grid-cols-2 gap-3 mt-3">
                    <a href="tel:${d.customerPhone}" class="py-3 rounded-xl bg-gray-800 text-white font-bold text-center border border-gray-700"><i class="fas fa-phone mr-2"></i>Call</a>
                    <a href="${mapLink}" target="_blank" class="py-3 rounded-xl bg-gray-800 text-green-500 font-bold text-center border border-gray-700"><i class="fas fa-location-arrow mr-2"></i>Map</a>
                </div>
                <div class="swipe-btn-container" id="swipe-${id}">
                    <div class="swipe-text">SLIDE TO COMPLETE</div>
                    <div class="swipe-handle" ontouchstart="startDrag(event, '${id}', ${d.totalAmount}, '${d.paymentMode}')" ontouchmove="drag(event)" ontouchend="endDrag(event)"><i class="fas fa-chevron-right"></i></div>
                </div>`;
            } else {
                btnHtml = `<div class="mt-3 pt-3 border-t border-gray-800 flex justify-between text-xs text-gray-500"><span>Delivered</span><span>${d.deliveryTime ? new Date(d.deliveryTime.toDate()).toLocaleTimeString() : ''}</span></div>`;
            }

            const html = `
            <div class="rider-card border-l-4 ${type==='history'?'border-gray-600 opacity-75': isCOD ? 'border-red-500' : 'border-blue-500'}">
                <div class="flex justify-between items-start mb-2">
                    <div>
                        <h3 class="font-bold text-white text-lg">${d.customerName}</h3>
                        <p class="text-xs text-gray-500">#${d.shortId || id.slice(0,5)}</p>
                    </div>
                    <div class="text-right">
                        <span class="status-pill ${isCOD ? 'bg-red-500/10 text-red-500 border border-red-500/20' : 'bg-blue-500/10 text-blue-500 border border-blue-500/20'}">${d.paymentMode}</span>
                        <p class="text-xl font-black text-white mt-1">₹${d.totalAmount}</p>
                    </div>
                </div>
                
                <div class="bg-black/30 p-3 rounded-lg border border-white/5">
                    <p class="text-xs text-gray-500 mb-1 flex items-center gap-1"><i class="fas fa-map-marker-alt text-orange-500"></i> Drop Location</p>
                    <p class="text-sm font-medium text-gray-200 leading-snug">${address}</p>
                    ${d.recipient ? `<p class="text-xs text-blue-400 mt-2 border-t border-white/5 pt-2"><i class="fas fa-user-tag mr-1"></i> Receiver: ${d.recipient.name}</p>` : ''}
                </div>
                ${btnHtml}
            </div>`;
            
            container.innerHTML += html;
        }

        // --- ACTIONS ---
        function acceptOrder(id) {
            if(navigator.vibrate) navigator.vibrate(50);
            db.collection('orders').doc(id).update({
                status: 'out_delivery',
                riderName: rider.name,
                riderPhone: rider.phone,
                pickupTime: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                showToast("Order Accepted! 🚀", "success");
                switchTab('active');
            });
        }

        // --- SWIPE LOGIC ---
        let startX, currentX, activeSwipeId, activeAmount, activePayMode;
        
        function startDrag(e, id, amt, mode) {
            activeSwipeId = id; activeAmount = amt; activePayMode = mode;
            startX = e.touches[0].clientX;
            e.target.closest('.swipe-handle').style.transition = 'none';
        }

        function drag(e) {
            if(!activeSwipeId) return;
            const handle = e.target.closest('.swipe-handle');
            const max = handle.parentElement.offsetWidth - 55;
            currentX = e.touches[0].clientX - startX;
            if(currentX > 0 && currentX <= max) {
                handle.style.left = currentX + 'px';
                handle.style.background = `rgba(249, 115, 22, ${1 - currentX/max})`; 
            }
        }

        function endDrag(e) {
            if(!activeSwipeId) return;
            const handle = e.target.closest('.swipe-handle');
            const max = handle.parentElement.offsetWidth - 55;
            
            if(currentX > max - 10) { // Threshold
                handle.style.left = max + 'px';
                handle.style.background = '#22c55e';
                handle.innerHTML = '<i class="fas fa-check"></i>';
                
                // COMPLETE ORDER
                db.collection('orders').doc(activeSwipeId).update({
                    status: 'completed',
                    deliveryTime: firebase.firestore.FieldValue.serverTimestamp(),
                    paymentVerified: true
                }).then(() => {
                    if(activePayMode === 'Cash') {
                        const newCash = (rider.cashInHand || 0) + activeAmount;
                        db.collection('riders').doc(rider.phone).update({ cashInHand: newCash });
                    }
                    showToast("Delivery Complete! 💰", "success");
                    if(navigator.vibrate) navigator.vibrate([100,50,100]);
                });
            } else {
                handle.style.transition = '0.3s';
                handle.style.left = '0px';
                handle.style.background = '#F97316';
            }
            activeSwipeId = null;
        }

        // --- UI UTILS ---
        function switchTab(t) {
            document.getElementById('view-assigned').classList.toggle('hidden', t !== 'assigned');
            document.getElementById('view-active').classList.toggle('hidden', t !== 'active');
            document.getElementById('view-history').classList.toggle('hidden', t !== 'history');
            
            // Reset styles
            ['assigned','active','history'].forEach(x => {
                const btn = document.getElementById('tab-'+x);
                if(x===t) btn.className = "flex-1 py-3 rounded-xl bg-orange-600 text-white text-xs font-bold shadow-lg shadow-orange-900/20 relative";
                else btn.className = "flex-1 py-3 rounded-xl bg-gray-900 border border-gray-800 text-gray-400 text-xs font-bold relative";
            });
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebar-overlay').classList.toggle('open');
        }

        function openProfile() { document.getElementById('profile-modal').classList.add('open'); }
        
        function openCashHistory() {
            document.getElementById('cash-history-modal').classList.add('open');
            const list = document.getElementById('cash-logs-list');
            list.innerHTML = '<p class="text-center text-gray-500 mt-4">Loading...</p>';
            
            // Fetch settlements
            db.collection('payments').where('riderPhone', '==', rider.phone).orderBy('timestamp', 'desc').limit(20).get().then(snap => {
                if(snap.empty) { list.innerHTML = '<p class="text-center text-gray-500 mt-4">No history yet.</p>'; return; }
                list.innerHTML = snap.docs.map(d => {
                    const l = d.data();
                    return `<div class="p-3 bg-gray-900 rounded-xl border border-gray-800 flex justify-between items-center">
                        <div>
                            <p class="text-sm font-bold text-white">${l.type === 'rider_settlement' ? 'Cash Deposited to Admin' : 'Transaction'}</p>
                            <p class="text-xs text-gray-500">${new Date(l.timestamp.toDate()).toLocaleString()}</p>
                        </div>
                        <span class="text-red-500 font-bold">-₹${l.amount}</span>
                    </div>`;
                }).join('');
            });
        }

        function showToast(msg, type='info') {
            const t = document.getElementById('toast-box');
            let icon = type==='success' ? '<i class="fas fa-check-circle text-green-500"></i>' : type==='error' ? '<i class="fas fa-times-circle text-red-500"></i>' : '<i class="fas fa-info-circle text-blue-500"></i>';
            t.innerHTML = `${icon} <span>${msg}</span>`;
            t.style.opacity = '1';
            t.style.top = '20px';
            setTimeout(() => { t.style.opacity = '0'; t.style.top = '5px'; }, 2500);
        }
        
        function forceRefresh() { location.reload(); }

        init();
    </script>
</body>
</html>
