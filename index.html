<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGMC Chai Stall</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        .item-card { background: #1e1e1e; border-radius: 16px; border: 1px solid #333; }
        .btn-primary { background: linear-gradient(135deg, #FF6B6B, #FF8E53); color: white; }
        .floating-cart { box-shadow: 0 -4px 15px rgba(0,0,0,0.7); background: #1f2937; }
    </style>
</head>
<body class="pb-28 select-none">

    <div class="p-4 flex justify-between items-center bg-gray-900 sticky top-0 z-20 shadow-lg border-b border-gray-800">
        <h1 class="text-xl font-bold text-orange-500 tracking-wider"><i class="fas fa-mug-hot mr-2"></i>SGMC</h1>
        <div id="shop-status-badge" class="px-3 py-1 rounded-full text-xs font-bold bg-gray-600 text-white animate-pulse">Loading...</div>
    </div>

    <div class="p-4 grid grid-cols-1 gap-4" id="menu-container">
        </div>

    <div id="shop-closed-overlay" class="fixed inset-0 bg-black/95 z-50 flex flex-col items-center justify-center hidden text-center p-6">
        <i class="fas fa-store-slash text-6xl text-gray-600 mb-6"></i>
        <h2 class="text-3xl font-bold text-red-500 mb-2">Dukan Band Hai</h2>
        <p class="text-gray-400">Order abhi nahi liya ja raha.</p>
    </div>

    <div id="cart-bar" class="fixed bottom-0 left-0 w-full floating-cart p-4 rounded-t-3xl hidden z-40">
        <div class="flex justify-between items-center max-w-md mx-auto">
            <div class="flex flex-col">
                <span class="text-gray-400 text-xs font-medium uppercase"><span id="cart-count">0</span> Items</span>
                <span class="text-2xl font-bold text-white">₹<span id="cart-total">0</span></span>
            </div>
            <button onclick="openCheckout()" class="btn-primary px-8 py-3 rounded-xl font-bold shadow-lg">
                View Cart <i class="fas fa-shopping-bag ml-2"></i>
            </button>
        </div>
    </div>

    <div id="checkout-modal" class="fixed inset-0 bg-black/90 z-50 hidden flex items-end sm:items-center justify-center">
        <div class="bg-gray-800 w-full max-w-md p-6 rounded-t-3xl sm:rounded-3xl shadow-2xl relative">
            <button onclick="closeCheckout()" class="absolute top-4 right-4 text-gray-400 text-xl"><i class="fas fa-times"></i></button>
            <h2 class="text-2xl font-bold mb-6 text-white">Finalize Order</h2>
            
            <div class="space-y-4">
                <input type="text" id="c-name" class="w-full p-3 bg-gray-700 rounded-xl text-white outline-none focus:ring-2 focus:ring-orange-500" placeholder="Apna Naam (Name)">
                <input type="tel" id="c-phone" class="w-full p-3 bg-gray-700 rounded-xl text-white outline-none focus:ring-2 focus:ring-orange-500" placeholder="Mobile Number">

                <div>
                    <label class="text-xs text-gray-400 uppercase ml-1">Payment Method</label>
                    <div class="grid grid-cols-3 gap-3 mt-1">
                        <button onclick="selectPayment('Cash')" class="pay-btn p-3 bg-gray-700 rounded-xl border border-gray-600 text-sm font-bold">💵 Cash</button>
                        <button onclick="selectPayment('UPI')" class="pay-btn p-3 bg-gray-700 rounded-xl border border-gray-600 text-sm font-bold">📱 UPI</button>
                        <button onclick="selectPayment('Udhaar')" class="pay-btn p-3 bg-gray-700 rounded-xl border border-gray-600 text-sm font-bold">📒 Udhaar</button>
                    </div>
                </div>

                <input type="hidden" id="selected-payment" value="">
                <p id="payment-msg" class="text-xs text-orange-400 h-4 text-center font-medium"></p>

                <button onclick="placeOrder()" id="confirm-btn" class="w-full bg-green-600 text-white p-4 rounded-xl font-bold text-lg shadow-lg mt-2">
                    Confirm Order
                </button>
            </div>
        </div>
    </div>

    <script>
        // *** CONFIGURATION ***
        const YOUR_UPI_ID = "9523196156@ybl"; // <--- Replace with your UPI ID (e.g. number@ybl)
        
        const firebaseConfig = {
            apiKey: "AIzaSyBadYpoNTL0dHkBQO4UddRVtPIfUOlf-bA",
            authDomain: "sgmc-16568.firebaseapp.com",
            projectId: "sgmc-16568",
            storageBucket: "sgmc-16568.firebasestorage.app",
            messagingSenderId: "339041646158",
            appId: "1:339041646158:web:85d9a50a3b51b30aae351f",
            measurementId: "G-4996NPF55N"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const menuItems = [
            { id: 1, name: "Masala Chai", price: 10, icon: "☕" },
            { id: 2, name: "Coffee", price: 20, icon: "🥤" },
            { id: 3, name: "Bun Maska", price: 25, icon: "🥯" },
            { id: 4, name: "Veg Maggi", price: 30, icon: "🍜" },
            { id: 5, name: "Cheese Maggi", price: 45, icon: "🧀" },
            { id: 6, name: "Samosa", price: 15, icon: "🥟" },
            { id: 7, name: "Patties", price: 20, icon: "🥐" },
            { id: 8, name: "Cold Drink", price: 20, icon: "🧊" }
        ];

        let cart = {}; 

        function init() {
            const container = document.getElementById('menu-container');
            container.innerHTML = menuItems.map(item => `
                <div class="item-card p-4 flex justify-between items-center shadow-md">
                    <div class="flex items-center space-x-4">
                        <span class="text-3xl">${item.icon}</span>
                        <div>
                            <h3 class="font-bold text-lg text-white">${item.name}</h3>
                            <p class="text-orange-400 font-medium">₹${item.price}</p>
                        </div>
                    </div>
                    <div class="flex items-center bg-gray-800 rounded-lg overflow-hidden border border-gray-600">
                        <button onclick="updateCart(${item.id}, -1)" class="w-8 h-8 flex items-center justify-center text-red-400 font-bold">-</button>
                        <span id="qty-${item.id}" class="w-6 text-center text-sm font-bold text-white">0</span>
                        <button onclick="updateCart(${item.id}, 1)" class="w-8 h-8 flex items-center justify-center text-green-400 font-bold">+</button>
                    </div>
                </div>
            `).join('');

            db.collection('settings').doc('status').onSnapshot(doc => {
                const isOpen = doc.exists ? doc.data().isOpen : true;
                const overlay = document.getElementById('shop-closed-overlay');
                const badge = document.getElementById('shop-status-badge');
                
                if(!isOpen) {
                    overlay.classList.remove('hidden');
                    badge.innerText = "CLOSED";
                    badge.className = "px-3 py-1 rounded-full text-xs font-bold bg-red-600 text-white";
                } else {
                    overlay.classList.add('hidden');
                    badge.innerText = "OPEN";
                    badge.className = "px-3 py-1 rounded-full text-xs font-bold bg-green-600 text-white";
                }
            });
        }

        function updateCart(id, change) {
            if (!cart[id]) cart[id] = 0;
            cart[id] += change;
            if (cart[id] < 0) cart[id] = 0;
            document.getElementById(`qty-${id}`).innerText = cart[id];
            renderCartSummary();
        }

        function renderCartSummary() {
            let total = 0;
            let count = 0;
            for (const [id, qty] of Object.entries(cart)) {
                if (qty > 0) {
                    const item = menuItems.find(i => i.id == parseInt(id));
                    total += item.price * qty;
                    count += qty;
                }
            }
            document.getElementById('cart-total').innerText = total;
            document.getElementById('cart-count').innerText = count;
            const cartBar = document.getElementById('cart-bar');
            if (count > 0) cartBar.classList.remove('hidden');
            else cartBar.classList.add('hidden');
        }

        function openCheckout() { document.getElementById('checkout-modal').classList.remove('hidden'); }
        function closeCheckout() { document.getElementById('checkout-modal').classList.add('hidden'); }
        
        function selectPayment(mode) {
            document.getElementById('selected-payment').value = mode;
            document.querySelectorAll('.pay-btn').forEach(b => {
                b.classList.remove('bg-orange-600', 'text-white', 'border-transparent');
                b.classList.add('bg-gray-700', 'border-gray-600');
            });
            event.target.classList.remove('bg-gray-700', 'border-gray-600');
            event.target.classList.add('bg-orange-600', 'text-white', 'border-transparent');
            
            const msg = document.getElementById('payment-msg');
            if(mode === 'UPI') msg.innerText = "App automatically khulega.";
            else if(mode === 'Udhaar') msg.innerText = "Udhaar ke liye Number jaruri hai.";
            else msg.innerText = "Counter pe cash de dena.";
        }

        function placeOrder() {
            const btn = document.getElementById('confirm-btn');
            const name = document.getElementById('c-name').value.trim();
            const phone = document.getElementById('c-phone').value.trim();
            const mode = document.getElementById('selected-payment').value;
            const total = parseInt(document.getElementById('cart-total').innerText);

            if (!mode) { alert("Payment method select karo!"); return; }
            if (!name) { alert("Naam likhna jaruri hai!"); return; }
            if (mode === 'Udhaar' && (!phone || phone.length < 10)) { alert("Udhaar ke liye sahi Mobile Number jaruri hai!"); return; }

            btn.disabled = true;
            btn.innerText = "Ordering...";

            const items = [];
            for (const [id, qty] of Object.entries(cart)) {
                if (qty > 0) {
                    const i = menuItems.find(x => x.id == id);
                    items.push({ name: i.name, qty: qty, price: i.price });
                }
            }

            const orderData = {
                customerName: name,
                customerPhone: phone,
                items: items,
                totalAmount: total,
                paymentMode: mode,
                status: 'pending',
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };

            db.collection('orders').add(orderData).then(() => {
                if (mode === 'UPI') {
                    // Deep link to open any UPI app
                    const upiLink = `upi://pay?pa=${YOUR_UPI_ID}&pn=SGMC&am=${total}&tn=Order-${name}`;
                    window.location.href = upiLink;
                }
                alert("Order Bhej Diya! ✅");
                location.reload();
            }).catch(err => {
                alert("Error: " + err.message);
                btn.disabled = false;
                btn.innerText = "Confirm Order";
            });
        }
        init();
    </script>
</body>
</html>
