<!DOCTYPE html>
<html>
<head>
  <title>SGMC Chai</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      padding: 20px;
    }
    h2 {
      text-align: center;
      color: #6b3e26;
    }
    .box {
      background: white;
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
    }
    select, input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      font-size: 16px;
    }
    button {
      background: #6b3e26;
      color: white;
      border: none;
      border-radius: 5px;
    }
  </style>
</head>

<body>

<h2>☕ SGMC Chai</h2>

<div class="box">
  <label>Chai choose karo</label>
  <select>
    <option>Normal Chai - ₹10</option>
    <option>Adrak Chai - ₹15</option>
    <option>Masala Chai - ₹20</option>
  </select>

  <label>Quantity</label>
  <input type="number" placeholder="Kitni chai">

  <label>Delivery Address</label>
  <input type="text" placeholder="Market / Shop number">
<button onclick="placeOrder()">Order Now</button>

  
</div>
<script>
function placeOrder() {
  let chai = document.querySelector("select").value;
  let qty = document.querySelector('input[type="number"]').value;
  let address = document.querySelector('input[type="text"]').value;

  if(qty === "" || qty <= 0){
    alert("Quantity sahi daal bhai 😄");
    return;
  }

  if(address === ""){
    alert("Delivery address likhna zaruri hai");
    return;
  }

  let price = 0;
  if(chai.includes("₹10")) price = 10;
  if(chai.includes("₹15")) price = 15;
  if(chai.includes("₹20")) price = 20;

  let total = price * qty;
let orders = JSON.parse(localStorage.getItem("orders")) || [];

orders.push({
  chai: chai,
  qty: qty,
  total: total,
  address: address,
  status: "Placed"
});

localStorage.setItem("orders", JSON.stringify(orders));

  alert(
    "☕ SGMC Order Confirmed!\n\n" +
    "Chai: " + chai + "\n" +
    "Quantity: " + qty + "\n" +
    "Total: ₹" + total + "\n\n" +
    "Delivery Address:\n" + address
  );
}
</script>

</body>
</html>
