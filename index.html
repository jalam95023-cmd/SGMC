<!DOCTYPE html>
<html>
<head>
  <title>SGMC – Chai Order</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body { font-family: Arial; background:#f5f5f5; margin:0 }
    header { background:#7b1e1e; color:white; padding:12px; text-align:center }
    .box { background:white; margin:12px; padding:12px; border-radius:6px }
    .item { display:flex; justify-content:space-between; margin:6px 0 }
    button { padding:6px 10px }
    .green { background:green; color:white; border:none; padding:12px; width:100%; font-size:16px }
    input { width:100%; padding:8px; margin:6px 0 }
  </style>
</head>

<body>

<header>☕ SGMC – Chai Order</header>

<div class="box" id="menu"></div>

<div class="box">
  <input id="name" placeholder="Your Name">
  <input id="phone" placeholder="Phone Number">
  <input id="address" placeholder="Delivery Address">
  <h3>Total: ₹<span id="total">0</span></h3>
  <button class="green" onclick="placeOrder()">Place Order (COD)</button>
</div>

<script type="module">
  // 🔥 Firebase
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp } 
    from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCcUPgsZYqNZyZAUwOhBYpn5_tWeDuRrUg",
    authDomain: "sgmc-chai-app.firebaseapp.com",
    projectId: "sgmc-chai-app",
    storageBucket: "sgmc-chai-app.appspot.com",
    messagingSenderId: "526306668928",
    appId: "1:526306668928:web:79b73a6dbf9b6de75fd165"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // 🍵 Menu
  const items = [
    {name:"Normal Chai", price:10},
    {name:"Adrak Chai", price:15},
    {name:"Masala Chai", price:20},
    {name:"Biscuit", price:10},
    {name:"Cigarette", price:20},
    {name:"Mathhi", price:5}
  ];

  let cart = {};
  let total = 0;

  const menu = document.getElementById("menu");
  items.forEach(i=>{
    cart[i.name]=0;
    menu.innerHTML += `
      <div class="item">
        ${i.name} ₹${i.price}
        <span>
          <button onclick="add('${i.name}',${i.price})">+</button>
          <span id="${i.name}">0</span>
          <button onclick="sub('${i.name}',${i.price})">-</button>
        </span>
      </div>
    `;
  });

  window.add = (n,p)=>{
    cart[n]++; total+=p;
    document.getElementById(n).innerText=cart[n];
    document.getElementById("total").innerText=total;
  }

  window.sub = (n,p)=>{
    if(cart[n]>0){ cart[n]--; total-=p; }
    document.getElementById(n).innerText=cart[n];
    document.getElementById("total").innerText=total;
  }

  // 🚀 PLACE ORDER
  window.placeOrder = async ()=>{
    const name = name.value;
    const phone = phone.value;
    const address = address.value;

    if(total===0 || !address){
      alert("Add items & address");
      return;
    }

    await addDoc(collection(db,"Orders"),{
      name,
      phone,
      address,
      items: cart,
      total,
      status: "Placed",
      createdAt: serverTimestamp()
    });

    alert("☕ Order Placed Successfully!");
    location.reload();
  }
</script>

</body>
</html>
