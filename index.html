<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SGMC Chai</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #050505; color: white; font-family: sans-serif; -webkit-tap-highlight-color: transparent; padding-bottom: 140px; }
        .glass-card { background: rgba(30, 30, 30, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(10px); border-top: 1px solid #222; display: flex; justify-content: space-around; padding: 10px; padding-bottom: 20px; z-index: 50; }
        .nav-item.active { color: #F97316; } 
        /* Ticker */
        .ticker-wrap { position: fixed; top: 60px; left: 0; right: 0; background: linear-gradient(90deg, #F97316, #ec4899); color: white; font-size: 11px; overflow: hidden; height: 24px; line-height: 24px; z-index: 30; }
        .ticker { display: inline-block; white-space: nowrap; padding-left: 100%; animation: ticker 15s linear infinite; }
        @keyframes ticker { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-100%, 0, 0); } }
        /* Transitions */
        .animate-fade-in { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="fixed top-0 left-0 right-0 bg-[#050505]/90 backdrop-blur-md z-40 px-4 py-3 flex justify-between items-center border-b border-white/5">
        <div><h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-orange-500 to-yellow-500">SGMC <span class="text-white text-sm font-normal">Chai</span></h1><p class="text-[10px] text-green-500 font-bold" id="shop-status-badge">● LIVE</p></div>
        <div class="flex items-center gap-2" onclick="openProfileEdit()"><div class="text-right"><p class="text-xs font-bold" id="header-name">Guest</p></div><div class="w-9 h-9 bg-gray-800 rounded-full flex items-center justify-center text-orange-500 border border-gray-700"><i class="fas fa-user"></i></div></div>
    </div>
    
    <div id="broadcast-bar" class="ticker-wrap hidden"><div class="ticker" id="broadcast-msg">Welcome!</div></div>
    <div class="h-20"></div>

    <div id="view-menu" class="pb-10">
        <div class="sticky top-[60px] z-30 bg-[#050505]/95 px-4 pt-2 pb-1 border-b border-white/5">
            <input type="text" id="search-input" onkeyup="filterMenu()" placeholder="Search..." class="w-full bg-gray-900 border border-gray-800 rounded-xl py-2 pl-4 text-sm mb-2 outline-none">
            <div class="flex gap-2 overflow-x-auto pb-2" id="category-container">
                <button onclick="setCategory('All')" class="px-4 py-1 rounded-full text-xs font-bold bg-white text-black">All</button>
                <button onclick="setCategory('Chai')" class="px-4 py-1 rounded-full text-xs font-bold bg-gray-800 text-gray-400">Chai</button>
                <button onclick="setCategory('Snacks')" class="px-4 py-1 rounded-full text-xs font-bold bg-gray-800 text-gray-400">Snacks</button>
                <button onclick="setCategory('Sutta')" class="px-4 py-1 rounded-full text-xs font-bold bg-gray-800 text-gray-400">Sutta</button>
            </div>
        </div>
        <div id="closed-banner" class="hidden m-4 bg-red-900/20 p-4 rounded-xl text-center text-red-200">Shop Closed</div>
        <div id="menu-container" class="space-y-3 p-4"></div>
    </div>

    <div id="view-orders" class="hidden p-4">
        <h2 class="text-xl font-bold mb-4">My Orders</h2>
        <div id="orders-list" class="space-y-3"></div>
    </div>

    <div id="view-udhaar" class="hidden p-4">
        <div class="glass-card p-6 text-center mb-6 border-blue-500/20">
            <p class="text-gray-400 text-xs">PENDING DUES</p>
            <h1 class="text-5xl font-bold text-blue-400">₹<span id="my-udhaar-amount">0</span></h1>
            <div id="upi-pay-btn" class="mt-4 hidden"><button onclick="payUPI()" class="bg-blue-600 px-6 py-2 rounded-full text-sm font-bold">Pay Now</button></div>
        </div>
        <div id="udhaar-history" class="space-y-2"></div>
    </div>

    <div id="cart-bar" class="fixed bottom-20 left-4 right-4 bg-orange-600 text-white p-3 px-5 rounded-2xl shadow-xl flex justify-between items-center z-40 hidden" onclick="openCheckout()">
        <div class="flex items-center gap-3"><span class="bg-white text-orange-600 w-6 h-6 rounded-full flex items-center justify-center font-bold text-xs" id="cart-count">0</span><span class="font-bold">₹<span id="cart-total">0</span></span></div>
        <span class="font-bold text-sm">Checkout ></span>
    </div>

    <div id="checkout-modal" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-[#151515] w-full max-w-sm p-6 rounded-2xl border border-gray-800 max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between mb-4"><h2 class="text-xl font-bold">Checkout</h2><button onclick="document.getElementById('checkout-modal').classList.add('hidden')"><i class="fas fa-times"></i></button></div>
            <div id="checkout-items" class="space-y-2 mb-4"></div>
            
            <div class="bg-gray-900 p-3 rounded-lg mb-4 border border-gray-800">
                <label class="flex items-center gap-2 mb-2 cursor-pointer">
                    <input type="checkbox" id="order-for-others" onchange="toggleRecipientFields()" class="accent-orange-500 w-4 h-4">
                    <span class="text-xs text-gray-300 font-bold">Ordering for someone else?</span>
                </label>
                <div id="recipient-fields" class="hidden space-y-2 animate-fade-in">
                    <input type="text" id="recipient-name" placeholder="Friend's Name" class="w-full bg-black border border-gray-700 rounded p-2 text-xs text-white">
                    <input type="tel" id="recipient-phone" placeholder="Friend's Phone" class="w-full bg-black border border-gray-700 rounded p-2 text-xs text-white">
                </div>
            </div>

            <textarea id="order-note" class="w-full bg-gray-900 border border-gray-800 rounded p-2 text-sm mb-4 text-white" placeholder="Instructions..."></textarea>
            
            <div class="flex gap-2 mb-4">
                <div class="relative flex-1"><input type="text" id="order-address" class="w-full bg-gray-900 border border-gray-800 rounded p-3 text-sm text-white" placeholder="Address"></div>
                <button onclick="detectLocation()" class="bg-gray-800 px-3 rounded text-orange-500 border border-gray-700 active:scale-95" id="btn-detect"><i class="fas fa-crosshairs"></i></button>
            </div>
            
            <div class="grid grid-cols-3 gap-2 mb-4">
                <button onclick="setPayment('Cash')" id="pay-cash" class="p-2 bg-gray-800 rounded text-xs border border-gray-700 text-gray-300 font-bold">Cash</button>
                <button onclick="setPayment('UPI')" id="pay-upi" class="p-2 bg-gray-800 rounded text-xs border border-gray-700 text-gray-300 font-bold">UPI</button>
                <button onclick="setPayment('Udhaar')" id="pay-udhaar" class="p-2 bg-gray-800 rounded text-xs border border-gray-700 text-gray-300 font-bold">Udhaar</button>
            </div>

            <button onclick="placeOrder()" class="w-full bg-orange-600 py-3 rounded font-bold text-white shadow-lg">Place Order (₹<span id="chk-total">0</span>)</button>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item text-gray-500 active" onclick="switchTab('menu')" id="nav-menu"><i class="fas fa-th-large block text-center mb-1"></i>Menu</div>
        <div class="nav-item text-gray-500" onclick="switchTab('orders')" id="nav-orders"><i class="fas fa-receipt block text-center mb-1"></i>Orders</div>
        <div class="nav-item text-gray-500" onclick="switchTab('udhaar')" id="nav-udhaar"><i class="fas fa-wallet block text-center mb-1"></i>Udhaar</div>
    </div>

    <div id="login-modal" class="fixed inset-0 bg-black/90 hidden flex items-center justify-center p-6 z-[60]"><div class="bg-gray-900 w-full max-w-xs p-6 rounded-2xl"><h2 class="text-xl font-bold mb-4">Profile</h2><input id="user-name" placeholder="Name" class="w-full bg-black p-3 rounded mb-2 text-white"><input id="user-phone" placeholder="Phone" class="w-full bg-black p-3 rounded mb-4 text-white"><button onclick="saveProfile()" class="w-full bg-orange-600 p-3 rounded font-bold text-white">Save</button></div></div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyBadYpoNTL0dHkBQO4UddRVtPIfUOlf-bA", authDomain: "sgmc-16568.firebaseapp.com", projectId: "sgmc-16568", storageBucket: "sgmc-16568.firebasestorage.app", messagingSenderId: "339041646158", appId: "1:339041646158:web:85d9a50a3b51b30aae351f", measurementId: "G-4996NPF55N" };
        firebase.initializeApp(firebaseConfig); const db = firebase.firestore();

        let cart={}, userProfile={}, selectedPayment='Cash', isShopOpen=true, userLocation=null, shopLocation=null;
        const baseItems = [{id:1,name:"Normal Chai",price:10,category:"Chai"},{id:2,name:"Adrak Chai",price:15,category:"Chai"},{id:3,name:"Cigarette",price:0,category:"Sutta"},{id:4,name:"Matthi",price:5,category:"Snacks"}]; 

        function init() {
            if(localStorage.getItem('sgmc_customer_profile')) userProfile=JSON.parse(localStorage.getItem('sgmc_customer_profile')); else document.getElementById('login-modal').classList.remove('hidden');
            db.collection('settings').doc('config').onSnapshot(d=>{ if(d.exists && d.data().location) shopLocation=d.data().location; });
            db.collection('settings').doc('status').onSnapshot(d=>{ isShopOpen=d.exists?d.data().isOpen:true; document.getElementById('closed-banner').className=isShopOpen?'hidden':'m-4 bg-red-900/20 p-4 rounded-xl text-center text-red-200'; });
            renderMenu(); switchTab('menu');
        }

        function renderMenu() {
            document.getElementById('menu-container').innerHTML = baseItems.map(i=> `
                <div class="glass-card p-3 flex justify-between items-center">
                    <div><h3 class="font-bold">${i.name}</h3><p class="text-orange-400 text-xs">₹${i.price}</p></div>
                    <div class="flex items-center gap-2 bg-black/40 rounded p-1">
                        <button onclick="updateCart(${i.id},'${i.name}',${i.price},-1)" class="w-6 h-6 bg-gray-700 rounded">-</button>
                        <span id="qty-${i.id}" class="text-sm w-4 text-center">0</span>
                        <button onclick="updateCart(${i.id},'${i.name}',${i.price},1)" class="w-6 h-6 bg-orange-600 rounded">+</button>
                    </div>
                </div>
            `).join('');
        }

        function updateCart(id,name,price,chg) {
            if(!isShopOpen) return alert("Shop Closed");
            if(!cart[id]) cart[id]={id,name,price,qty:0};
            cart[id].qty+=chg; if(cart[id].qty<=0) delete cart[id];
            document.getElementById(`qty-${id}`).innerText = cart[id]?cart[id].qty:0;
            updateCartUI();
        }

        function updateCartUI() {
            let t=0, c=0; for(let k in cart){ t+=cart[k].qty*cart[k].price; c+=cart[k].qty; }
            const b=document.getElementById('cart-bar');
            if(c>0) { b.classList.remove('hidden'); b.classList.add('flex'); document.getElementById('cart-count').innerText=c; document.getElementById('cart-total').innerText=t; }
            else b.classList.add('hidden');
        }

        function openCheckout() {
            let html=''; let t=0;
            for(let k in cart) { html+=`<div class="flex justify-between text-sm"><span>${cart[k].name} x${cart[k].qty}</span><span>₹${cart[k].qty*cart[k].price}</span></div>`; t+=cart[k].qty*cart[k].price; }
            document.getElementById('checkout-items').innerHTML=html; document.getElementById('chk-total').innerText=t; document.getElementById('checkout-total').innerText=t;
            document.getElementById('checkout-modal').classList.remove('hidden');
        }

        function toggleRecipientFields() {
            const chk = document.getElementById('order-for-others');
            const div = document.getElementById('recipient-fields');
            if(chk.checked) div.classList.remove('hidden'); else div.classList.add('hidden');
        }

        function detectLocation() {
            if(!navigator.geolocation) return alert("No Geo");
            document.getElementById('btn-detect').innerHTML='...';
            navigator.geolocation.getCurrentPosition(p=>{
                userLocation={lat:p.coords.latitude,lng:p.coords.longitude};
                document.getElementById('btn-detect').innerHTML='<i class="fas fa-check"></i>';
                fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${userLocation.lat}&lon=${userLocation.lng}`)
                .then(r=>r.json()).then(d=>{ if(d.display_name) document.getElementById('order-address').value=d.display_name.split(',').slice(0,3).join(','); });
            });
        }

        function placeOrder() {
            if(!userProfile.phone) return alert("Login first");
            // Geo Check
            if(shopLocation && userLocation) {
                const R=6371, dLat=(userLocation.lat-shopLocation.lat)*Math.PI/180, dLon=(userLocation.lng-shopLocation.lng)*Math.PI/180;
                const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(shopLocation.lat*Math.PI/180)*Math.cos(userLocation.lat*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
                if((R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))) > 3) return alert("Too far (>3km). We can't deliver.");
            }

            const total = parseInt(document.getElementById('chk-total').innerText);
            
            // Recipient Logic
            let recipient = null;
            if(document.getElementById('order-for-others').checked) {
                const rName = document.getElementById('recipient-name').value;
                const rPhone = document.getElementById('recipient-phone').value;
                if(!rName || !rPhone) return alert("Enter friend's name & phone");
                recipient = { name: rName, phone: rPhone };
            }

            const order = {
                items: Object.values(cart), totalAmount: total, paymentMode: selectedPayment,
                customerName: userProfile.name, customerPhone: userProfile.phone,
                customerAddress: document.getElementById('order-address').value,
                orderNote: document.getElementById('order-note').value,
                customerCoordinates: userLocation,
                recipient: recipient, 
                status: 'pending', timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };

            db.collection('orders').add(order).then(()=>{
                cart={}; updateCartUI(); document.getElementById('checkout-modal').classList.add('hidden');
                switchTab('orders');
            });
        }

        function switchTab(t) {
            ['menu','orders','udhaar'].forEach(x=>{ document.getElementById('view-'+x).classList.add('hidden'); document.getElementById('nav-'+x).classList.remove('active','text-orange-500'); });
            document.getElementById('view-'+t).classList.remove('hidden'); document.getElementById('nav-'+t).classList.add('active','text-orange-500');
            if(t==='orders') fetchOrders();
        }

        function fetchOrders() {
            if(!userProfile.phone) return;
            db.collection('orders').where('customerPhone','==',userProfile.phone).orderBy('timestamp','desc').get().then(s=>{
                document.getElementById('orders-list').innerHTML = s.docs.map(d=>{
                    const o=d.data();
                    const canCancel = o.status === 'pending';
                    const dateStr = o.timestamp ? new Date(o.timestamp.toDate()).toLocaleDateString() : '';
                    return `<div class="glass-card p-4 border-l-4 ${o.status==='completed'?'border-green-500':o.status==='cancelled'?'border-red-500':'border-yellow-500'}">
                        <div class="flex justify-between mb-2">
                            <span class="font-bold">${dateStr}</span>
                            <span class="text-xs uppercase px-2 py-1 rounded bg-gray-700">${o.status}</span>
                        </div>
                        <p class="text-sm text-gray-400">${o.items.map(i=>i.name).join(', ')}</p>
                        ${o.recipient ? `<p class="text-xs text-blue-400 mt-1">For: ${o.recipient.name}</p>` : ''}
                        <div class="flex justify-between items-center mt-3">
                            <span class="font-bold text-orange-400">₹${o.totalAmount}</span>
                            ${canCancel ? `<button onclick="cancelOrder('${d.id}')" class="text-red-500 text-xs border border-red-500 px-3 py-1 rounded font-bold hover:bg-red-900/20">Cancel Order</button>` : ''}
                        </div>
                    </div>`;
                }).join('');
            });
        }

        function cancelOrder(id) {
            if(confirm("Are you sure you want to cancel?")) db.collection('orders').doc(id).update({status:'cancelled'}).then(()=>fetchOrders());
        }

        function saveProfile() {
            const n=document.getElementById('user-name').value, p=document.getElementById('user-phone').value;
            if(n&&p) { userProfile={name:n,phone:p}; localStorage.setItem('sgmc_customer_profile',JSON.stringify(userProfile)); document.getElementById('login-modal').classList.add('hidden'); }
        }
        function openProfileEdit() { document.getElementById('login-modal').classList.remove('hidden'); }
        function setPayment(m) { selectedPayment=m; document.querySelectorAll('#checkout-modal button').forEach(b=>b.classList.remove('bg-orange-600')); document.getElementById('pay-'+m.toLowerCase()).classList.add('bg-orange-600'); }
        
        init();
    </script>
</body>
</html>
