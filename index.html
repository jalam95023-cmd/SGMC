<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGMC Chai Stall</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        .item-card { background: #1e1e1e; border-radius: 16px; border: 1px solid #333; transition: 0.2s; }
        .btn-primary { background: linear-gradient(135deg, #FF6B6B, #FF8E53); color: white; }
        .floating-cart { box-shadow: 0 -4px 15px rgba(0,0,0,0.7); background: #1f2937; }
        #toast { visibility: hidden; min-width: 250px; background-color: #333; color: #fff; text-align: center; border-radius: 50px; padding: 16px; position: fixed; z-index: 100; left: 50%; bottom: 30px; transform: translateX(-50%); border: 1px solid #4CAF50; }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
        .shop-closed-bar { background: #EF4444; color: white; text-align: center; padding: 8px; font-size: 12px; font-weight: bold; display: none; width: 100%; position: fixed; top: 0; z-index: 50; }
    </style>
</head>
<body class="pb-32 select-none pt-0">

    <div id="shop-closed-bar" class="shop-closed-bar">⚠️ Dukan Abhi Band Hai.</div>

    <div class="p-4 flex justify-between items-center bg-gray-900 sticky top-0 z-20 border-b border-gray-800 mt-0" id="main-header">
        <h1 class="text-xl font-bold text-orange-500 tracking-wider">SGMC</h1>
        <div class="flex gap-2">
            <button onclick="showUdhaar()" class="text-xs bg-red-900/30 border border-red-600 px-3 py-1 rounded text-red-200 active:bg-red-800">
                <i class="fas fa-wallet mr-1"></i> My Udhaar
            </button>
            <button onclick="showMyOrders()" class="text-xs bg-gray-800 border border-gray-600 px-3 py-1 rounded text-white active:bg-gray-700">
                <i class="fas fa-history mr-1"></i> History
            </button>
        </div>
    </div>

    <div class="p-4 grid grid-cols-1 gap-3" id="menu-container"></div>

    <div id="live-order-tracker" class="hidden m-4 p-4 bg-blue-900/20 border border-blue-500 rounded-xl">
        <h3 class="text-blue-400 font-bold text-sm mb-1"><i class="fas fa-spinner fa-spin mr-2"></i>Live Status</h3>
        <p class="text-white text-lg font-bold" id="live-status-text">Pending...</p>
        <p class="text-xs text-gray-400 mt-1">Payment: <span id="live-payment-status" class="text-white">Checking...</span></p>
    </div>

    <div id="toast"><i class="fas fa-check-circle text-green-500 mr-2"></i> Order Placed! Thank You.</div>

    <div id="variant-modal" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-gray-800 w-full max-w-sm p-5 rounded-2xl">
            <h3 class="text-xl font-bold text-white mb-4">Choose Variant</h3>
            <div id="variant-options" class="grid grid-cols-2 gap-3"></div>
            <button onclick="closeVariantModal()" class="mt-4 w-full py-2 text-gray-400">Cancel</button>
        </div>
    </div>

    <div id="cart-bar" class="fixed bottom-0 left-0 w-full floating-cart p-4 rounded-t-3xl hidden z-40">
        <div class="flex justify-between items-center max-w-md mx-auto">
            <div class="flex flex-col">
                <span class="text-gray-400 text-xs font-medium uppercase"><span id="cart-count">0</span> Items</span>
                <span class="text-2xl font-bold text-white">₹<span id="cart-total">0</span></span>
            </div>
            <button onclick="openCheckout()" class="btn-primary px-8 py-3 rounded-xl font-bold shadow-lg">View Cart</button>
        </div>
    </div>

    <div id="checkout-modal" class="fixed inset-0 bg-black/90 z-50 hidden flex items-end sm:items-center justify-center">
        <div class="bg-gray-800 w-full max-w-md p-6 rounded-t-3xl sm:rounded-3xl shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-white">Checkout</h2>
                <button onclick="closeCheckout()" class="text-gray-400"><i class="fas fa-times"></i></button>
            </div>
            <div class="space-y-4">
                <input type="text" id="c-name" class="w-full p-3 bg-gray-700 rounded-xl text-white outline-none focus:ring-2 focus:ring-orange-500" placeholder="Apna Naam">
                <input type="tel" id="c-phone" class="w-full p-3 bg-gray-700 rounded-xl text-white outline-none focus:ring-2 focus:ring-orange-500" placeholder="Mobile Number">
                <div>
                    <label class="text-xs text-gray-400 uppercase ml-1">Payment Method</label>
                    <div class="grid grid-cols-3 gap-3 mt-1">
                        <button onclick="selectPayment('Cash')" class="pay-btn p-3 bg-gray-700 rounded-xl border border-gray-600 text-sm font-bold">💵 Cash</button>
                        <button onclick="selectPayment('UPI')" class="pay-btn p-3 bg-gray-700 rounded-xl border border-gray-600 text-sm font-bold">📱 UPI</button>
                        <button onclick="selectPayment('Udhaar')" class="pay-btn p-3 bg-gray-700 rounded-xl border border-gray-600 text-sm font-bold">📒 Udhaar</button>
                    </div>
                </div>
                <input type="hidden" id="selected-payment" value="">
                <button onclick="placeOrder()" id="confirm-btn" class="w-full bg-green-600 text-white p-4 rounded-xl font-bold text-lg shadow-lg mt-2">Confirm Order</button>
            </div>
        </div>
    </div>

    <div id="udhaar-modal" class="fixed inset-0 bg-black/95 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-gray-800 w-full max-w-sm p-6 rounded-2xl relative">
            <button onclick="document.getElementById('udhaar-modal').classList.add('hidden')" class="absolute top-4 right-4 text-gray-400"><i class="fas fa-times"></i></button>
            <h2 class="text-xl font-bold text-white mb-6">My Udhaar Details</h2>
            <div id="udhaar-content" class="text-center">
                <p class="text-gray-500 animate-pulse">Checking...</p>
            </div>
        </div>
    </div>

    <div id="history-modal" class="fixed inset-0 bg-black/95 z-50 hidden overflow-y-auto">
        <div class="p-4 max-w-md mx-auto">
            <div class="flex justify-between items-center mb-6 sticky top-0 bg-black/95 py-4 z-10">
                <h2 class="text-2xl font-bold text-white">Order History</h2>
                <button onclick="document.getElementById('history-modal').classList.add('hidden')" class="text-gray-400"><i class="fas fa-times fa-lg"></i></button>
            </div>
            <div id="history-list" class="space-y-4 pb-10"></div>
        </div>
    </div>

    <script>
        const YOUR_UPI_ID = "9523196156@ybl"; // <--- UPI ID HERE (e.g., 9876543210@paytm)
        
        const firebaseConfig = {
            apiKey: "AIzaSyBadYpoNTL0dHkBQO4UddRVtPIfUOlf-bA",
            authDomain: "sgmc-16568.firebaseapp.com",
            projectId: "sgmc-16568",
            storageBucket: "sgmc-16568.firebasestorage.app",
            messagingSenderId: "339041646158",
            appId: "1:339041646158:web:85d9a50a3b51b30aae351f",
            measurementId: "G-4996NPF55N"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const menuItems = [
            { id: 1, name: "Normal Chai", price: 10, icon: "☕", type: "simple" },
            { id: 2, name: "Adrak Chai", price: 15, icon: "🍵", type: "simple" },
            { id: 3, name: "Cigarette", price: 0, icon: "🚬", type: "variant", variants: [ {name: "Chhoti Gold", price: 10}, {name: "Advance", price: 18}, {name: "Marlboro", price: 20} ] },
            { id: 4, name: "Matthi", price: 5, icon: "🍘", type: "simple" },
            { id: 5, name: "Veg Roll", price: 10, icon: "🌯", type: "simple" },
            { id: 6, name: "Biscuit", price: 5, icon: "🍪", type: "simple" },
            { id: 7, name: "Namkeen", price: 10, icon: "🥡", type: "simple" }
        ];

        let cart = {}; let isShopOpen = true; let disabledItems = [];

        function init() {
            db.collection('settings').doc('status').onSnapshot(doc => {
                isShopOpen = doc.exists ? doc.data().isOpen : true;
                const bar = document.getElementById('shop-closed-bar');
                const header = document.getElementById('main-header');
                if(!isShopOpen) { bar.style.display = 'block'; header.style.marginTop = '30px'; } 
                else { bar.style.display = 'none'; header.style.marginTop = '0px'; }
                renderMenu();
            });
            db.collection('settings').doc('menu').onSnapshot(doc => {
                if(doc.exists) {
                    const data = doc.data();
                    disabledItems = Object.keys(data).filter(k => data[k] === false).map(Number);
                }
                renderMenu();
            });
            const savedPhone = localStorage.getItem('userPhone');
            if(savedPhone) { document.getElementById('c-phone').value = savedPhone; listenToLatestOrder(savedPhone); }
        }

        // --- MENU & CART FUNCTIONS ---
        function renderMenu() {
            const container = document.getElementById('menu-container');
            const activeItems = menuItems.filter(item => !disabledItems.includes(item.id));
            container.innerHTML = activeItems.map(item => `
                <div class="item-card p-4 flex justify-between items-center shadow-md ${!isShopOpen ? 'opacity-50' : ''}">
                    <div class="flex items-center space-x-4">
                        <span class="text-3xl">${item.icon}</span>
                        <div><h3 class="font-bold text-lg text-white">${item.name}</h3><p class="text-orange-400 font-medium">${item.type === 'variant' ? 'Choose Type' : '₹'+item.price}</p></div>
                    </div>
                    ${renderAddButton(item)}
                </div>`).join('');
        }
        function renderAddButton(item) {
            const disabled = !isShopOpen ? 'disabled style="pointer-events:none;"' : '';
            if(item.type === 'variant') return `<button onclick="openVariantModal(${item.id})" ${disabled} class="px-4 py-2 bg-gray-800 border border-gray-600 rounded text-orange-400 font-bold text-sm">Select</button>`;
            return `<div class="flex items-center bg-gray-800 rounded-lg overflow-hidden border border-gray-600" ${disabled}>
                    <button onclick="updateCart('${item.name}', ${item.price}, -1)" class="w-8 h-8 flex items-center justify-center text-red-400 font-bold">-</button>
                    <span id="qty-${item.name.replace(/\s/g, '')}" class="w-6 text-center text-sm font-bold text-white">0</span>
                    <button onclick="updateCart('${item.name}', ${item.price}, 1)" class="w-8 h-8 flex items-center justify-center text-green-400 font-bold">+</button></div>`;
        }
        function openVariantModal(id) {
            const item = menuItems.find(i => i.id === id);
            document.getElementById('variant-options').innerHTML = item.variants.map(v => `
                <button onclick="addVariantToCart('${v.name}', ${v.price})" class="p-4 bg-gray-700 rounded-xl hover:bg-orange-600"><p class="font-bold text-white">${v.name}</p><p class="text-orange-300 text-sm">₹${v.price}</p></button>`).join('');
            document.getElementById('variant-modal').classList.remove('hidden');
        }
        function closeVariantModal() { document.getElementById('variant-modal').classList.add('hidden'); }
        function addVariantToCart(n, p) { updateCart(n, p, 1); closeVariantModal(); }
        function updateCart(name, price, change) {
            if (!cart[name]) cart[name] = { price: price, qty: 0 };
            cart[name].qty += change;
            if (cart[name].qty <= 0) delete cart[name];
            const qtyEl = document.getElementById(`qty-${name.replace(/\s/g, '')}`);
            if(qtyEl) qtyEl.innerText = cart[name] ? cart[name].qty : 0;
            renderCartSummary();
        }
        function renderCartSummary() {
            let total = 0, count = 0;
            for (const k in cart) { total += cart[k].price * cart[k].qty; count += cart[k].qty; }
            document.getElementById('cart-total').innerText = total;
            document.getElementById('cart-count').innerText = count;
            const bar = document.getElementById('cart-bar');
            if (count > 0) bar.classList.remove('hidden'); else bar.classList.add('hidden');
        }

        // --- CHECKOUT ---
        function openCheckout() { document.getElementById('checkout-modal').classList.remove('hidden'); }
        function closeCheckout() { document.getElementById('checkout-modal').classList.add('hidden'); }
        function selectPayment(mode) {
            document.getElementById('selected-payment').value = mode;
            document.querySelectorAll('.pay-btn').forEach(b => { b.classList.remove('bg-orange-600', 'text-white', 'border-transparent'); b.classList.add('bg-gray-700', 'border-gray-600'); });
            event.target.classList.remove('bg-gray-700', 'border-gray-600'); event.target.classList.add('bg-orange-600', 'text-white', 'border-transparent');
        }
        function placeOrder() {
            const name = document.getElementById('c-name').value.trim();
            const phone = document.getElementById('c-phone').value.trim();
            const mode = document.getElementById('selected-payment').value;
            const total = parseInt(document.getElementById('cart-total').innerText);
            if (!name || !phone || !mode) { alert("Sab details bharo!"); return; }
            localStorage.setItem('userPhone', phone);
            const items = []; for (const k in cart) { items.push({ name: k, qty: cart[k].qty, price: cart[k].price }); }
            const orderData = { customerName: name, customerPhone: phone, items: items, totalAmount: total, paymentMode: mode, paymentVerified: (mode === 'Cash'), status: 'pending', timestamp: firebase.firestore.FieldValue.serverTimestamp() };
            db.collection('orders').add(orderData).then(() => {
                closeCheckout(); cart = {}; renderCartSummary();
                const toast = document.getElementById("toast"); toast.className = "show"; setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
                if (mode === 'UPI') { window.location.href = `upi://pay?pa=${YOUR_UPI_ID}&pn=SGMC&am=${total}&tn=Order`; }
                listenToLatestOrder(phone);
            });
        }

        // --- UDHAAR DASHBOARD & PAY ---
        async function showUdhaar() {
            let phone = localStorage.getItem('userPhone');
            if(!phone) { 
                phone = prompt("Apna registered Mobile Number daalo:");
                if(phone) localStorage.setItem('userPhone', phone);
                else return;
            }
            
            document.getElementById('udhaar-modal').classList.remove('hidden');
            const content = document.getElementById('udhaar-content');
            content.innerHTML = '<p class="text-gray-500 animate-pulse">Calculating...</p>';

            try {
                // 1. Get Total Debits
                const ordersSnap = await db.collection('orders').where('customerPhone', '==', phone).where('paymentMode', '==', 'Udhaar').get();
                let debit = 0;
                ordersSnap.forEach(doc => { if(doc.data().status !== 'cancelled') debit += doc.data().totalAmount; });

                // 2. Get Total Credits
                const paymentsSnap = await db.collection('payments').where('phone', '==', phone).get();
                let credit = 0;
                paymentsSnap.forEach(doc => credit += doc.data().amount);

                const balance = debit - credit;

                if(balance <= 0) {
                    content.innerHTML = `<i class="fas fa-check-circle text-6xl text-green-500 mb-4"></i><h3 class="text-xl font-bold text-white">No Udhaar!</h3><p class="text-gray-400">Sab clear hai.</p>`;
                } else {
                    content.innerHTML = `
                        <div class="bg-gray-700/50 p-4 rounded-xl border border-red-500/50 mb-6">
                            <p class="text-gray-400 text-sm">Total Pending</p>
                            <h3 class="text-4xl font-bold text-red-500">₹${balance}</h3>
                            <div class="flex justify-between text-xs text-gray-400 mt-2 pt-2 border-t border-gray-600">
                                <span>Total Udhaar: ₹${debit}</span>
                                <span>Paid: ₹${credit}</span>
                            </div>
                        </div>
                        <button onclick="payUdhaar(${balance})" class="w-full bg-orange-600 text-white font-bold py-3 rounded-xl shadow-lg active:scale-95 transition-transform">
                            Pay Now via UPI <i class="fas fa-arrow-right ml-2"></i>
                        </button>
                    `;
                }
            } catch(e) { content.innerHTML = `<p class="text-red-500">Error.</p>`; }
        }

        function payUdhaar(amount) {
            const upiLink = `upi://pay?pa=${YOUR_UPI_ID}&pn=SGMC&am=${amount}&tn=UdhaarPay`;
            window.location.href = upiLink;
        }

        // --- HISTORY & TRACKING ---
        function listenToLatestOrder(phone) {
            db.collection('orders').where('customerPhone', '==', phone).orderBy('timestamp', 'desc').limit(1).onSnapshot(snap => {
                if(!snap.empty) {
                    const data = snap.docs[0].data();
                    if(data.status !== 'completed' && data.status !== 'cancelled') {
                        document.getElementById('live-order-tracker').classList.remove('hidden');
                        let st = "Order Received"; if(data.status==='cooking') st="Ban Raha Hai 🍳"; if(data.status==='ready') st="Ready Hai! Le jao ✅";
                        document.getElementById('live-status-text').innerText = st;
                        const pEl = document.getElementById('live-payment-status');
                        if(data.paymentMode === 'UPI') pEl.innerHTML = data.paymentVerified ? "<span class='text-green-400'>Confirmed ✅</span>" : "<span class='text-yellow-400'>Waiting for Admin...</span>";
                        else pEl.innerText = data.paymentMode;
                    } else document.getElementById('live-order-tracker').classList.add('hidden');
                }
            });
        }
        function showMyOrders() {
            const phone = localStorage.getItem('userPhone');
            if(!phone) { alert("No history found."); return; }
            const list = document.getElementById('history-list');
            list.innerHTML = '<p class="text-center text-gray-500">Loading...</p>';
            document.getElementById('history-modal').classList.remove('hidden');
            db.collection('orders').where('customerPhone', '==', phone).get().then(snap => {
                const orders = snap.docs.map(doc => ({id: doc.id, ...doc.data()}));
                orders.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
                list.innerHTML = orders.map(data => {
                    const dateObj = data.timestamp ? new Date(data.timestamp.toDate()) : new Date();
                    const dateStr = dateObj.toLocaleDateString() + ' ' + dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    let color = data.status === 'completed' ? 'text-green-400' : 'text-yellow-400';
                    return `<div class="bg-gray-800 p-4 rounded-xl border border-gray-700 shadow-sm">
                            <div class="flex justify-between items-start mb-2"><div><span class="block text-xs text-gray-500">${dateStr}</span><span class="font-bold text-lg text-white">₹${data.totalAmount}</span></div><span class="text-xs font-bold uppercase border border-gray-600 px-2 py-1 rounded ${color}">${data.status}</span></div>
                            <p class="text-gray-300 text-sm border-t border-gray-700 pt-2 mt-2">${data.items.map(i => `${i.qty} ${i.name}`).join(', ')}</p></div>`;
                }).join('');
            });
        }

        init();
    </script>
</body>
</html>
