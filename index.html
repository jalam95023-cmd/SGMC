<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SGMC – Chai Order</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:Arial;background:#f5f5f5}
header{background:#7b1e1e;color:#fff;padding:12px;text-align:center;font-size:18px}
.container{padding:12px}
.card{background:#fff;border-radius:8px;padding:12px;margin-bottom:12px}
label{font-size:14px;font-weight:bold;margin-bottom:6px;display:block}
input,select{width:100%;padding:10px;border-radius:6px;border:1px solid #ccc}
button{width:100%;padding:12px;background:#7b1e1e;color:#fff;border:none;border-radius:6px;font-size:16px;margin-top:8px}
#map{height:200px;border-radius:8px}
</style>
</head>

<body>

<header>☕ SGMC – Chai Order</header>

<div class="container">

<div class="card">
<label>📍 Delivery Address</label>
<input id="address" placeholder="Live location auto fill hoga">
<button onclick="detectLocation()">📍 Detect Live Location</button>
</div>

<div class="card">
<div id="map"></div>
</div>

<div class="card">
<label>☕ Select Item</label>
<select id="item">
<option>Normal Chai</option>
<option>Adrak Chai</option>
<option>Masala Chai</option>
<option>Elaichi Chai</option>
<option>Biscuit</option>
<option>Bun / Toast</option>
</select>
</div>

<div class="card">
<label>🔢 Quantity</label>
<input type="number" id="qty" value="1" min="1">
</div>

<div class="card">
<label>💳 Payment</label>
<select id="payment">
<option>Cash on Delivery</option>
<option>UPI</option>
</select>
</div>

<button onclick="placeOrder()">✅ Place Order</button>

</div>

<script>
/* 🔥 FIREBASE CONFIG (TERA KEY) */
const firebaseConfig = {
  apiKey: "AIzaSyBadYpoNTL0dHkBQO4UddRVtPIfUOlf-bA",
  authDomain: "sgmc-16568.firebaseapp.com",
  projectId: "sgmc-16568",
  storageBucket: "sgmc-16568.firebasestorage.app",
  messagingSenderId: "339041646158",
  appId: "1:339041646158:web:85d9a50a3b51b30aae351f"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* 🗺️ MAP VARIABLES */
let map, marker, userLat, userLng;

/* 📍 DETECT LOCATION */
function detectLocation(){
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(pos=>{
      userLat = pos.coords.latitude;
      userLng = pos.coords.longitude;
      initMap();
      document.getElementById("address").value =
        `Lat: ${userLat}, Lng: ${userLng}`;
    },()=>alert("Location allow karo"));
  }
}

/* 🗺️ INIT MAP */
function initMap(){
  map = new google.maps.Map(document.getElementById("map"),{
    center:{lat:userLat,lng:userLng},
    zoom:16
  });
  marker = new google.maps.Marker({
    position:{lat:userLat,lng:userLng},
    map:map
  });
}

/* 🧾 PLACE ORDER */
function placeOrder(){
  const orderId = Date.now();
  db.ref("orders/"+orderId).set({
    item: item.value,
    quantity: qty.value,
    payment: payment.value,
    address: address.value,
    lat: userLat,
    lng: userLng,
    status: "Placed",
    time: new Date().toLocaleString()
  });
  alert("✅ Order Placed");
}
</script>

<!-- 🗺️ GOOGLE MAPS SCRIPT -->
<!-- ⬇️ YAHA APNI GOOGLE MAPS API KEY DALO ⬇️ -->
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBadYpoNTL0dHkBQO4UddRVtPIfUOlf-bA"></script>

</body>
</html>
