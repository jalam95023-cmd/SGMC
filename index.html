<!DOCTYPE html>
<html>
<head>
  <title>SGMC – Order Chai</title>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <!-- Google Maps (APNI MAP KEY DALNA) -->
  <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAP_KEY&callback=initMap" async defer></script>

  <style>
    body { font-family: Arial; background:#f4f4f4; margin:0 }
    header { background:#6f1d1b; color:white; padding:15px; text-align:center; font-size:22px }
    .box { background:white; margin:10px; padding:15px; border-radius:10px }
    input, select, button {
      width:100%; padding:10px; margin-top:8px;
      border-radius:6px; border:1px solid #ccc;
    }
    button { background:#6f1d1b; color:white; font-size:16px; border:none }
    #map { height:250px; margin-top:10px; border-radius:10px }
    .success {
      background:#d4edda; color:#155724;
      padding:10px; margin:10px; border-radius:6px; display:none;
    }
  </style>
</head>

<body>

<header>☕ SGMC – Chai Order</header>

<div class="box">
  <label>📍 Delivery Address</label>
  <input type="text" id="address" placeholder="Address auto detect hoga..." />

  <button onclick="detectLocation()">📡 Detect Live Location</button>
  <div id="map"></div>
</div>

<div class="box">
  <label>☕ Select Item</label>
  <select id="item">
    <option>Normal Chai</option>
    <option>Adrak Chai</option>
    <option>Masala Chai</option>
    <option>Biscuit</option>
  </select>

  <label>🔢 Quantity</label>
  <input type="number" id="qty" value="1" min="1" />

  <label>💳 Payment</label>
  <select id="payment">
    <option>Cash on Delivery</option>
    <option>UPI</option>
  </select>

  <button onclick="placeOrder()">✅ Place Order</button>
</div>

<div class="success" id="successMsg">
  ✅ Order placed successfully!
</div>

<script>
/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyBadYpoNTL0dHkBQO4UddRVtPIfUOlf-bA",
  authDomain: "sgmc-16568.firebaseapp.com",
  projectId: "sgmc-16568",
  storageBucket: "sgmc-16568.firebasestorage.app",
  messagingSenderId: "339041646158",
  appId: "1:339041646158:web:85d9a50a3b51b30aae351f",
  measurementId: "G-4996NPF55N"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ================= MAP ================= */
let map, marker;
let userLat = null, userLng = null;

function initMap() {
  map = new google.maps.Map(document.getElementById("map"), {
    center: { lat: 28.6139, lng: 77.2090 },
    zoom: 14
  });
}

function detectLocation() {
  if (!navigator.geolocation) {
    alert("Location not supported");
    return;
  }

  navigator.geolocation.getCurrentPosition(pos => {
    userLat = pos.coords.latitude;
    userLng = pos.coords.longitude;

    const location = { lat: userLat, lng: userLng };
    map.setCenter(location);

    if (marker) marker.setMap(null);
    marker = new google.maps.Marker({ position: location, map: map });

    document.getElementById("address").value =
      `Lat: ${userLat.toFixed(5)}, Lng: ${userLng.toFixed(5)}`;
  });
}

/* ================= ORDER ================= */
function placeOrder() {
  const address = document.getElementById("address").value;
  const item = document.getElementById("item").value;
  const qty = document.getElementById("qty").value;
  const payment = document.getElementById("payment").value;

  if (!address) {
    alert("Address required");
    return;
  }

  db.collection("orders").add({
    item,
    qty,
    payment,
    address,
    location: userLat ? { lat: userLat, lng: userLng } : null,
    status: "Pending",
    time: firebase.firestore.FieldValue.serverTimestamp()
  }).then(() => {
    document.getElementById("successMsg").style.display = "block";
  });
}
</script>

</body>
</html>
