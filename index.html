<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SGMC – Chai Order</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#ffecd2,#fcb69f);
}
header{
  background:#7b1e1e;
  color:white;
  padding:14px;
  text-align:center;
  font-size:20px;
}
.container{padding:12px}
.card{
  background:white;
  border-radius:12px;
  padding:14px;
  margin-bottom:14px;
  box-shadow:0 4px 8px rgba(0,0,0,.15)
}
.item-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
}
.item-row input{
  width:60px;
}
.total-box{
  font-size:20px;
  font-weight:bold;
  text-align:center;
  background:#fff3cd;
  padding:12px;
  border-radius:10px;
}
button{
  width:100%;
  padding:14px;
  font-size:18px;
  border:none;
  border-radius:10px;
  background:#28a745;
  color:white;
}
</style>
</head>

<body>

<header>☕ SGMC Chai Order</header>

<div class="container">

<div class="card">
<h3>☕ Items</h3>

<div class="item-row">
Normal Chai (₹10)
<input type="number" min="0" value="0" onchange="calcTotal()" id="chai">
</div>

<div class="item-row">
Adrak Chai (₹15)
<input type="number" min="0" value="0" onchange="calcTotal()" id="adrak">
</div>

<div class="item-row">
Masala Chai (₹20)
<input type="number" min="0" value="0" onchange="calcTotal()" id="masala">
</div>

<div class="item-row">
Elaichi Chai (₹20)
<input type="number" min="0" value="0" onchange="calcTotal()" id="elaichi">
</div>

<div class="item-row">
Biscuit (₹5)
<input type="number" min="0" value="0" onchange="calcTotal()" id="biscuit">
</div>

<div class="item-row">
Bun / Toast (₹10)
<input type="number" min="0" value="0" onchange="calcTotal()" id="bun">
</div>
</div>

<div class="card total-box">
Total: ₹ <span id="total">0</span>
</div>

<button onclick="placeOrder()">✅ Place Order</button>

</div>

<script>
/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyBadYpoNTL0dHkBQO4UddRVtPIfUOlf-bA",
  authDomain: "sgmc-16568.firebaseapp.com",
  databaseURL: "https://sgmc-16568-default-rtdb.firebaseio.com",
  projectId: "sgmc-16568",
  storageBucket: "sgmc-16568.firebasestorage.app",
  messagingSenderId: "339041646158",
  appId: "1:339041646158:web:85d9a50a3b51b30aae351f"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function calcTotal(){
  const total =
    chai.value*10 +
    adrak.value*15 +
    masala.value*20 +
    elaichi.value*20 +
    biscuit.value*5 +
    bun.value*10;
  document.getElementById("total").innerText = total;
}

function placeOrder(){
  const order = {
    chai: chai.value,
    adrak: adrak.value,
    masala: masala.value,
    elaichi: elaichi.value,
    biscuit: biscuit.value,
    bun: bun.value,
    total: document.getElementById("total").innerText,
    status:"Placed",
    time:new Date().toLocaleString()
  };
  db.ref("orders").push(order);
  alert("✅ Order Placed");
}
</script>

</body>
</html>
