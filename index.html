<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SGMC – Chai Order</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<style>
body{font-family:Arial;background:#f5f5f5;margin:0}
header{background:#7a1e1e;color:#fff;padding:15px;text-align:center;font-size:22px}
.card{background:#fff;margin:10px;padding:15px;border-radius:10px}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
button{padding:6px 10px;font-size:16px}
input{width:100%;padding:10px;margin-top:8px}
.main{background:green;color:#fff;border:none;padding:15px;width:100%;font-size:18px;border-radius:8px}
.green{color:green;font-weight:bold}
.red{color:red;font-weight:bold}

/* popup */
#popup{display:none;position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,.5);align-items:center;justify-content:center}
#popup div{background:#fff;padding:25px;border-radius:10px;text-align:center}
</style>
</head>

<body>

<header>☕ SGMC – Chai Order</header>

<div class="card" id="items"></div>

<div class="card">
  <input id="name" placeholder="Your Name">
  <input id="phone" placeholder="Phone Number">
  <input id="address" placeholder="Delivery Address">
  <h3>Total: ₹<span id="total">0</span></h3>
  <button class="main" onclick="placeOrder()">Place Order (COD)</button>
</div>

<div class="card">
  <h3>Your Current Order</h3>
  <div id="currentOrder">No active order</div>
</div>

<!-- POPUP -->
<div id="popup">
  <div>
    <h3>✅ Order Placed</h3>
    <button onclick="closePopup()">OK</button>
  </div>
</div>

<script>
/* 🔥 Firebase Config */
const firebaseConfig = {
  apiKey: "AIzaSyBadYpoNTL0dHkBQO4UddRVtPIfUOlf-bA",
  authDomain: "sgmc-16568.firebaseapp.com",
  projectId: "sgmc-16568"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
firebase.auth().signInAnonymously();

/* PRODUCTS */
const products=[
 {name:"Normal Chai",price:10,qty:0},
 {name:"Adrak Chai",price:15,qty:0},
 {name:"Masala Chai",price:20,qty:0},
 {name:"Biscuit",price:10,qty:0},
 {name:"Cigarette",price:20,qty:0},
 {name:"Mathhi",price:5,qty:0}
];

const itemsDiv=document.getElementById("items");
const totalEl=document.getElementById("total");
const currentOrder=document.getElementById("currentOrder");

function render(){
  let html="";
  products.forEach((p,i)=>{
    html+=`
    <div class="row">
      <b>${p.name} ₹${p.price}</b>
      <div>
        <button onclick="chg(${i},-1)">-</button>
        ${p.qty}
        <button onclick="chg(${i},1)">+</button>
      </div>
    </div>`;
  });
  itemsDiv.innerHTML=html;
  calc();
}
function chg(i,v){
  products[i].qty=Math.max(0,products[i].qty+v);
  render();
}
function calc(){
  let t=0;
  products.forEach(p=>t+=p.price*p.qty);
  totalEl.innerText=t;
}

/* POPUP */
function showPopup(){popup.style.display="flex"}
function closePopup(){popup.style.display="none"}

/* 🔔 LIVE STATUS LISTENER */
function listen(phone){
  db.collection("orders")
   .where("phone","==",phone)
   .orderBy("createdAt","desc")
   .limit(1)
   .onSnapshot(snap=>{
     if(snap.empty){
       currentOrder.innerText="No active order";
       return;
     }
     snap.forEach(d=>{
       const o=d.data();
       let color=o.status==="DELIVERED"?"green":o.status==="REJECTED"?"red":"green";
       currentOrder.innerHTML=`₹${o.total} – <span class="${color}">${o.status}</span>`;
     });
   });
}

/* 🚀 PLACE ORDER */
function placeOrder(){
  const name=nameEl.value.trim();
  const phone=phoneEl.value.trim();
  const address=addressEl.value.trim();
  const items=products.filter(p=>p.qty>0);
  const total=Number(totalEl.innerText);

  if(!name||!phone||!address||items.length===0){
    alert("Fill all details");
    return;
  }

  db.collection("orders").add({
    name,phone,address,items,total,
    status:"NEW",
    createdAt:firebase.firestore.FieldValue.serverTimestamp()
  }).then(()=>{
    showPopup();
    listen(phone);
    products.forEach(p=>p.qty=0);
    render();
  });
}

/* INPUT ELEMENTS */
const nameEl=document.getElementById("name");
const phoneEl=document.getElementById("phone");
const addressEl=document.getElementById("address");

/* LOAD */
render();
</script>

</body>
</html>
