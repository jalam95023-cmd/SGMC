
<!DOCTYPE html>
<html>
<head>
<title>SGMC – Chai Order</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<style>
body{font-family:Arial;background:#f4f4f4;margin:0}
header{background:#7b1e1e;color:#fff;padding:15px;text-align:center;font-size:22px}

.box{background:#fff;margin:10px;padding:15px;border-radius:12px}
.item{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}

.qty button{width:30px;height:30px}
input{
 width:100%;padding:12px;margin-top:10px;
 border-radius:8px;border:1px solid #ccc;font-size:16px
}

.btn{
 background:#0a8f08;color:#fff;padding:16px;border:none;
 width:100%;font-size:18px;border-radius:10px;margin-top:10px
}

#map{height:220px;border-radius:12px;margin-top:12px}

.NEW{color:blue}
.ACCEPTED{color:orange}
.PREPARING{color:purple}
.READY{color:#0d6efd}
.PICKED{color:#6f42c1}
.DELIVERED{color:green}
.REJECTED{color:red}
</style>
</head>

<body>

<header>☕ SGMC – Chai Order</header>

<div class="box">
<h3>Items</h3>
<div id="items"></div>
</div>

<div class="box">
<input id="name" placeholder="Your Name">
<input id="phone" placeholder="Phone Number">
<input id="address" placeholder="Delivery Address">
<div id="map"></div>

<h3>Total ₹<span id="total">0</span></h3>
<button class="btn" onclick="placeOrder()">Place Order (COD)</button>
</div>

<div class="box">
<h3>Your Current Order</h3>
<div id="current">No order</div>
</div>

<!-- GOOGLE MAPS -->
<script
 src="https://maps.googleapis.com/maps/api/js?key=PASTE_YOUR_GOOGLE_MAPS_KEY&libraries=places&callback=initMap"
 async defer>
</script>

<script>
/* 🔥 FIREBASE */
firebase.initializeApp({
 apiKey: "AIzaSyCcUPgsZYqNZyZAUwOhBYpn5_tWeDuRrUg",
 authDomain: "sgmc-chai-app.firebaseapp.com",
 projectId: "sgmc-chai-app"
});
const db=firebase.firestore();
firebase.auth().signInAnonymously();

/* ITEMS */
const products=[
 {name:"Normal Chai",price:10,qty:0},
 {name:"Adrak Chai",price:15,qty:0},
 {name:"Masala Chai",price:20,qty:0},
 {name:"Biscuit",price:10,qty:0},
 {name:"Cigarette",price:20,qty:0},
 {name:"Mathhi",price:5,qty:0}
];

let lat=null,lng=null,map,marker,orderId=null;

/* MAP + AUTO LOCATION */
function initMap(){
 map=new google.maps.Map(document.getElementById("map"),{
  center:{lat:28.6139,lng:77.2090},zoom:15
 });

 marker=new google.maps.Marker({map});

 // AUTO GPS
 if(navigator.geolocation){
  navigator.geolocation.getCurrentPosition(pos=>{
   lat=pos.coords.latitude;
   lng=pos.coords.longitude;
   const loc={lat,lng};
   marker.setPosition(loc);
   map.setCenter(loc);
  });
 }

 // ADDRESS SEARCH
 const ac=new google.maps.places.Autocomplete(address);
 ac.addListener("place_changed",()=>{
  const p=ac.getPlace();
  if(!p.geometry) return;
  lat=p.geometry.location.lat();
  lng=p.geometry.location.lng();
  marker.setPosition({lat,lng});
  map.setCenter({lat,lng});
 });
}

/* ITEMS UI */
function render(){
 let html="",t=0;
 products.forEach((p,i)=>{
  t+=p.price*p.qty;
  html+=`
   <div class="item">
    <b>${p.name} ₹${p.price}</b>
    <div class="qty">
     <button onclick="chg(${i},-1)">-</button>
     ${p.qty}
     <button onclick="chg(${i},1)">+</button>
    </div>
   </div>`;
 });
 items.innerHTML=html;
 total.innerText=t;
}
function chg(i,v){
 products[i].qty=Math.max(0,products[i].qty+v);
 render();
}

/* PLACE ORDER */
function placeOrder(){
 if(!name.value||!phone.value||!address.value||!lat){
  alert("Details ya location missing hai");
  return;
 }

 const itemsSel=products.filter(p=>p.qty>0);
 if(itemsSel.length===0){
  alert("Kam se kam ek item select karo");
  return;
 }

 db.collection("orders").add({
  name:name.value,
  phone:phone.value,
  address:address.value,
  items:itemsSel,
  total:Number(total.innerText),
  lat,lng,
  status:"NEW",
  createdAt:firebase.firestore.FieldValue.serverTimestamp()
 }).then(ref=>{
  orderId=ref.id;
  alert("✅ Order Placed!");
  watchOrder(ref.id);
  products.forEach(p=>p.qty=0);
  render();
 });
}

function watchOrder(id){
 db.collection("orders").doc(id).onSnapshot(d=>{
  if(!d.exists) return;
  const o=d.data();
  current.innerHTML=`₹${o.total} – <b class="${o.status}">${o.status}</b>`;
 });
}

/* INIT */
const items=document.getElementById("items");
const total=document.getElementById("total");
render();
</script>

</body>
</html>
