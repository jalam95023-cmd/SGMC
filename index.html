<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SGMC – Chai Order</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
}
header{
  background:#6d1b1b;
  color:#fff;
  padding:16px;
  text-align:center;
  font-size:22px;
}
.container{padding:14px}
.card{
  background:#fff;
  border-radius:14px;
  padding:14px;
  margin-bottom:14px;
  box-shadow:0 6px 12px rgba(0,0,0,.2);
}
.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}
.row input{
  width:70px;
  padding:6px;
}
.total{
  font-size:22px;
  font-weight:bold;
  text-align:center;
  background:#fff3cd;
  padding:14px;
  border-radius:12px;
}
button{
  width:100%;
  padding:16px;
  font-size:18px;
  border:none;
  border-radius:14px;
  background:#28a745;
  color:#fff;
}
</style>
</head>

<body>

<header>☕ SGMC Chai Order</header>

<div class="container">

<div class="card">
<h3>🛒 Items</h3>

<div class="row">Normal Chai ₹10 <input id="chai" type="number" min="0" value="0" onchange="calc()"></div>
<div class="row">Adrak Chai ₹15 <input id="adrak" type="number" min="0" value="0" onchange="calc()"></div>
<div class="row">Masala Chai ₹20 <input id="masala" type="number" min="0" value="0" onchange="calc()"></div>
<div class="row">Elaichi Chai ₹20 <input id="elaichi" type="number" min="0" value="0" onchange="calc()"></div>
<div class="row">Biscuit ₹5 <input id="biscuit" type="number" min="0" value="0" onchange="calc()"></div>
<div class="row">Bun / Toast ₹10 <input id="bun" type="number" min="0" value="0" onchange="calc()"></div>

</div>

<div class="card total">
Total ₹ <span id="total">0</span>
</div>

<button onclick="placeOrder()">✅ Place Order</button>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBadYpoNTL0dHkBQO4UddRVtPIfUOlf-bA",
  authDomain: "sgmc-16568.firebaseapp.com",
  databaseURL: "https://sgmc-16568-default-rtdb.firebaseio.com",
  projectId: "sgmc-16568",
  storageBucket: "sgmc-16568.firebasestorage.app",
  messagingSenderId: "339041646158",
  appId: "1:339041646158:web:85d9a50a3b51b30aae351f"
};

if(!firebase.apps.length){
  firebase.initializeApp(firebaseConfig);
}
const db = firebase.database();

function calc(){
  const total =
    chai.value*10 +
    adrak.value*15 +
    masala.value*20 +
    elaichi.value*20 +
    biscuit.value*5 +
    bun.value*10;
  document.getElementById("total").innerText = total;
}

function placeOrder(){
  const total = document.getElementById("total").innerText;
  if(total == 0){
    alert("❗ Item select karo");
    return;
  }

  db.ref("orders").push({
    chai: chai.value,
    adrak: adrak.value,
    masala: masala.value,
    elaichi: elaichi.value,
    biscuit: biscuit.value,
    bun: bun.value,
    total: total,
    status: "Placed",
    time: new Date().toLocaleString()
  });

  alert("✅ Order Placed");
}
</script>

</body>
</html>
