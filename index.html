
<!DOCTYPE html>
<html>
<head>
  <title>SGMC – Chai Order</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <style>
    body{font-family:Arial;background:#f4f4f4;margin:0}
    header{background:#6f1d1b;color:#fff;padding:15px;text-align:center;font-size:22px}
    .box{background:#fff;margin:10px;padding:15px;border-radius:10px}
    .item{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
    .qty button{width:30px;height:30px}
    input{width:100%;padding:10px;margin-top:8px}
    .btn{background:green;color:#fff;padding:15px;border:none;width:100%;font-size:18px;border-radius:8px}
    .history{padding:10px;border-bottom:1px solid #ddd;cursor:pointer}
    .NEW{color:blue}
    .ACCEPTED{color:orange}
    .DELIVERED{color:green}
    .REJECTED{color:red}
  </style>
</head>

<body>

<header>☕ SGMC – Chai Order</header>

<div class="box" id="items"></div>

<div class="box">
  <input id="cust_name" placeholder="Your Name">
  <input id="cust_phone" placeholder="Phone Number">
  <input id="cust_address" placeholder="Delivery Address">

  <h3>Total: ₹<span id="total">0</span></h3>
  <button class="btn" onclick="placeOrder()">Place Order (COD)</button>
</div>

<div class="box">
  <h3>Your Current Order</h3>
  <div id="currentOrder">No active order</div>
</div>

<div class="box">
  <h3>Your Order History</h3>
  <div id="history">No orders yet</div>
</div>

<script>
/* 🔥 FIREBASE INIT */
firebase.initializeApp({
  apiKey: "AIzaSyBadYpoNTL0dHkBQO4UddRVtPIfUOlf-bA",
  authDomain: "sgmc-16568.firebaseapp.com",
  projectId: "sgmc-16568"
});
const db = firebase.firestore();
firebase.auth().signInAnonymously();

/* PRODUCTS */
const products=[
 {name:"Normal Chai",price:10,qty:0},
 {name:"Adrak Chai",price:15,qty:0},
 {name:"Masala Chai",price:20,qty:0},
 {name:"Biscuit",price:10,qty:0},
 {name:"Cigarette",price:20,qty:0},
 {name:"Mathhi",price:5,qty:0}
];

function render(){
 let html="",total=0;
 products.forEach((p,i)=>{
  total+=p.price*p.qty;
  html+=`
   <div class="item">
    <b>${p.name} ₹${p.price}</b>
    <div>
     <button onclick="chg(${i},-1)">-</button>
     ${p.qty}
     <button onclick="chg(${i},1)">+</button>
    </div>
   </div>`;
 });
 document.getElementById("items").innerHTML=html;
 document.getElementById("total").innerText=total;
}
function chg(i,v){
 products[i].qty=Math.max(0,products[i].qty+v);
 render();
}

let currentUnsub=null;

/* PLACE ORDER */
function placeOrder(){
 const name = document.getElementById("cust_name").value.trim();
 const phone = document.getElementById("cust_phone").value.trim();
 const address = document.getElementById("cust_address").value.trim();
 const items = products.filter(p=>p.qty>0);
 const total = Number(document.getElementById("total").innerText);

 if(!name || !phone || !address || items.length===0){
  alert("❌ Sab details bharo aur item select karo");
  return;
 }

 db.collection("orders").add({
  name, phone, address, items, total,
  status:"NEW",
  createdAt: firebase.firestore.FieldValue.serverTimestamp()
 }).then(ref=>{
  localStorage.setItem("sgmc_phone",phone);
  localStorage.setItem("sgmc_lastOrder",ref.id);
  watchOrder(ref.id);
  loadHistory(phone);
  products.forEach(p=>p.qty=0);
  render();
 });
}

/* LIVE CURRENT ORDER */
function watchOrder(id){
 if(currentUnsub) currentUnsub();
 currentUnsub = db.collection("orders").doc(id)
 .onSnapshot(doc=>{
  if(!doc.exists) return;
  const o=doc.data();
  document.getElementById("currentOrder").innerHTML =
   `₹${o.total} – <span class="${o.status}">${o.status}</span>`;
 });
}

/* HISTORY */
function loadHistory(phone){
 db.collection("orders")
  .where("phone","==",phone)
  .orderBy("createdAt","desc")
  .limit(5)
  .onSnapshot(snap=>{
   const h=document.getElementById("history");
   h.innerHTML="";
   snap.forEach(doc=>{
    const o=doc.data();
    h.innerHTML+=`
     <div class="history" onclick="watchOrder('${doc.id}')">
      ₹${o.total} –
      <span class="${o.status}">${o.status}</span>
     </div>`;
   });
  });
}

/* RESTORE AFTER REFRESH */
window.onload=()=>{
 const savedPhone = localStorage.getItem("sgmc_phone");
 const savedOrder = localStorage.getItem("sgmc_lastOrder");
 if(savedPhone){
  document.getElementById("cust_phone").value = savedPhone;
  loadHistory(savedPhone);
 }
 if(savedOrder){
  watchOrder(savedOrder);
 }
};

render();
</script>

</body>
</html>
