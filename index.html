<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SGMC – Chai Order</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<style>
body{font-family:Arial;background:#f5f5f5;margin:0}
header{background:#7a1e1e;color:#fff;padding:15px;text-align:center;font-size:22px}
.card{background:#fff;margin:10px;padding:15px;border-radius:10px}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
button{padding:6px 10px;font-size:16px}
input{width:100%;padding:10px;margin-top:8px}
.main{background:green;color:#fff;border:none;padding:15px;width:100%;font-size:18px;border-radius:8px}
.status{font-weight:bold}
.PLACED{color:orange}
.ACCEPTED{color:blue}
.DELIVERED{color:green}
.REJECTED{color:red}

/* popup */
#popup{
 display:none;position:fixed;top:0;left:0;width:100%;height:100%;
 background:rgba(0,0,0,.5);align-items:center;justify-content:center
}
#popup div{background:#fff;padding:25px;border-radius:10px;text-align:center}
</style>
</head>

<body>

<header>☕ SGMC – Chai Order</header>

<div class="card" id="items"></div>

<div class="card">
  <input id="name" placeholder="Your Name">
  <input id="phone" placeholder="Phone Number">
  <input id="address" placeholder="Delivery Address">
  <h3>Total: ₹<span id="total">0</span></h3>
  <button class="main" onclick="placeOrder()">Place Order (COD)</button>
</div>

<div class="card">
  <h3>📜 Your Orders</h3>
  <div id="orders">No orders yet</div>
</div>

<!-- POPUP -->
<div id="popup">
  <div>
    <h3>✅ Order Placed</h3>
    <button onclick="closePopup()">OK</button>
  </div>
</div>

<script>
/* 🔥 Firebase */
const firebaseConfig={
  apiKey:"AIzaSyBadYpoNTL0dHkBQO4UddRVtPIfUOlf-bA",
  authDomain:"sgmc-16568.firebaseapp.com",
  projectId:"sgmc-16568"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
firebase.auth().signInAnonymously();

/* ELEMENTS */
const nameInput=name;
const phoneInput=phone;
const addressInput=address;
const itemsDiv=document.getElementById("items");
const totalEl=document.getElementById("total");
const ordersDiv=document.getElementById("orders");
const popup=document.getElementById("popup");

/* PRODUCTS */
const products=[
 {name:"Normal Chai",price:10,qty:0},
 {name:"Adrak Chai",price:15,qty:0},
 {name:"Masala Chai",price:20,qty:0},
 {name:"Biscuit",price:10,qty:0},
 {name:"Cigarette",price:20,qty:0},
 {name:"Mathhi",price:5,qty:0}
];

function render(){
  let html="";
  products.forEach((p,i)=>{
    html+=`
    <div class="row">
      <b>${p.name} ₹${p.price}</b>
      <div>
        <button onclick="chg(${i},-1)">-</button>
        ${p.qty}
        <button onclick="chg(${i},1)">+</button>
      </div>
    </div>`;
  });
  itemsDiv.innerHTML=html;
  calc();
}
function chg(i,v){
  products[i].qty=Math.max(0,products[i].qty+v);
  render();
}
function calc(){
  let t=0;
  products.forEach(p=>t+=p.price*p.qty);
  totalEl.innerText=t;
}

/* POPUP */
function showPopup(){popup.style.display="flex"}
function closePopup(){popup.style.display="none"}

/* PLACE ORDER */
function placeOrder(){
  const nameV=nameInput.value;
  const phoneV=phoneInput.value;
  const addressV=addressInput.value;

  if(!nameV||!phoneV||!addressV)
    return alert("Fill all details");

  const selected=products.filter(p=>p.qty>0);
  if(!selected.length)
    return alert("Select items");

  localStorage.setItem("sgmc_phone", phoneV);

  db.collection("orders").add({
    name:nameV,
    phone:phoneV,
    address:addressV,
    items:selected,
    total:totalEl.innerText,
    status:"PLACED",
    createdAt:firebase.firestore.FieldValue.serverTimestamp()
  }).then(()=>{
    showPopup();
    products.forEach(p=>p.qty=0);
    render();
  });
}

/* 🔔 ORDER HISTORY + LIVE STATUS */
function loadOrders(){
  const phoneV=localStorage.getItem("sgmc_phone");
  if(!phoneV) return;

  phoneInput.value=phoneV;

  db.collection("orders")
   .where("phone","==",phoneV)
   .orderBy("createdAt","desc")
   .onSnapshot(snapshot=>{
     if(snapshot.empty){
       ordersDiv.innerHTML="No orders found";
       return;
     }

     let html="";
     snapshot.forEach(doc=>{
       const d=doc.data();
       html+=`
       <div class="card">
         <b>Status:
           <span class="status ${d.status}">
             ${d.status}
           </span>
         </b><br><br>

         ${d.items.map(i=>`${i.name} × ${i.qty}`).join("<br>")}
         <h4>Total: ₹${d.total}</h4>
       </div>`;
     });
     ordersDiv.innerHTML=html;
   });
}

render();
loadOrders();
</script>

</body>
</html>
