<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGMC - Order Live</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #ff9966, #ff5e62); font-family: 'Segoe UI', sans-serif; min-height: 100vh; padding-bottom: 80px; }
        .container { max-width: 500px; padding-top: 20px; }
        .glass-card { background: rgba(255, 255, 255, 0.95); border-radius: 20px; padding: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); }
        .section-header { font-size: 13px; font-weight: 700; color: #ff5e62; text-transform: uppercase; margin: 15px 0 5px 0; border-bottom: 2px solid #ffecec; }
        .item-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .qty-input { width: 50px; text-align: center; border: 1px solid #ddd; border-radius: 8px; padding: 5px; font-weight: bold; color: #d35400; }
        .brand-input { width: 90px; font-size: 12px; border: 1px solid #eee; border-radius: 5px; padding: 5px; margin-right: 5px; }
        .total-bar { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; z-index: 100; box-shadow: 0 -5px 20px rgba(0,0,0,0.1); }
        .btn-order { background: linear-gradient(45deg, #d35400, #e67e22); color: white; border: none; padding: 10px 30px; border-radius: 50px; font-weight: bold; }
        #liveStatusCard { display: none; margin-bottom: 20px; border-left: 5px solid #2ecc71; }
        .status-badge { background: #2ecc71; color: white; padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div id="liveStatusCard" class="glass-card">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <h5 class="m-0">📦 Your Order</h5>
            <span id="statusText" class="status-badge">Pending</span>
        </div>
        <p class="small text-muted mb-1" id="orderIdDisplay">Order ID: ...</p>
        <p class="mb-0 fw-bold" id="liveTotalDisplay">Total: ₹0</p>
        <button onclick="clearCurrentOrder()" class="btn btn-sm btn-outline-danger mt-3" style="font-size: 11px;">New Order</button>
    </div>

    <div class="glass-card" id="mainFormCard">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-dark">🔥 SGMC Delivery</h2>
            <p class="text-muted small">Chai • Sutta • Snacks</p>
        </div>

        <form id="orderForm">
            <div class="row g-2 mb-3">
                <div class="col-12"><input type="tel" id="cPhone" class="form-control" placeholder="📱 Mobile Number" required pattern="[0-9]{10}"></div>
                <div class="col-6"><input type="text" id="cName" class="form-control" placeholder="👤 Naam" required></div>
                <div class="col-6"><input type="text" id="cLoc" class="form-control" placeholder="📍 Location" required></div>
            </div>

            <div class="section-header">Garama Garam</div>
            <div class="item-row">
                <div><label class="fw-bold">☕ Chai</label><div class="small text-muted">₹10 / cup</div></div>
                <input type="number" id="qtyChai" data-price="10" class="qty-input item-calc" placeholder="0">
            </div>

            <div class="section-header">Sutta & Pan</div>
            <div class="item-row">
                <div><label class="fw-bold">🚬 Cigarette</label><div class="small text-muted">Market Rate</div></div>
                <div class="d-flex"><input type="text" id="nameCig" class="brand-input" placeholder="Brand"><input type="number" id="qtyCig" data-price="18" class="qty-input item-calc" placeholder="0"></div>
            </div>
            <div class="item-row">
                <div><label class="fw-bold">✌️ Pan Masala</label><div class="small text-muted">Market Rate</div></div>
                <div class="d-flex"><input type="text" id="namePan" class="brand-input" placeholder="Brand"><input type="number" id="qtyPan" data-price="5" class="qty-input item-calc" placeholder="0"></div>
            </div>

            <div class="section-header">Nashta</div>
            <div class="item-row">
                <div><label class="fw-bold">🍞 Bun Maska</label><div class="small text-muted">₹20 / pc</div></div>
                <input type="number" id="qtyBun" data-price="20" class="qty-input item-calc" placeholder="0">
            </div>
            <div class="item-row">
                <div><label class="fw-bold">🍪 Mathi</label><div class="small text-muted">₹5 / pc</div></div>
                <input type="number" id="qtyMathi" data-price="5" class="qty-input item-calc" placeholder="0">
            </div>
            <div class="item-row">
                <div><label class="fw-bold">🌯 Veg Roll</label><div class="small text-muted">₹30 / pc</div></div>
                <input type="number" id="qtyRoll" data-price="30" class="qty-input item-calc" placeholder="0">
            </div>
            
            <div class="mt-3"><input type="text" id="otherItem" class="form-control" placeholder="Kuch aur chahiye? (Optional)"></div>
        </form>
    </div>
</div>

<div class="total-bar">
    <div><small class="text-muted d-block">Total Bill</small><span class="total-amount" id="totalDisplay">₹0</span></div>
    <button type="submit" form="orderForm" class="btn-order" id="orderBtn">ORDER NOW <i class="fas fa-arrow-right ms-2"></i></button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, addDoc, doc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBadYpoNTL0dHkBQO4UddRVtPIfUOlf-bA",
    authDomain: "sgmc-16568.firebaseapp.com",
    projectId: "sgmc-16568",
    storageBucket: "sgmc-16568.firebasestorage.app",
    messagingSenderId: "339041646158",
    appId: "1:339041646158:web:85d9a50a3b51b30aae351f",
    measurementId: "G-4996NPF55N"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // 1. Total Calculation
  const inputs = document.querySelectorAll('.item-calc');
  const totalDisplay = document.getElementById('totalDisplay');
  let currentTotal = 0;

  function calculateTotal() {
      let sum = 0;
      inputs.forEach(input => {
          sum += (parseInt(input.value) || 0) * (parseInt(input.dataset.price) || 0);
      });
      currentTotal = sum;
      totalDisplay.innerText = "₹" + sum;
  }
  inputs.forEach(input => input.addEventListener('input', calculateTotal));

  // 2. Check Existing Order
  const savedOrderId = localStorage.getItem('sgmc_active_order_id');
  if(savedOrderId) trackOrder(savedOrderId);

  // 3. Order Submission
  document.getElementById('orderForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('orderBtn');
      btn.innerHTML = 'Sending...'; btn.disabled = true;

      const items = {
          chai: document.getElementById('qtyChai').value,
          bun: document.getElementById('qtyBun').value,
          mathi: document.getElementById('qtyMathi').value,
          roll: document.getElementById('qtyRoll').value,
          cig: { qty: document.getElementById('qtyCig').value, brand: document.getElementById('nameCig').value },
          pan: { qty: document.getElementById('qtyPan').value, brand: document.getElementById('namePan').value },
          other: document.getElementById('otherItem').value
      };

      if(currentTotal === 0 && !items.other) { alert("Order khali hai!"); btn.disabled = false; return; }

      try {
          const docRef = await addDoc(collection(db, "orders"), {
              customerName: document.getElementById('cName').value,
              phone: document.getElementById('cPhone').value,
              location: document.getElementById('cLoc').value,
              items: items,
              totalBill: currentTotal,
              status: 'Pending',
              timestamp: serverTimestamp()
          });
          localStorage.setItem('sgmc_active_order_id', docRef.id);
          trackOrder(docRef.id);
      } catch (error) {
          console.error(error);
          alert("Error: " + error.message);
          btn.disabled = false;
      }
  });

  // 4. Track Order
  function trackOrder(orderId) {
      document.getElementById('mainFormCard').style.display = 'none';
      document.querySelector('.total-bar').style.display = 'none';
      document.getElementById('liveStatusCard').style.display = 'block';
      const statusText = document.getElementById('statusText');

      onSnapshot(doc(db, "orders", orderId), (doc) => {
          if(doc.exists()) {
              const data = doc.data();
              statusText.innerText = data.status;
              document.getElementById('orderIdDisplay').innerText = "Order ID: " + orderId.slice(-4).toUpperCase();
              document.getElementById('liveTotalDisplay').innerText = "Total Bill: ₹" + data.totalBill;
              
              if(data.status === 'Ready') statusText.style.background = '#f1c40f';
              if(data.status === 'Delivered') { statusText.style.background = '#2ecc71'; statusText.innerText = "Enjoy! ✅"; }
          }
      });
  }

  window.clearCurrentOrder = () => {
      if(confirm("New Order?")) { localStorage.removeItem('sgmc_active_order_id'); location.reload(); }
  }
</script>
</body>
</html>
