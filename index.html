<!DOCTYPE html>
<html>
<head>
  <title>SGMC Chai</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      padding: 20px;
    }
    h2 {
      text-align: center;
      color: #6b3e26;
    }
    .box {
      background: white;
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
    }
    select, input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      font-size: 16px;
    }
    button {
      background: #6b3e26;
      color: white;
      border: none;
      border-radius: 5px;
    }
  </style>
</head>

<body>

<h2>☕ SGMC Chai</h2>

<div class="box">
  <label>Chai choose karo</label>
  <select>
    <option>Normal Chai - ₹10</option>
    <option>Adrak Chai - ₹15</option>
    <option>Masala Chai - ₹20</option>
  </select>

  <label>Quantity</label>
  <input type="number" placeholder="Kitni chai">

  <label>Delivery Address</label>
  <input type="text" placeholder="Market / Shop number">

  <button>Order Now</button>
</div>

</body>
</html>
