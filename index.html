<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SGMC Chai</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f0f0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #050505; color: white; font-family: sans-serif; -webkit-tap-highlight-color: transparent; padding-bottom: 140px; }
        .glass-card { background: rgba(30, 30, 30, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; transition: transform 0.2s; }
        .glass-card:active { transform: scale(0.98); }
        .btn-primary { background: linear-gradient(135deg, #F97316 0%, #EA580C 100%); color: white; font-weight: bold; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(10px); border-top: 1px solid #222; display: flex; justify-content: space-around; padding: 10px; padding-bottom: 20px; z-index: 50; }
        .nav-item { color: #666; font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-item.active { color: #F97316; }
        
        /* Support Button Animation */
        .pulse-icon { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div class="fixed top-0 left-0 right-0 bg-[#050505]/90 backdrop-blur-md z-40 px-4 py-3 flex justify-between items-center border-b border-white/5">
        <div>
            <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-orange-500 to-yellow-500">SGMC <span class="text-white text-sm font-normal">Chai</span></h1>
            <p class="text-[10px] text-green-500 font-bold tracking-wide" id="shop-status-badge">● LIVE</p>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="openSupportModal()" class="w-8 h-8 rounded-full bg-gray-800 text-gray-400 border border-gray-700 flex items-center justify-center pulse-icon">
                <i class="fas fa-headset"></i>
            </button>
            <div class="flex items-center gap-2" onclick="openProfileEdit()">
                <div class="profile-avatar w-8 h-8 rounded-full bg-gray-800 flex items-center justify-center text-orange-500 border border-gray-700" id="header-avatar"><i class="fas fa-user"></i></div>
            </div>
        </div>
    </div>

    <div class="h-16"></div>

    <div id="view-menu" class="pb-10 p-4">
        <div class="relative mb-4">
            <i class="fas fa-search absolute left-3 top-3 text-gray-500"></i>
            <input type="text" id="search-input" onkeyup="filterMenu()" placeholder="Search chai, snacks..." class="w-full bg-gray-900 border border-gray-800 rounded-xl py-2.5 pl-10 pr-4 text-sm text-white outline-none">
        </div>

        <div id="closed-banner" class="hidden bg-red-900/20 border border-red-500/30 text-red-200 p-4 rounded-2xl text-center mb-4">
            <h3 class="font-bold text-sm">Shop is Closed</h3>
        </div>

        <div id="menu-container" class="space-y-3">
            <div class="text-center mt-10"><i class="fas fa-circle-notch fa-spin text-orange-500"></i></div>
        </div>
    </div>

    <div id="view-orders" class="hidden p-4">
        <h2 class="text-xl font-bold mb-4">My Orders</h2>
        <div id="orders-list" class="space-y-3"></div>
    </div>

    <div id="view-udhaar" class="hidden p-4">
        <div class="glass-card p-6 text-center mb-6 border-blue-500/20">
            <p class="text-gray-400 text-xs uppercase">Pending Dues</p>
            <h1 class="text-4xl font-bold text-blue-400 mb-2">₹<span id="my-udhaar-amount">0</span></h1>
            <p class="text-[10px] text-gray-500">Pay via UPI</p>
        </div>
        <div id="udhaar-history" class="space-y-2"></div>
    </div>

    <div id="support-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[70] hidden">
        <div class="bg-[#1f1f1f] p-6 rounded-2xl w-full max-w-xs text-center border border-gray-700">
            <h3 class="text-lg font-bold text-white mb-2">Contact Admin</h3>
            <p class="text-xs text-gray-400 mb-6">Need help with an order?</p>
            
            <a href="tel:7065821697" class="block w-full bg-green-900/40 text-green-400 py-3 rounded-xl font-bold mb-3 border border-green-800">
                <i class="fas fa-phone-alt mr-2"></i> Call Shop
            </a>
            <a href="https://wa.me/917065821697" class="block w-full bg-gray-800 text-white py-3 rounded-xl font-bold border border-gray-600">
                <i class="fab fa-whatsapp mr-2"></i> WhatsApp
            </a>
            
            <button onclick="document.getElementById('support-modal').classList.add('hidden')" class="mt-4 text-xs text-gray-500">Close</button>
        </div>
    </div>

    <div id="cart-bar" class="fixed bottom-20 left-4 right-4 bg-gradient-to-r from-orange-600 to-orange-500 text-white p-3 px-5 rounded-2xl shadow-xl flex justify-between items-center z-40 hidden cursor-pointer" onclick="openCheckout()">
        <div class="flex items-center gap-3">
            <div class="bg-white text-orange-600 w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm" id="cart-count">0</div>
            <div class="flex flex-col">
                <span class="text-[10px] uppercase text-orange-100 font-bold">Total</span>
                <span class="font-bold text-lg leading-none">₹<span id="cart-total">0</span></span>
            </div>
        </div>
        <span class="font-bold text-sm">Checkout <i class="fas fa-arrow-right ml-1"></i></span>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('menu')" id="nav-menu"><i class="fas fa-th-large"></i> Menu</div>
        <div class="nav-item" onclick="switchTab('orders')" id="nav-orders"><i class="fas fa-receipt"></i> Orders</div>
        <div class="nav-item" onclick="switchTab('udhaar')" id="nav-udhaar"><i class="fas fa-wallet"></i> Udhaar</div>
    </div>

    <div id="checkout-modal" class="fixed inset-0 bg-black/80 flex items-end sm:items-center justify-center z-50 hidden">
        <div class="bg-[#1f1f1f] w-full max-w-md p-6 rounded-t-2xl sm:rounded-2xl border-t sm:border border-gray-700 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold">Checkout</h2>
                <button onclick="closeCheckout()" class="text-gray-400"><i class="fas fa-times"></i></button>
            </div>
            <div id="checkout-items" class="space-y-2 mb-4"></div>
            
            <div class="mb-4">
                <label class="text-[10px] text-orange-500 uppercase font-bold block mb-1">Deliver To</label>
                <input type="text" id="order-address" class="w-full bg-gray-900 border border-gray-800 rounded-xl p-3 text-sm text-white mb-2" placeholder="Room No...">
                <button onclick="detectLocation()" id="gps-btn" class="w-full py-2 bg-blue-900/20 text-blue-400 text-xs rounded-lg border border-blue-900/50 flex items-center justify-center gap-2"><i class="fas fa-crosshairs"></i> Detect Location</button>
            </div>

            <div class="flex justify-between font-bold text-lg mb-4"><span>Total</span><span class="text-orange-500">₹<span id="checkout-total">0</span></span></div>
            <div class="grid grid-cols-3 gap-2 mb-4">
                <button onclick="setPayment('Cash')" id="pay-cash" class="p-2 rounded border border-gray-600 text-xs bg-orange-600 text-white payment-opt">Cash</button>
                <button onclick="setPayment('UPI')" id="pay-upi" class="p-2 rounded border border-gray-600 text-xs bg-gray-800 text-gray-300 payment-opt">UPI</button>
                <button onclick="setPayment('Udhaar')" id="pay-udhaar" class="p-2 rounded border border-gray-600 text-xs bg-gray-800 text-gray-300 payment-opt">Udhaar</button>
            </div>
            <button onclick="placeOrder()" class="w-full bg-orange-600 text-white py-3 rounded-xl font-bold" id="place-btn">Place Order</button>
        </div>
    </div>

    <div id="cig-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-[60] hidden">
        <div class="bg-[#1f1f1f] w-full max-w-xs p-6 rounded-2xl border border-gray-700">
            <h3 class="font-bold mb-4">Select Cigarette</h3>
            <div id="cig-list" class="space-y-3 mb-4"></div>
            <button onclick="confirmCig()" class="w-full bg-orange-600 text-white py-2 rounded-lg font-bold">Done</button>
        </div>
    </div>

    <div id="login-modal" class="fixed inset-0 bg-black/90 flex items-center justify-center p-6 z-50 hidden">
        <div class="bg-[#1f1f1f] w-full max-w-xs p-6 rounded-2xl border border-gray-700 text-center">
            <h2 class="text-xl font-bold mb-4">Setup Profile</h2>
            <input type="text" id="user-name" class="w-full bg-gray-900 p-3 rounded-xl mb-3 text-white" placeholder="Name">
            <input type="tel" id="user-phone" class="w-full bg-gray-900 p-3 rounded-xl mb-3 text-white" placeholder="Phone">
            <button onclick="saveProfile()" class="w-full bg-orange-600 text-white py-3 rounded-xl font-bold">Save</button>
        </div>
    </div>

    <script>
        // CONFIG
        const firebaseConfig = { apiKey: "AIzaSyBadYpoNTL0dHkBQO4UddRVtPIfUOlf-bA", authDomain: "sgmc-16568.firebaseapp.com", projectId: "sgmc-16568", storageBucket: "sgmc-16568.firebasestorage.app", messagingSenderId: "339041646158", appId: "1:339041646158:web:85d9a50a3b51b30aae351f" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let cart = {};
        let userProfile = {};
        let userLocation = null;
        let selectedPayment = 'Cash';
        let menuItems = [
            {id:1,name:"Normal Chai",price:10},{id:2,name:"Adrak Chai",price:15},
            {id:3,name:"Cigarettes",isSpecial:true},{id:4,name:"Matthi",price:5},
            {id:5,name:"Veg Roll",price:10},{id:6,name:"Biscuit",price:5},{id:7,name:"Namkeen",price:10}
        ];
        let cigOptions = [{id:'m',name:'Marlboro',price:20},{id:'g',name:'Gold Flake',price:20},{id:'ca',name:'Chhoti Adv',price:12}];
        let tempCig = {};

        function init() {
            loadProfile();
            db.collection('settings').doc('menu').onSnapshot(d => renderMenu(d.exists?d.data():{}));
            db.collection('settings').doc('status').onSnapshot(d => {
                const open = d.exists?d.data().isOpen:true;
                document.getElementById('shop-status-badge').innerText = open ? "● LIVE" : "● CLOSED";
                document.getElementById('shop-status-badge').className = open ? "text-[10px] text-green-500 font-bold" : "text-[10px] text-red-500 font-bold";
                if(!open) document.getElementById('closed-banner').classList.remove('hidden'); else document.getElementById('closed-banner').classList.add('hidden');
            });
            const saved = localStorage.getItem('cart'); if(saved) { cart = JSON.parse(saved); updateCartUI(); }
            switchTab('menu');
        }

        function renderMenu(stock) {
            const c = document.getElementById('menu-container');
            let q = document.getElementById('search-input').value.toLowerCase();
            c.innerHTML = menuItems.filter(i => i.name.toLowerCase().includes(q) && stock[i.id]!==false).map(i => `
                <div class="glass-card p-3 flex justify-between items-center">
                    <div><h3 class="font-bold text-sm">${i.name}</h3><p class="text-orange-400 text-xs font-bold">₹${i.price || 'Var'}</p></div>
                    ${i.isSpecial ? 
                    `<button onclick="openCig()" class="bg-gray-800 text-xs px-3 py-1 rounded border border-gray-600">Select</button>` : 
                    `<div class="flex items-center gap-2 bg-gray-800 rounded p-1"><button onclick="updCart('${i.id}',-1)" class="w-6 h-6 bg-gray-700 rounded">-</button><span class="text-xs font-bold w-4 text-center" id="q-${i.id}">${cart[i.id]?.qty||0}</span><button onclick="updCart('${i.id}',1)" class="w-6 h-6 bg-orange-600 rounded">+</button></div>`}
                </div>
            `).join('');
        }
        function filterMenu() { db.collection('settings').doc('menu').get().then(d=>renderMenu(d.exists?d.data():{})); }

        function updCart(id, chg) {
            if(!cart[id]) { const i = menuItems.find(x=>x.id==id); cart[id]={...i,qty:0}; }
            cart[id].qty += chg; if(cart[id].qty<=0) delete cart[id];
            updateCartUI(); renderMenu({}); // Re-render to show qty
        }
        function updateCartUI() {
            let n=0, t=0; for(let k in cart){n+=cart[k].qty; t+=cart[k].qty*cart[k].price;}
            const b = document.getElementById('cart-bar');
            if(n>0) { b.classList.remove('hidden'); b.classList.add('flex'); document.getElementById('cart-count').innerText=n; document.getElementById('cart-total').innerText=t; }
            else b.classList.add('hidden');
            localStorage.setItem('cart', JSON.stringify(cart));
        }

        // Cig Logic
        function openCig() { tempCig={}; document.getElementById('cig-list').innerHTML=cigOptions.map(o=>`<div class="flex justify-between p-2 bg-gray-800 rounded"><span>${o.name}</span><div class="flex gap-2"><button onclick="tc('${o.id}',-1)">-</button><span id="t-${o.id}">0</span><button onclick="tc('${o.id}',1)">+</button></div></div>`).join(''); document.getElementById('cig-modal').classList.remove('hidden'); }
        function tc(id,c) { if(!tempCig[id]) tempCig[id]=0; tempCig[id]+=c; if(tempCig[id]<0) tempCig[id]=0; document.getElementById(`t-${id}`).innerText=tempCig[id]; }
        function confirmCig() { for(let id in tempCig) { if(tempCig[id]>0) { const o=cigOptions.find(x=>x.id==id); if(!cart[id]) cart[id]={...o,qty:0}; cart[id].qty+=tempCig[id]; } } updateCartUI(); document.getElementById('cig-modal').classList.add('hidden'); }

        // Checkout & Location
        function openCheckout() {
            let h='', t=0; for(let k in cart) { t+=cart[k].qty*cart[k].price; h+=`<div class="flex justify-between text-sm bg-gray-800 p-2 rounded"><span>${cart[k].name} x${cart[k].qty}</span><span>₹${cart[k].qty*cart[k].price}</span></div>`; }
            document.getElementById('checkout-items').innerHTML=h; document.getElementById('checkout-total').innerText=t;
            document.getElementById('checkout-modal').classList.remove('hidden');
        }
        function closeCheckout() { document.getElementById('checkout-modal').classList.add('hidden'); }
        function setPayment(m) { selectedPayment=m; document.querySelectorAll('.payment-opt').forEach(b=>{b.classList.remove('bg-orange-600','text-white'); b.classList.add('bg-gray-800','text-gray-300');}); document.getElementById('pay-'+m.toLowerCase()).classList.add('bg-orange-600','text-white'); }
        
        function detectLocation() {
            const btn = document.getElementById('gps-btn'); btn.innerHTML = 'Detecting...';
            navigator.geolocation.getCurrentPosition(p => {
                userLocation = { lat: p.coords.latitude, lng: p.coords.longitude };
                btn.innerHTML = '<i class="fas fa-check"></i> Location Set';
                btn.className = "w-full py-2 bg-green-900/20 text-green-400 text-xs rounded-lg border border-green-900/50 flex items-center justify-center gap-2";
            }, e => { alert("GPS Error"); btn.innerHTML = 'Retry GPS'; });
        }

        function placeOrder() {
            if(!userProfile.phone) { alert("Setup Profile"); openProfileEdit(); return; }
            const addr = document.getElementById('order-address').value;
            if(!addr && !userLocation) { alert("Address required"); return; }
            
            const total = parseInt(document.getElementById('checkout-total').innerText);
            const data = {
                items: Object.values(cart), totalAmount: total, paymentMode: selectedPayment,
                customerName: userProfile.name, customerPhone: userProfile.phone, customerAddress: addr,
                location: userLocation, status: 'pending', timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };
            
            document.getElementById('place-btn').innerText = "Processing...";
            db.collection('orders').add(data).then(() => {
                cart={}; updateCartUI(); closeCheckout(); alert("Order Placed!"); switchTab('orders');
                document.getElementById('place-btn').innerText = "Place Order";
            });
        }

        // Support & Profile
        function openSupportModal() { document.getElementById('support-modal').classList.remove('hidden'); }
        function loadProfile() { const s=localStorage.getItem('p'); if(s) { userProfile=JSON.parse(s); document.getElementById('header-avatar').innerHTML=userProfile.name[0]; } else document.getElementById('login-modal').classList.remove('hidden'); }
        function saveProfile() { const n=document.getElementById('user-name').value, p=document.getElementById('user-phone').value; if(n&&p) { userProfile={name:n,phone:p}; localStorage.setItem('p',JSON.stringify(userProfile)); document.getElementById('login-modal').classList.add('hidden'); init(); } }
        function openProfileEdit() { document.getElementById('login-modal').classList.remove('hidden'); }
        
        function switchTab(t) {
            localStorage.setItem('activeTab', t);
            ['menu','orders','udhaar'].forEach(x=>{ document.getElementById('view-'+x).classList.add('hidden'); document.getElementById('nav-'+x).classList.remove('active'); });
            document.getElementById('view-'+t).classList.remove('hidden'); document.getElementById('nav-'+t).classList.add('active');
            updateCartUI();
            if(t==='orders') loadOrders();
        }

        function loadOrders() {
            if(!userProfile.phone) return;
            db.collection('orders').where('customerPhone','==',userProfile.phone).orderBy('timestamp','desc').get().then(s => {
                document.getElementById('orders-list').innerHTML = s.docs.map(d => {
                    const o = d.data();
                    return `<div class="glass-card p-3 border-l-4 ${o.status==='completed'?'border-green-500':'border-blue-500'}">
                        <div class="flex justify-between">
                            <div><p class="text-xs text-gray-400">${new Date(o.timestamp?.toDate()).toLocaleTimeString()}</p><p class="font-bold text-sm">${o.items.map(i=>i.qty+' '+i.name).join(', ')}</p></div>
                            <div class="text-right"><p class="font-bold text-orange-400">₹${o.totalAmount}</p><p class="text-[10px] uppercase">${o.status}</p></div>
                        </div>
                    </div>`;
                }).join('');
            });
        }
        
        init();
    </script>
</body>
</html>
