<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGMC Chai Stall</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        .item-card { background: #1e1e1e; border-radius: 16px; border: 1px solid #333; transition: 0.2s; }
        .item-card:active { transform: scale(0.98); }
        .btn-primary { background: linear-gradient(135deg, #FF6B6B, #FF8E53); color: white; }
        .floating-cart { box-shadow: 0 -4px 15px rgba(0,0,0,0.7); background: #1f2937; }
        .modal { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .status-pill { font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; text-transform: uppercase; font-weight: bold; }
    </style>
</head>
<body class="pb-32 select-none">

    <div class="p-4 flex justify-between items-center bg-gray-900 sticky top-0 z-20 border-b border-gray-800">
        <h1 class="text-xl font-bold text-orange-500 tracking-wider">SGMC</h1>
        <button onclick="showMyOrders()" class="text-xs bg-gray-800 border border-gray-600 px-3 py-1 rounded text-white">
            <i class="fas fa-history mr-1"></i> My Orders
        </button>
    </div>

    <div class="p-4 grid grid-cols-1 gap-3" id="menu-container">
        </div>

    <div id="live-order-tracker" class="hidden m-4 p-4 bg-blue-900/30 border border-blue-500 rounded-xl">
        <h3 class="text-blue-400 font-bold text-sm mb-1"><i class="fas fa-spinner fa-spin mr-2"></i>Live Order Status</h3>
        <p class="text-white text-lg font-bold" id="live-status-text">Pending...</p>
        <p class="text-xs text-gray-400 mt-1">Payment Status: <span id="live-payment-status" class="text-white">Checking...</span></p>
    </div>

    <div id="variant-modal" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-gray-800 w-full max-w-sm p-5 rounded-2xl">
            <h3 class="text-xl font-bold text-white mb-4">Choose Variant</h3>
            <div id="variant-options" class="grid grid-cols-2 gap-3">
                </div>
            <button onclick="closeVariantModal()" class="mt-4 w-full py-2 text-gray-400">Cancel</button>
        </div>
    </div>

    <div id="cart-bar" class="fixed bottom-0 left-0 w-full floating-cart p-4 rounded-t-3xl hidden z-40">
        <div class="flex justify-between items-center max-w-md mx-auto">
            <div class="flex flex-col">
                <span class="text-gray-400 text-xs font-medium uppercase"><span id="cart-count">0</span> Items</span>
                <span class="text-2xl font-bold text-white">₹<span id="cart-total">0</span></span>
            </div>
            <button onclick="openCheckout()" class="btn-primary px-8 py-3 rounded-xl font-bold shadow-lg">
                View Cart <i class="fas fa-shopping-bag ml-2"></i>
            </button>
        </div>
    </div>

    <div id="checkout-modal" class="fixed inset-0 bg-black/90 z-50 hidden flex items-end sm:items-center justify-center">
        <div class="bg-gray-800 w-full max-w-md p-6 rounded-t-3xl sm:rounded-3xl shadow-2xl modal">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-white">Checkout</h2>
                <button onclick="closeCheckout()" class="text-gray-400"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="space-y-4">
                <input type="text" id="c-name" class="w-full p-3 bg-gray-700 rounded-xl text-white outline-none focus:ring-2 focus:ring-orange-500" placeholder="Apna Naam (Name)">
                <input type="tel" id="c-phone" class="w-full p-3 bg-gray-700 rounded-xl text-white outline-none focus:ring-2 focus:ring-orange-500" placeholder="Mobile Number (Jaruri hai)">

                <div>
                    <label class="text-xs text-gray-400 uppercase ml-1">Payment Method</label>
                    <div class="grid grid-cols-3 gap-3 mt-1">
                        <button onclick="selectPayment('Cash')" class="pay-btn p-3 bg-gray-700 rounded-xl border border-gray-600 text-sm font-bold">💵 Cash</button>
                        <button onclick="selectPayment('UPI')" class="pay-btn p-3 bg-gray-700 rounded-xl border border-gray-600 text-sm font-bold">📱 UPI</button>
                        <button onclick="selectPayment('Udhaar')" class="pay-btn p-3 bg-gray-700 rounded-xl border border-gray-600 text-sm font-bold">📒 Udhaar</button>
                    </div>
                </div>
                <input type="hidden" id="selected-payment" value="">

                <button onclick="placeOrder()" id="confirm-btn" class="w-full bg-green-600 text-white p-4 rounded-xl font-bold text-lg shadow-lg mt-2">
                    Confirm Order
                </button>
            </div>
        </div>
    </div>

    <div id="history-modal" class="fixed inset-0 bg-black/95 z-50 hidden overflow-y-auto">
        <div class="p-4 max-w-md mx-auto">
            <div class="flex justify-between items-center mb-6 sticky top-0 bg-black/95 py-4">
                <h2 class="text-2xl font-bold text-white">Order History</h2>
                <button onclick="document.getElementById('history-modal').classList.add('hidden')" class="text-gray-400"><i class="fas fa-times fa-lg"></i></button>
            </div>
            <div id="history-list" class="space-y-4">
                </div>
        </div>
    </div>

    <script>
        const YOUR_UPI_ID = "YOUR_UPI_ID_HERE"; // <--- UPI ID HERE
        
        // --- FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyBadYpoNTL0dHkBQO4UddRVtPIfUOlf-bA",
            authDomain: "sgmc-16568.firebaseapp.com",
            projectId: "sgmc-16568",
            storageBucket: "sgmc-16568.firebasestorage.app",
            messagingSenderId: "339041646158",
            appId: "1:339041646158:web:85d9a50a3b51b30aae351f",
            measurementId: "G-4996NPF55N"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- UPDATED MENU ---
        const menuItems = [
            { id: 1, name: "Normal Chai", price: 10, icon: "☕", type: "simple" },
            { id: 2, name: "Adrak Chai", price: 15, icon: "🍵", type: "simple" },
            { id: 3, name: "Cigarette", price: 0, icon: "🚬", type: "variant", 
              variants: [
                  {name: "Chhoti Gold", price: 10},
                  {name: "Advance", price: 18},
                  {name: "Marlboro", price: 20}
              ] 
            },
            { id: 4, name: "Matthi", price: 5, icon: "🍘", type: "simple" },
            { id: 5, name: "Veg Roll", price: 10, icon: "🌯", type: "simple" },
            { id: 6, name: "Biscuit", price: 5, icon: "🍪", type: "simple" },
            { id: 7, name: "Namkeen", price: 10, icon: "🥡", type: "simple" }
        ];

        let cart = {}; 
        let currentVariantItem = null;

        // --- INIT & PERSISTENCE ---
        function init() {
            // Render Menu
            const container = document.getElementById('menu-container');
            container.innerHTML = menuItems.map(item => `
                <div class="item-card p-4 flex justify-between items-center shadow-md">
                    <div class="flex items-center space-x-4">
                        <span class="text-3xl">${item.icon}</span>
                        <div>
                            <h3 class="font-bold text-lg text-white">${item.name}</h3>
                            <p class="text-orange-400 font-medium">${item.type === 'variant' ? 'Choose Type' : '₹'+item.price}</p>
                        </div>
                    </div>
                    ${renderAddButton(item)}
                </div>
            `).join('');

            // Restore User & Listen for Live Order
            const savedPhone = localStorage.getItem('userPhone');
            if(savedPhone) {
                document.getElementById('c-phone').value = savedPhone;
                listenToLatestOrder(savedPhone);
            }
        }

        function renderAddButton(item) {
            if(item.type === 'variant') {
                return `<button onclick="openVariantModal(${item.id})" class="px-4 py-2 bg-gray-800 border border-gray-600 rounded text-orange-400 font-bold text-sm">Select</button>`;
            } else {
                return `
                <div class="flex items-center bg-gray-800 rounded-lg overflow-hidden border border-gray-600">
                    <button onclick="updateCart('${item.name}', ${item.price}, -1)" class="w-8 h-8 flex items-center justify-center text-red-400 font-bold">-</button>
                    <span id="qty-${item.name.replace(/\s/g, '')}" class="w-6 text-center text-sm font-bold text-white">0</span>
                    <button onclick="updateCart('${item.name}', ${item.price}, 1)" class="w-8 h-8 flex items-center justify-center text-green-400 font-bold">+</button>
                </div>`;
            }
        }

        // --- VARIANT LOGIC ---
        function openVariantModal(id) {
            const item = menuItems.find(i => i.id === id);
            currentVariantItem = item;
            const container = document.getElementById('variant-options');
            container.innerHTML = item.variants.map(v => `
                <button onclick="addVariantToCart('${v.name}', ${v.price})" class="p-4 bg-gray-700 rounded-xl hover:bg-orange-600 transition-colors text-center">
                    <p class="font-bold text-white">${v.name}</p>
                    <p class="text-orange-300 text-sm">₹${v.price}</p>
                </button>
            `).join('');
            document.getElementById('variant-modal').classList.remove('hidden');
        }

        function closeVariantModal() { document.getElementById('variant-modal').classList.add('hidden'); }

        function addVariantToCart(name, price) {
            updateCart(name, price, 1);
            closeVariantModal();
        }

        // --- CART SYSTEM ---
        function updateCart(name, price, change) {
            if (!cart[name]) cart[name] = { price: price, qty: 0 };
            cart[name].qty += change;
            if (cart[name].qty <= 0) delete cart[name];
            
            // Try to update UI if it exists (for simple items)
            const safeName = name.replace(/\s/g, '');
            const qtyEl = document.getElementById(`qty-${safeName}`);
            if(qtyEl) qtyEl.innerText = cart[name] ? cart[name].qty : 0;
            
            renderCartSummary();
        }

        function renderCartSummary() {
            let total = 0;
            let count = 0;
            for (const key in cart) {
                total += cart[key].price * cart[key].qty;
                count += cart[key].qty;
            }
            document.getElementById('cart-total').innerText = total;
            document.getElementById('cart-count').innerText = count;
            const cartBar = document.getElementById('cart-bar');
            if (count > 0) cartBar.classList.remove('hidden');
            else cartBar.classList.add('hidden');
        }

        // --- CHECKOUT & ORDERING ---
        function openCheckout() { document.getElementById('checkout-modal').classList.remove('hidden'); }
        function closeCheckout() { document.getElementById('checkout-modal').classList.add('hidden'); }
        
        function selectPayment(mode) {
            document.getElementById('selected-payment').value = mode;
            document.querySelectorAll('.pay-btn').forEach(b => {
                b.classList.remove('bg-orange-600', 'text-white', 'border-transparent');
                b.classList.add('bg-gray-700', 'border-gray-600');
            });
            event.target.classList.remove('bg-gray-700', 'border-gray-600');
            event.target.classList.add('bg-orange-600', 'text-white', 'border-transparent');
        }

        function placeOrder() {
            const name = document.getElementById('c-name').value.trim();
            const phone = document.getElementById('c-phone').value.trim();
            const mode = document.getElementById('selected-payment').value;
            const total = parseInt(document.getElementById('cart-total').innerText);

            if (!name || !phone || !mode) { alert("Sab details bharo!"); return; }
            
            // SAVE USER
            localStorage.setItem('userPhone', phone);

            const items = [];
            for (const key in cart) {
                items.push({ name: key, qty: cart[key].qty, price: cart[key].price });
            }

            const orderData = {
                customerName: name,
                customerPhone: phone,
                items: items,
                totalAmount: total,
                paymentMode: mode,
                paymentVerified: (mode === 'Cash'), // Cash is auto verified (will pay at counter), UPI needs check
                status: 'pending', // pending -> cooking -> ready -> completed
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };

            db.collection('orders').add(orderData).then((docRef) => {
                closeCheckout();
                cart = {}; // Clear cart
                renderCartSummary(); // Hide cart bar
                
                if (mode === 'UPI') {
                    window.location.href = `upi://pay?pa=${YOUR_UPI_ID}&pn=SGMC&am=${total}&tn=Order`;
                }
                
                // Start tracking immediately
                listenToLatestOrder(phone);
                alert("Order Placed! Live tracking chalu hai.");

            }).catch(err => alert("Error: " + err.message));
        }

        // --- HISTORY & LIVE TRACKING ---
        function listenToLatestOrder(phone) {
            // Listen for the most recent unfinished order
            db.collection('orders')
                .where('customerPhone', '==', phone)
                .orderBy('timestamp', 'desc')
                .limit(1)
                .onSnapshot(snapshot => {
                    if(!snapshot.empty) {
                        const data = snapshot.docs[0].data();
                        // Only show tracking if order is NOT completed/cancelled
                        if(data.status !== 'completed' && data.status !== 'cancelled') {
                            const tracker = document.getElementById('live-order-tracker');
                            tracker.classList.remove('hidden');
                            
                            let statusText = "Order Received";
                            if(data.status === 'cooking') statusText = "Ban Raha Hai 🍳";
                            if(data.status === 'ready') statusText = "Ready Hai! Le jao ✅";
                            
                            document.getElementById('live-status-text').innerText = statusText;
                            
                            // Payment Status logic
                            const payEl = document.getElementById('live-payment-status');
                            if(data.paymentMode === 'UPI') {
                                if(data.paymentVerified) {
                                    payEl.innerHTML = "<span class='text-green-400'>Confirmed ✅</span>";
                                } else {
                                    payEl.innerHTML = "<span class='text-yellow-400'>Waiting for Admin... ⏳</span>";
                                }
                            } else {
                                payEl.innerText = data.paymentMode; // Cash/Udhaar
                            }
                        } else {
                            document.getElementById('live-order-tracker').classList.add('hidden');
                        }
                    }
                });
        }

        function showMyOrders() {
            const phone = localStorage.getItem('userPhone');
            if(!phone) { alert("Pehle ek order to karo!"); return; }

            db.collection('orders').where('customerPhone', '==', phone).orderBy('timestamp', 'desc').limit(10).get().then(snap => {
                const list = document.getElementById('history-list');
                list.innerHTML = snap.docs.map(doc => {
                    const data = doc.data();
                    const date = data.timestamp ? data.timestamp.toDate().toLocaleDateString() : '';
                    return `
                        <div class="bg-gray-800 p-3 rounded-lg border border-gray-700">
                            <div class="flex justify-between">
                                <span class="text-gray-400 text-xs">${date}</span>
                                <span class="text-orange-400 font-bold">₹${data.totalAmount}</span>
                            </div>
                            <p class="text-white text-sm mt-1">${data.items.map(i => i.name).join(', ')}</p>
                            <div class="mt-2 text-xs">
                                <span class="bg-gray-700 px-2 py-1 rounded text-gray-300">${data.status}</span>
                            </div>
                        </div>
                    `;
                }).join('');
                document.getElementById('history-modal').classList.remove('hidden');
            });
        }

        init();
    </script>
</body>
</html>
