
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SGMC – Chai Order</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<!-- Google Maps -->
<script src="https://maps.googleapis.com/maps/api/js?key=.AIzaSyBadYpoNTL0dHkBQO4UddRVtPIfUOlf-bA&libraries=places"></script>

<style>
body{
  margin:0;
  font-family:system-ui,Arial;
  background:#f2f2f2;
}
header{
  background:#7b1e1e;
  color:#fff;
  padding:14px;
  text-align:center;
  font-size:20px;
}
.card{
  background:#fff;
  margin:12px;
  padding:14px;
  border-radius:12px;
}
.item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}
.qty button{
  width:32px;
  height:32px;
  font-size:18px;
}
input{
  width:100%;
  padding:12px;
  margin-top:10px;
  font-size:16px;
}
#map{
  height:220px;
  margin-top:12px;
  border-radius:10px;
}
.total{
  font-size:20px;
  margin-top:10px;
}
.btn{
  background:#0a8f08;
  color:#fff;
  border:none;
  width:100%;
  padding:16px;
  font-size:18px;
  border-radius:10px;
  margin-top:12px;
}
.status span{
  font-weight:bold;
}
.NEW{color:#0066ff}
.ACCEPTED{color:#ff9800}
.PREPARING{color:#9c27b0}
.READY{color:#2196f3}
.DELIVERED{color:#2e7d32}
</style>
</head>

<body>

<header>☕ SGMC – Chai Order</header>

<div class="card" id="items"></div>

<div class="card">
  <input id="name" placeholder="Your Name">
  <input id="phone" placeholder="Phone Number">
  <input id="address" placeholder="Delivery Address">
  <div id="map"></div>

  <div class="total">Total ₹<span id="total">0</span></div>
  <button class="btn" onclick="placeOrder()">Place Order (COD)</button>
</div>

<div class="card status">
  <h3>Your Current Order</h3>
  <div id="current">No order</div>
</div>

<script>
/* 🔥 FIREBASE CONFIG */
firebase.initializeApp({
  apiKey.// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBadYpoNTL0dHkBQO4UddRVtPIfUOlf-bA",
  authDomain: "sgmc-16568.firebaseapp.com",
  projectId: "sgmc-16568",
  storageBucket: "sgmc-16568.firebasestorage.app",
  messagingSenderId: "339041646158",
  appId: "1:339041646158:web:85d9a50a3b51b30aae351f",
  measurementId: "G-4996NPF55N"
}; ",
  authDomain: "sgmc-16568.firebaseapp.com",
  projectId: "sgmc-16568"
});

const db = firebase.firestore();
firebase.auth().signInAnonymously();

/* 🧃 ITEMS */
const products = [
  {name:"Normal Chai", price:10, qty:0},
  {name:"Adrak Chai", price:15, qty:0},
  {name:"Masala Chai", price:20, qty:0},
  {name:"Biscuit", price:10, qty:0},
  {name:"Cigarette", price:20, qty:0},
  {name:"Mathhi", price:5, qty:0}
];

let map, marker, lat=null, lng=null;

/* 🗺️ MAP INIT */
function initMap(){
  map = new google.maps.Map(document.getElementById("map"),{
    center:{lat:28.6139,lng:77.2090},
    zoom:14
  });

  // Auto current location
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(pos=>{
      lat = pos.coords.latitude;
      lng = pos.coords.longitude;
      map.setCenter({lat,lng});
      marker = new google.maps.Marker({map,position:{lat,lng}});
    });
  }

  // Address autocomplete
  const ac = new google.maps.places.Autocomplete(
    document.getElementById("address")
  );

  ac.addListener("place_changed",()=>{
    const p = ac.getPlace();
    if(!p.geometry) return;
    lat = p.geometry.location.lat();
    lng = p.geometry.location.lng();
    if(marker) marker.setMap(null);
    marker = new google.maps.Marker({map,position:{lat,lng}});
    map.setCenter({lat,lng});
    map.setZoom(16);
  });
}

/* 🧮 RENDER ITEMS */
function render(){
  let html="", t=0;
  products.forEach((p,i)=>{
    t += p.qty * p.price;
    html += `
      <div class="item">
        <b>${p.name} ₹${p.price}</b>
        <div class="qty">
          <button onclick="chg(${i},-1)">−</button>
          ${p.qty}
          <button onclick="chg(${i},1)">+</button>
        </div>
      </div>`;
  });
  items.innerHTML = html;
  total.innerText = t;
}
function chg(i,v){
  products[i].qty = Math.max(0, products[i].qty + v);
  render();
}

/* 📦 PLACE ORDER */
function placeOrder(){
  const nm = name.value.trim();
  const ph = phone.value.trim();
  const ad = address.value.trim();
  const selected = products.filter(p=>p.qty>0);
  const tot = Number(total.innerText);

  if(!nm || !ph || !ad || !lat || selected.length===0){
    alert("Sab details bharo aur item select karo");
    return;
  }

  db.collection("orders").add({
    name:nm,
    phone:ph,
    address:ad,
    items:selected,
    total:tot,
    lat,lng,
    status:"NEW",
    createdAt:firebase.firestore.FieldValue.serverTimestamp()
  }).then(ref=>{
    alert("✅ Order Placed");
    watch(ref.id);
    products.forEach(p=>p.qty=0);
    render();
  });
}

/* 🔄 LIVE STATUS */
function watch(id){
  db.collection("orders").doc(id).onSnapshot(d=>{
    if(!d.exists) return;
    const o = d.data();
    current.innerHTML = `
      ₹${o.total} –
      <span class="${o.status}">${o.status}</span>
    `;
  });
}

window.onload = ()=>{
  initmap();
  render();
};
</script>

</body>
</html>
