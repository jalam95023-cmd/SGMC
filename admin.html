<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGMC Admin</title>
    <link rel="manifest" href="admin_manifest.json">
    <meta name="theme-color" content="#0f0f0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0f0f0f; color: white; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        .card { background: #1f1f1f; border-radius: 12px; border: 1px solid #333; }
        .tab-active { border-bottom: 2px solid #F97316; color: #F97316; }
        
        /* New Toast & Modal Styles */
        #toast-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast { background: rgba(30, 30, 30, 0.95); border: 1px solid #333; padding: 10px 20px; border-radius: 50px; color: white; font-size: 14px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); opacity: 0; transform: translateY(20px); transition: all 0.3s ease; display: flex; items-center; gap: 8px; backdrop-filter: blur(5px); }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast-success i { color: #4ade80; } .toast-error i { color: #f87171; }
        
        #custom-confirm { backdrop-filter: blur(5px); }
        .confirm-box { transform: scale(0.9); transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .confirm-box.open { transform: scale(1); }
    </style>
</head>
<body class="p-4 max-w-2xl mx-auto pb-24" onclick="enableSound()">

    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-orange-500">SGMC Admin</h1>
        <div class="flex gap-2">
            <button onclick="openMenuControl()" class="px-3 py-2 rounded text-xs font-bold bg-blue-600 text-white shadow-lg shadow-blue-900/50">Stock</button>
            <button id="shop-toggle-btn" onclick="toggleShop()" class="px-3 py-2 rounded text-xs font-bold bg-gray-700 shadow-lg">Loading...</button>
        </div>
    </div>

    <div class="grid grid-cols-2 gap-4 mb-4">
        <div class="card p-3 flex flex-col justify-between relative overflow-hidden">
            <div class="absolute top-0 right-0 w-16 h-16 bg-green-500/10 rounded-full -mr-8 -mt-8"></div>
            <div class="text-center z-10">
                <p class="text-gray-400 text-xs uppercase tracking-wider">Sales Today</p>
                <h2 class="text-2xl font-bold text-green-400 mt-1">₹<span id="total-sales">0</span></h2>
            </div>
            <button onclick="confirmAction('Reset Day Sales?', endDay)" class="mt-2 w-full py-1 text-[10px] bg-red-500/10 text-red-400 rounded border border-red-500/20 hover:bg-red-500/20 transition">RESET DAY</button>
        </div>
        <div class="card p-3 text-center flex flex-col justify-center relative">
            <p class="text-gray-400 text-xs uppercase tracking-wider">Active Orders</p>
            <h2 class="text-3xl font-bold text-yellow-400 my-1" id="pending-count">0</h2>
            <p class="text-[10px] text-gray-500" id="sound-status">Tap for Sound 🔇</p>
        </div>
    </div>

    <div class="flex mb-4 border-b border-gray-800">
        <button onclick="switchTab('live')" id="tab-live" class="flex-1 py-3 tab-active font-bold text-sm transition-colors">LIVE</button>
        <button onclick="switchTab('history')" id="tab-history" class="flex-1 py-3 text-gray-500 font-bold text-sm transition-colors">HISTORY</button>
        <button onclick="switchTab('udhaar')" id="tab-udhaar" class="flex-1 py-3 text-gray-500 font-bold text-sm transition-colors">UDHAAR</button>
    </div>

    <div id="view-live" class="space-y-3 min-h-[50vh]"></div>
    <div id="view-history" class="hidden space-y-3"><div id="history-container" class="space-y-2"></div></div>
    <div id="view-udhaar" class="hidden space-y-3">
        <div class="relative">
            <i class="fas fa-search absolute left-3 top-3 text-gray-500"></i>
            <input type="text" id="search-udhaar" onkeyup="filterUdhaar()" placeholder="Search Name..." class="w-full pl-10 p-2 bg-gray-800 rounded-lg border border-gray-700 text-sm focus:border-orange-500 outline-none transition">
        </div>
        <div id="udhaar-list" class="space-y-2"></div>
    </div>

    <div id="history-detail-modal" class="fixed inset-0 bg-black/90 hidden flex items-center justify-center p-4 z-[60] backdrop-blur-sm">
        <div class="bg-gray-900 border border-gray-700 p-6 rounded-2xl w-full max-w-sm shadow-2xl relative">
            <button onclick="closeHistoryDetail()" class="absolute top-4 right-4 text-gray-400 hover:text-white"><i class="fas fa-times"></i></button>
            
            <h3 class="text-xl font-bold mb-1 text-white">Order Details</h3>
            <p id="hd-date" class="text-xs text-gray-500 mb-4"></p>

            <div class="bg-black/40 rounded-xl p-4 mb-4 max-h-60 overflow-y-auto border border-gray-800" id="hd-items">
                </div>

            <div class="space-y-2 text-sm">
                <div class="flex justify-between text-gray-400">
                    <span>Customer</span>
                    <span id="hd-customer" class="text-white font-bold text-right"></span>
                </div>
                 <div class="flex justify-between text-gray-400">
                    <span>Payment Mode</span>
                    <span id="hd-payment" class="text-white font-bold"></span>
                </div>
                <div class="flex justify-between text-gray-400">
                    <span>Status</span>
                    <span id="hd-status" class="uppercase font-bold"></span>
                </div>
                <div class="border-t border-gray-700 my-2 pt-2 flex justify-between text-lg font-bold text-white">
                    <span>Total Amount</span>
                    <span class="text-orange-500" id="hd-total"></span>
                </div>
            </div>
        </div>
    </div>

    <div id="menu-modal" class="fixed inset-0 bg-black/90 hidden flex items-center justify-center p-4 z-40 backdrop-blur-sm">
        <div class="bg-gray-900 border border-gray-700 p-6 rounded-2xl w-full max-w-sm max-h-[80vh] overflow-y-auto shadow-2xl">
            <h3 class="text-xl font-bold mb-4 text-white">Stock Management</h3>
            <div id="menu-list-items" class="space-y-3"></div>
            <div class="flex gap-3 mt-6">
                <button onclick="document.getElementById('menu-modal').classList.add('hidden')" class="flex-1 py-3 rounded-lg bg-gray-800 text-gray-400 font-bold">Cancel</button>
                <button onclick="saveMenuStatus()" class="flex-1 py-3 rounded-lg bg-green-600 text-white font-bold shadow-lg shadow-green-900/50">Save</button>
            </div>
        </div>
    </div>

    <div id="settle-modal" class="fixed inset-0 bg-black/90 hidden flex items-center justify-center p-4 z-40 backdrop-blur-sm">
        <div class="bg-gray-900 border border-gray-700 p-6 rounded-2xl w-full max-w-sm shadow-2xl max-h-[90vh] overflow-y-auto">
            <h3 class="text-lg font-bold mb-1 text-white">Settle Payment</h3>
            <p class="text-gray-400 text-sm mb-4" id="settle-name"></p>
            
            <div class="text-center mb-6">
                <p class="text-xs text-gray-500 uppercase">Current Due</p>
                <p class="text-3xl font-bold text-red-400">₹<span id="settle-due">0</span></p>
            </div>
            
            <input type="number" id="settle-amount" class="w-full p-4 bg-gray-800 rounded-lg text-white mb-4 border border-gray-700 outline-none text-center text-xl font-bold focus:border-blue-500" placeholder="Amount Received">
            
            <div class="flex gap-3 mb-6">
                <button onclick="closeSettle()" class="flex-1 py-3 rounded-lg bg-gray-800 text-gray-400 font-bold">Cancel</button>
                <button onclick="submitPayment()" class="flex-1 py-3 rounded-lg bg-green-600 text-white font-bold shadow-lg shadow-green-900/50">Settle</button>
            </div>

            <h4 class="text-xs font-bold text-gray-500 uppercase border-b border-gray-700 pb-2 mb-2">Recent Payments</h4>
            <div id="settle-history-list" class="space-y-2 text-sm max-h-40 overflow-y-auto">
                </div>
        </div>
    </div>

    <div id="custom-confirm" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-gray-900 border border-gray-700 p-5 rounded-2xl w-full max-w-xs confirm-box shadow-2xl">
            <h3 class="text-lg font-bold text-white mb-2" id="confirm-title">Confirm?</h3>
            <div class="flex gap-3 mt-4">
                <button onclick="closeConfirm(false)" class="flex-1 py-2 rounded-lg bg-gray-800 text-gray-400 font-bold text-sm">Cancel</button>
                <button onclick="closeConfirm(true)" class="flex-1 py-2 rounded-lg bg-orange-600 text-white font-bold text-sm shadow-lg shadow-orange-900/50">Confirm</button>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>
    <audio id="order-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

    <script>
        // --- CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyBadYpoNTL0dHkBQO4UddRVtPIfUOlf-bA",
            authDomain: "sgmc-16568.firebaseapp.com",
            projectId: "sgmc-16568",
            storageBucket: "sgmc-16568.firebasestorage.app",
            messagingSenderId: "339041646158",
            appId: "1:339041646158:web:85d9a50a3b51b30aae351f",
            measurementId: "G-4996NPF55N"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const adminMenuItems = [ { id: 1, name: "Normal Chai" }, { id: 2, name: "Adrak Chai" }, { id: 3, name: "Cigarette" }, { id: 4, name: "Matthi" }, { id: 5, name: "Veg Roll" }, { id: 6, name: "Biscuit" }, { id: 7, name: "Namkeen" } ];

        // --- STATE ---
        let isShopOpen = false;
        let udhaarMap = {}; 
        let currentSettlePhone = null; 
        let allHistoryOrders = [];
        let lastResetSeconds = 0; 
        let lastPendingCount = 0; 
        let soundEnabled = false;
        let pendingAction = null; 

        // --- INITIALIZATION ---
        function init() {
            db.collection('settings').doc('config').onSnapshot(doc => { 
                if(doc.exists && doc.data().lastReset) lastResetSeconds = doc.data().lastReset.seconds; 
                recalculateData(); 
            });
            db.collection('settings').doc('status').onSnapshot(doc => { 
                isShopOpen = doc.exists ? doc.data().isOpen : true; 
                const btn = document.getElementById('shop-toggle-btn'); 
                btn.innerText = isShopOpen ? "OPEN" : "CLOSED"; 
                btn.className = isShopOpen ? "px-3 py-2 rounded text-xs font-bold bg-green-600 text-white shadow-lg shadow-green-900/50" : "px-3 py-2 rounded text-xs font-bold bg-red-600 text-white shadow-lg shadow-red-900/50"; 
            });
            db.collection('payments').orderBy('timestamp', 'desc').onSnapshot(snap => { window.paymentsSnapshot = snap; recalculateData(); });
            db.collection('orders').orderBy('timestamp', 'desc').onSnapshot(snap => { window.ordersSnapshot = snap; recalculateData(); });
        }

        function enableSound() { 
            if(!soundEnabled) { 
                const audio = document.getElementById('order-sound'); 
                audio.play().then(() => { 
                    audio.pause(); audio.currentTime = 0; 
                    soundEnabled = true; 
                    document.getElementById('sound-status').innerHTML = '<i class="fas fa-volume-up text-green-500"></i> Sound Active'; 
                }).catch(e => console.log("Init Sound")); 
            } 
        }
        function playNotification() { 
            if(soundEnabled) { const audio = document.getElementById('order-sound'); audio.currentTime = 0; audio.play().catch(e => {}); } 
        }

        // --- DATA HANDLING ---
        function recalculateData() {
            if(!window.ordersSnapshot) return;
            udhaarMap = {}; allHistoryOrders = []; let liveHtml = '', sales = 0, activeCount = 0;

            if(window.paymentsSnapshot) { 
                window.paymentsSnapshot.docs.forEach(doc => { 
                    const d = doc.data(); 
                    if(!udhaarMap[d.phone]) udhaarMap[d.phone] = { name: "Unknown", debit: 0, credit: 0 }; 
                    udhaarMap[d.phone].credit += d.amount; 
                }); 
            }

            window.ordersSnapshot.docs.forEach(doc => {
                const data = doc.data(); const id = doc.id;
                const orderTime = data.timestamp ? data.timestamp.seconds : 0;
                
                // History Logic
                if(data.status === 'completed' || data.status === 'cancelled') allHistoryOrders.push({id, ...data});
                
                // Udhaar Logic
                if(data.paymentMode === 'Udhaar' && data.customerPhone) { 
                    if(!udhaarMap[data.customerPhone]) udhaarMap[data.customerPhone] = { name: data.customerName, debit: 0, credit: 0 }; 
                    if(data.status !== 'cancelled') { 
                        udhaarMap[data.customerPhone].debit += data.totalAmount; 
                        udhaarMap[data.customerPhone].name = data.customerName; 
                    } 
                }
                
                // Sales Logic
                if(orderTime > lastResetSeconds && data.status === 'completed') sales += data.totalAmount;

                // Live Orders Logic
                const isActive = ['pending', 'cooking', 'ready'].includes(data.status);
                if(isActive) {
                    activeCount++;
                    const isUpiPending = (data.paymentMode === 'UPI' && !data.paymentVerified);
                    const itemStr = data.items.map(i => `${i.qty} x ${i.name}`).join(', ');
                    
                    liveHtml += `
                    <div class="card p-4 border-l-4 ${data.paymentMode === 'Udhaar' ? 'border-red-500' : 'border-blue-500'} animate-fade-in relative">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <h3 class="font-bold text-lg leading-tight">${data.customerName}</h3>
                                <span class="text-[10px] uppercase tracking-wide px-2 py-0.5 rounded ${data.paymentMode === 'Udhaar' ? 'bg-red-900 text-red-200' : 'bg-blue-900 text-blue-200'}">${data.paymentMode}</span>
                            </div>
                            <div class="text-right">
                                <h3 class="font-bold text-xl text-orange-400">₹${data.totalAmount}</h3>
                                <button onclick="sendWhatsApp('${data.customerName}', '${data.customerPhone}', '${itemStr}', ${data.totalAmount})" class="text-green-500 hover:text-green-400 mt-1"><i class="fab fa-whatsapp fa-lg"></i></button>
                            </div>
                        </div>
                        
                        ${data.customerAddress ? `<div class="bg-gray-800/50 p-2 rounded mb-2 flex items-start gap-2"><i class="fas fa-map-marker-alt text-orange-500 mt-0.5 text-xs"></i><p class="text-xs text-gray-300 leading-tight">${data.customerAddress}</p></div>` : ''}

                        <ul class="text-sm text-gray-300 mb-3 space-y-1 pl-1 border-l border-gray-700 ml-1">
                            ${data.items.map(i => `<li><span class="font-bold text-white">${i.qty}</span> ${i.name}</li>`).join('')}
                        </ul>

                        ${isUpiPending ? `<div class="bg-yellow-900/30 border border-yellow-700/50 text-yellow-200 text-xs p-2 rounded mb-3 flex justify-between items-center"><span><i class="fas fa-exclamation-circle"></i> UPI Check!</span><button onclick="confirmAction('Verify UPI Payment?', () => verifyPayment('${id}'))" class="bg-yellow-600 text-white px-3 py-1 rounded shadow-lg">Verify</button></div>` : ''}
                        
                        <div class="flex gap-2 items-center bg-gray-900/50 p-1 rounded-lg">
                            <select onchange="updateStatus('${id}', this.value)" class="bg-gray-800 text-white text-xs p-2 rounded border-none outline-none focus:ring-1 ring-orange-500">
                                <option value="pending" ${data.status === 'pending' ? 'selected' : ''}>Pending</option>
                                <option value="cooking" ${data.status === 'cooking' ? 'selected' : ''}>Cooking</option>
                                <option value="ready" ${data.status === 'ready' ? 'selected' : ''}>Ready</option>
                            </select>
                            <button onclick="markComplete('${id}')" class="bg-green-600 text-white py-2 px-4 rounded text-xs font-bold flex-1 shadow-lg shadow-green-900/20 active:scale-95 transition">COMPLETE</button>
                            <button onclick="confirmAction('Cancel Order?', () => cancelOrder('${id}'))" class="text-red-500 hover:bg-red-900/20 w-8 h-8 rounded flex items-center justify-center transition"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>`;
                }
            });

            if(activeCount > lastPendingCount) playNotification();
            lastPendingCount = activeCount;
            document.getElementById('view-live').innerHTML = liveHtml || '<div class="flex flex-col items-center justify-center pt-20 opacity-50"><i class="fas fa-mug-hot text-4xl mb-2 text-gray-600"></i><p class="text-gray-500">No active orders</p></div>';
            document.getElementById('total-sales').innerText = sales;
            document.getElementById('pending-count').innerText = activeCount;
            renderUdhaar(); if(!document.getElementById('view-history').classList.contains('hidden')) renderHistory();
            
            // If modal is open, refresh history
            if(!document.getElementById('settle-modal').classList.contains('hidden') && currentSettlePhone) {
                renderSettleHistory(currentSettlePhone);
            }
        }

        // --- UI RENDERERS ---
        function renderUdhaar() {
            const list = document.getElementById('udhaar-list'); const q = document.getElementById('search-udhaar').value.toLowerCase(); let html = '';
            for(let phone in udhaarMap) {
                const u = udhaarMap[phone]; const netDue = u.debit - u.credit;
                if(netDue > 0 && (u.name.toLowerCase().includes(q) || phone.includes(q))) {
                    html += `
                    <div class="card p-3 flex justify-between items-center animate-fade-in">
                        <div><h4 class="font-bold text-white">${u.name}</h4><p class="text-xs text-gray-400 tracking-wide">${phone}</p></div>
                        <div class="text-right">
                            <h4 class="text-red-400 font-bold text-lg">₹${netDue}</h4>
                            <div class="flex gap-2 mt-1 justify-end">
                                <button onclick="sendWhatsApp('${u.name}', '${phone}', 'Udhaar Reminder', ${netDue})" class="text-green-500 hover:text-green-400"><i class="fab fa-whatsapp"></i></button>
                                <button onclick="openSettle('${phone}', '${u.name}', ${netDue})" class="bg-blue-600 text-white text-[10px] px-2 py-1 rounded font-bold shadow">SETTLE</button>
                            </div>
                        </div>
                    </div>`;
                }
            }
            list.innerHTML = html || "<p class='text-center text-gray-500 text-sm mt-10'>No Udhaar pending.</p>";
        }

        function renderHistory() {
            const container = document.getElementById('history-container');
            let groups = {}; allHistoryOrders.forEach(o => { const k = o.customerPhone || "Unknown"; if(!groups[k]) groups[k] = { name: o.customerName, orders: [] }; groups[k].orders.push(o); });
            
            if(Object.keys(groups).length === 0) { container.innerHTML = "<p class='text-center text-gray-500 text-sm mt-10'>No history available.</p>"; return; }
            
            container.innerHTML = Object.keys(groups).map(p => {
                const g = groups[p]; const t = g.orders.reduce((s, o) => s + (o.status === 'completed' ? o.totalAmount : 0), 0);
                return `
                <div class="card overflow-hidden">
                    <div onclick="this.nextElementSibling.classList.toggle('hidden')" class="p-3 bg-gray-800 flex justify-between items-center cursor-pointer hover:bg-gray-750 transition">
                        <div><h3 class="font-bold text-white text-sm">${g.name}</h3><p class="text-[10px] text-gray-400">${p}</p></div>
                        <div class="text-right"><p class="text-orange-400 font-bold text-sm">Total: ₹${t}</p><p class="text-[10px] text-gray-500">${g.orders.length} orders <i class="fas fa-chevron-down ml-1"></i></p></div>
                    </div>
                    <div class="hidden bg-black/20 p-2 space-y-2 border-t border-gray-700">
                        ${g.orders.map(o => {
                            const dateStr = o.timestamp ? new Date(o.timestamp.toDate()).toLocaleDateString() + ' ' + new Date(o.timestamp.toDate()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '';
                            return `
                            <div onclick="openHistoryDetail('${o.id}')" class="flex justify-between items-center bg-gray-800 p-2 rounded border border-gray-700/50 cursor-pointer hover:bg-gray-700 transition relative">
                                <div>
                                    <span class="text-gray-500 text-[10px] block">${dateStr}</span> 
                                    <span class="text-[10px] uppercase font-bold px-1 rounded ${o.status==='completed'?'bg-green-900 text-green-300':'bg-red-900 text-red-300'}">${o.status}</span>
                                    <p class="text-xs text-gray-300 mt-1 truncate max-w-[150px]">${o.items.map(i=>i.name).join(', ')}</p>
                                </div>
                                <div class="flex items-center gap-3">
                                    <span class="font-bold text-white text-sm">₹${o.totalAmount}</span>
                                    <button onclick="event.stopPropagation(); confirmAction('Delete this record?', () => deleteHistoryItem('${o.id}'))" class="text-red-500 text-xs p-1 opacity-50 hover:opacity-100"><i class="fas fa-trash"></i></button>
                                </div>
                            </div>`;
                        }).join('')}
                    </div>
                </div>`;
            }).join('');
        }

        // --- NEW: History Detail Logic ---
        function openHistoryDetail(id) {
            const data = allHistoryOrders.find(o => o.id === id);
            if(!data) return;

            // Date & Time
            const dateStr = data.timestamp ? new Date(data.timestamp.toDate()).toLocaleDateString() + ' ' + new Date(data.timestamp.toDate()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : 'N/A';
            document.getElementById('hd-date').innerText = dateStr;
            
            // Customer
            document.getElementById('hd-customer').innerText = (data.customerName || 'Guest') + '\n' + (data.customerPhone || '');
            
            // Payment Mode
            const mode = data.paymentMode || 'Cash';
            document.getElementById('hd-payment').innerText = mode;
            document.getElementById('hd-payment').className = "font-bold text-right " + (mode === 'Udhaar' ? 'text-red-400' : 'text-blue-400');

            // Status
            document.getElementById('hd-status').innerText = data.status;
            document.getElementById('hd-status').className = "uppercase font-bold text-right " + (data.status === 'completed' ? 'text-green-500' : 'text-yellow-500');

            // Total
            document.getElementById('hd-total').innerText = '₹' + data.totalAmount;

            // Items List
            const itemsContainer = document.getElementById('hd-items');
            itemsContainer.innerHTML = data.items.map(i => `
                <div class="flex justify-between items-center mb-2 border-b border-gray-700 pb-1 last:border-0 last:pb-0">
                    <div>
                        <p class="text-sm font-bold text-white">${i.name}</p>
                        <p class="text-xs text-gray-400">Qty: ${i.qty}</p>
                    </div>
                    <p class="font-bold text-orange-400 text-sm">₹${(i.price || 0) * i.qty}</p>
                </div>
            `).join('');

            document.getElementById('history-detail-modal').classList.remove('hidden');
        }

        function closeHistoryDetail() {
            document.getElementById('history-detail-modal').classList.add('hidden');
        }

        // --- ACTIONS ---
        function sendWhatsApp(name, phone, items, total) {
            if(!phone) { showToast("No Phone Number", "error"); return; }
            let p = phone.replace(/\D/g,''); if(p.length === 10) p = "91" + p;
            const text = `*SGMC Chai Stall* ☕\n\nHello ${name},\nYour Order: ${items}\n*Total: ₹${total}*\n\nThank you!`;
            window.open(`https://wa.me/${p}?text=${encodeURIComponent(text)}`, '_blank');
        }

        // --- TOAST & CONFIRM SYSTEM ---
        function showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            const el = document.createElement('div');
            el.className = `toast ${type === 'success' ? 'toast-success' : 'toast-error'}`;
            el.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i> <span>${msg}</span>`;
            container.appendChild(el);
            setTimeout(() => el.classList.add('show'), 10);
            setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 2000);
        }

        function confirmAction(title, callback) {
            document.getElementById('confirm-title').innerText = title;
            document.getElementById('custom-confirm').classList.remove('hidden');
            setTimeout(() => document.querySelector('.confirm-box').classList.add('open'), 10);
            pendingAction = callback;
        }

        function closeConfirm(result) {
            document.querySelector('.confirm-box').classList.remove('open');
            setTimeout(() => document.getElementById('custom-confirm').classList.add('hidden'), 200);
            if(result && pendingAction) pendingAction();
            pendingAction = null;
        }

        // --- CORE FUNCTIONS ---
        function deleteHistoryItem(id) { db.collection('orders').doc(id).delete().then(() => showToast("Deleted")); }
        
        function openSettle(phone, name, due) { 
            currentSettlePhone = phone; 
            document.getElementById('settle-name').innerText = name + " (" + phone + ")"; 
            document.getElementById('settle-due').innerText = due; 
            document.getElementById('settle-amount').value = ""; 
            
            // Render History immediately
            renderSettleHistory(phone);
            
            document.getElementById('settle-modal').classList.remove('hidden'); 
        }
        
        function renderSettleHistory(phone) {
            const list = document.getElementById('settle-history-list');
            list.innerHTML = '<p class="text-center text-gray-600 text-xs">Loading...</p>';
            
            if(!window.paymentsSnapshot) {
                list.innerHTML = '<p class="text-center text-gray-600 text-xs">No data.</p>';
                return;
            }

            const payments = [];
            window.paymentsSnapshot.docs.forEach(doc => {
                const d = doc.data();
                if(d.phone === phone) payments.push(d);
            });

            if(payments.length === 0) {
                list.innerHTML = '<p class="text-center text-gray-500 text-xs">No previous payments found.</p>';
                return;
            }

            list.innerHTML = payments.map(p => {
                const dateStr = p.timestamp ? new Date(p.timestamp.toDate()).toLocaleDateString() : 'N/A';
                const timeStr = p.timestamp ? new Date(p.timestamp.toDate()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '';
                
                return `
                <div class="flex justify-between items-center bg-gray-800 p-2 rounded border border-gray-700">
                    <div>
                        <span class="text-green-400 font-bold text-sm">+₹${p.amount}</span>
                        <p class="text-[10px] text-gray-500">${p.mode || 'Cash'}</p>
                    </div>
                    <div class="text-right text-xs text-gray-400">
                        <p>${dateStr}</p>
                        <p>${timeStr}</p>
                    </div>
                </div>`;
            }).join('');
        }

        function closeSettle() { document.getElementById('settle-modal').classList.add('hidden'); }
        
        function submitPayment() { 
            const amount = parseInt(document.getElementById('settle-amount').value); 
            if(!amount) return; 
            db.collection('payments').add({ 
                phone: currentSettlePhone, 
                amount: amount, 
                timestamp: firebase.firestore.FieldValue.serverTimestamp(), 
                mode: 'Cash (Admin)' // Defaulting to Cash since admin collects it
            }).then(() => { 
                closeSettle(); 
                showToast("Payment Settled"); 
            }); 
        }
        
        function endDay() { db.collection('settings').doc('config').set({ lastReset: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true }).then(() => showToast("Day Reset Successful")); }
        function openMenuControl() { db.collection('settings').doc('menu').get().then(doc => { const s = doc.exists ? doc.data() : {}; document.getElementById('menu-list-items').innerHTML = adminMenuItems.map(i => `<div class="flex justify-between items-center bg-gray-800 p-3 rounded border border-gray-700"><span>${i.name}</span><input type="checkbox" id="stock-${i.id}" ${s[i.id]!==false?'checked':''} class="w-5 h-5 accent-green-500 bg-gray-700 border-gray-600 rounded"></div>`).join(''); document.getElementById('menu-modal').classList.remove('hidden'); }); }
        function saveMenuStatus() { const u = {}; adminMenuItems.forEach(i => u[i.id] = document.getElementById(`stock-${i.id}`).checked); db.collection('settings').doc('menu').set(u).then(() => { document.getElementById('menu-modal').classList.add('hidden'); showToast("Menu Updated"); }); }
        function toggleShop() { db.collection('settings').doc('status').set({ isOpen: !isShopOpen }).then(() => showToast(isShopOpen ? "Shop Closed" : "Shop Opened")); }
        function updateStatus(id, st) { db.collection('orders').doc(id).update({ status: st }).then(() => showToast("Status Updated")); }
        
        // NEW: Mark Complete with Confirmation
        function markComplete(id) { 
            confirmAction('Mark as Delivered?', () => {
                db.collection('orders').doc(id).update({ status: 'completed' }).then(() => showToast("Order Completed")); 
            });
        }
        
        function cancelOrder(id) { db.collection('orders').doc(id).update({ status: 'cancelled' }).then(() => showToast("Order Cancelled")); }
        function verifyPayment(id) { db.collection('orders').doc(id).update({ paymentVerified: true }).then(() => showToast("Payment Verified")); }
        
        function switchTab(t) { 
            ['live', 'history', 'udhaar'].forEach(x => { 
                document.getElementById(`view-${x}`).classList.add('hidden'); 
                document.getElementById(`tab-${x}`).classList.remove('tab-active', 'text-white'); 
                document.getElementById(`tab-${x}`).classList.add('text-gray-500'); 
            }); 
            document.getElementById(`view-${t}`).classList.remove('hidden'); 
            document.getElementById(`tab-${t}`).classList.add('tab-active', 'text-white'); 
            document.getElementById(`tab-${t}`).classList.remove('text-gray-500'); 
            if(t==='history') renderHistory(); 
        }
        function filterUdhaar() { renderUdhaar(); }
        init();
    </script>
</body>
</html>
