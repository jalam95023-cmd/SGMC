<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGMC Admin Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #080808; color: white; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        .card { background: #141414; border-radius: 16px; border: 1px solid #222; }
        .tab-active { border-bottom: 3px solid #F97316; color: #F97316; font-weight: bold; }
        .modal-overlay { background: rgba(0,0,0,0.92); backdrop-filter: blur(10px); z-index: 100; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="p-4 max-w-2xl mx-auto pb-24" onclick="enableSound()">

    <div class="flex justify-between items-center mb-6">
        <div>
            <h1 class="text-2xl font-bold text-orange-500">SGMC <span class="text-white text-sm">Admin</span></h1>
            <p id="shop-badge" class="text-[10px] uppercase font-bold text-green-500">● Shop Open</p>
        </div>
        <button id="shop-toggle-btn" onclick="toggleShop()" class="px-4 py-2 rounded-xl text-[10px] font-bold bg-gray-800 border border-gray-700">TOGGLE SHOP</button>
    </div>

    <div class="grid grid-cols-2 gap-3 mb-4">
        <div class="card p-4 relative overflow-hidden" onclick="openReports()">
            <p class="text-[10px] text-gray-500 uppercase font-bold tracking-widest">Today's Sales</p>
            <h2 class="text-2xl font-bold text-green-500">₹<span id="total-sales">0</span></h2>
            <i class="fas fa-chart-line absolute -right-2 -bottom-2 opacity-10 text-4xl"></i>
        </div>
        <div class="card p-4">
            <p class="text-[10px] text-gray-500 uppercase font-bold tracking-widest">Live Orders</p>
            <h2 class="text-2xl font-bold text-yellow-400" id="pending-count">0</h2>
        </div>
    </div>

    <div class="grid grid-cols-3 gap-2 mb-6">
        <button onclick="openInventory()" class="bg-blue-600/10 border border-blue-500/30 text-blue-400 p-3 rounded-xl text-[10px] font-bold"><i class="fas fa-boxes mb-1 block text-lg"></i> INVENTORY</button>
        <button onclick="switchTab('rider')" class="bg-purple-600/10 border border-purple-500/30 text-purple-400 p-3 rounded-xl text-[10px] font-bold"><i class="fas fa-motorcycle mb-1 block text-lg"></i> RIDER MGMT</button>
        <button onclick="confirmReset()" class="bg-red-600/10 border border-red-500/30 text-red-400 p-3 rounded-xl text-[10px] font-bold"><i class="fas fa-calendar-check mb-1 block text-lg"></i> RESET DAY</button>
    </div>

    <div class="flex mb-4 border-b border-gray-800 text-center">
        <button onclick="switchTab('live')" id="tab-live" class="flex-1 py-3 tab-active text-xs">LIVE ORDERS</button>
        <button onclick="switchTab('history')" id="tab-history" class="flex-1 py-3 text-gray-500 text-xs">HISTORY</button>
        <button onclick="switchTab('udhaar')" id="tab-udhaar" class="flex-1 py-3 text-gray-500 text-xs">UDHAAR</button>
    </div>

    <div id="view-live" class="space-y-3"></div>
    <div id="view-history" class="hidden space-y-3"></div>
    <div id="view-udhaar" class="hidden space-y-3"></div>

    <div id="view-rider" class="hidden space-y-4">
        <div class="card p-6 text-center bg-gradient-to-br from-purple-900/20 to-black border-purple-500/20">
            <p class="text-xs text-gray-400 uppercase">Cash with Rider</p>
            <h1 class="text-4xl font-bold text-white mt-1">₹<span id="rider-cash-val">0</span></h1>
            <button onclick="settleRiderCash()" class="mt-4 bg-purple-600 text-white px-8 py-2 rounded-full font-bold text-xs shadow-lg shadow-purple-900/40">COLLECT & SETTLE</button>
        </div>
        <div id="rider-order-handover" class="space-y-2"></div>
    </div>

    <div id="inventory-modal" class="fixed inset-0 modal-overlay hidden flex items-center justify-center p-4">
        <div class="bg-[#111] w-full max-w-sm rounded-3xl border border-gray-800 p-6 max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold">Stock & Prices</h2>
                <button onclick="closeModal('inventory-modal')"><i class="fas fa-times text-gray-500"></i></button>
            </div>
            <div id="inventory-list" class="space-y-3 overflow-y-auto flex-1 pr-1"></div>
            <div class="mt-4 pt-4 border-t border-gray-800">
                <p class="text-[10px] text-gray-500 uppercase font-bold mb-3">Add New Item</p>
                <div class="space-y-2">
                    <input id="new-p-name" placeholder="Item Name" class="w-full bg-black border border-gray-800 p-3 rounded-xl text-sm outline-none">
                    <div class="flex gap-2">
                        <input id="new-p-price" type="number" placeholder="Price" class="w-1/2 bg-black border border-gray-800 p-3 rounded-xl text-sm outline-none">
                        <input id="new-p-stock" type="number" placeholder="Stock" class="w-1/2 bg-black border border-gray-800 p-3 rounded-xl text-sm outline-none">
                    </div>
                    <button onclick="addNewProduct()" class="w-full bg-orange-600 py-3 rounded-xl font-bold text-sm">ADD TO MENU</button>
                </div>
            </div>
        </div>
    </div>

    <div id="reports-modal" class="fixed inset-0 modal-overlay hidden flex items-center justify-center p-4">
        <div class="bg-[#111] w-full max-w-sm rounded-3xl border border-gray-800 p-6 max-h-[80vh] flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold">Sales Archive</h2>
                <button onclick="closeModal('reports-modal')"><i class="fas fa-times text-gray-500"></i></button>
            </div>
            <div id="reports-list" class="space-y-3 overflow-y-auto"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = { /* PASTE_YOUR_FIREBASE_CONFIG_HERE */ };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let salesToday = 0;
        let itemsSold = {};

        function init() {
            listenOrders();
            listenRider();
            listenInventory();
            listenSettings();
        }

        function listenSettings() {
            db.collection('settings').doc('config').onSnapshot(doc => {
                const lastReset = doc.data().lastReset;
                db.collection('orders').where('timestamp', '>', lastReset).where('status', '==', 'completed').onSnapshot(snap => {
                    salesToday = 0; itemsSold = {};
                    snap.forEach(d => {
                        const data = d.data();
                        salesToday += data.totalAmount;
                        data.items.forEach(it => { itemsSold[it.name] = (itemsSold[it.name] || 0) + it.qty; });
                    });
                    document.getElementById('total-sales').innerText = salesToday;
                });
            });
        }

        function confirmReset() {
            if(!confirm("Are you sure you want to Reset Day? Data will be archived.")) return;
            const topItem = Object.keys(itemsSold).reduce((a, b) => itemsSold[a] > itemsSold[b] ? a : b, "None");
            
            db.collection('daily_reports').add({
                date: new Date().toLocaleDateString(),
                totalAmount: salesToday,
                topSelling: topItem,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                db.collection('settings').doc('config').update({ lastReset: firebase.firestore.FieldValue.serverTimestamp() });
                alert("Day Reset Successful!");
            });
        }

        function listenInventory() {
            db.collection('products').orderBy('name').onSnapshot(snap => {
                const list = document.getElementById('inventory-list');
                list.innerHTML = snap.docs.map(doc => {
                    const p = doc.data();
                    return `
                    <div class="card bg-black/40 p-3 border-gray-800 flex justify-between items-center">
                        <div class="w-1/2">
                            <p class="text-xs font-bold truncate">${p.name}</p>
                            <input type="number" onchange="updatePrice('${doc.id}', this.value)" value="${p.price}" class="w-16 bg-transparent text-orange-500 font-bold text-sm outline-none">
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="updateStock('${doc.id}', -1)" class="w-8 h-8 rounded-lg bg-gray-800">-</button>
                            <span class="text-xs font-bold w-6 text-center">${p.stock}</span>
                            <button onclick="updateStock('${doc.id}', 1)" class="w-8 h-8 rounded-lg bg-orange-600">+</button>
                            <button onclick="deleteProduct('${doc.id}')" class="ml-2 text-red-900"><i class="fas fa-trash-alt"></i></button>
                        </div>
                    </div>`;
                }).join('');
            });
        }

        function addNewProduct() {
            const name = document.getElementById('new-p-name').value;
            const price = parseInt(document.getElementById('new-p-price').value);
            const stock = parseInt(document.getElementById('new-p-stock').value);
            if(!name || !price) return alert("Fill Name and Price!");
            db.collection('products').add({ name, price, stock: stock || 0 }).then(() => {
                document.getElementById('new-p-name').value = '';
                document.getElementById('new-p-price').value = '';
                document.getElementById('new-p-stock').value = '';
            });
        }

        function openReports() {
            document.getElementById('reports-modal').classList.remove('hidden');
            db.collection('daily_reports').orderBy('timestamp', 'desc').limit(15).get().then(snap => {
                const list = document.getElementById('reports-list');
                list.innerHTML = snap.docs.map(doc => {
                    const r = doc.data();
                    return `<div class="card p-3 border-gray-800 flex justify-between items-center">
                        <div><p class="text-[10px] text-gray-500">${r.date}</p><p class="text-xs">Top: ${r.topSelling}</p></div>
                        <p class="font-bold text-green-500 text-sm">₹${r.totalAmount}</p>
                    </div>`;
                }).join('');
            });
        }

        function updateStock(id, c) { db.collection('products').doc(id).update({ stock: firebase.firestore.FieldValue.increment(c) }); }
        function updatePrice(id, v) { db.collection('products').doc(id).update({ price: parseInt(v) }); }
        function deleteProduct(id) { if(confirm("Delete this item?")) db.collection('products').doc(id).delete(); }
        function openInventory() { document.getElementById('inventory-modal').classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        
        // Settle Rider Cash
        function listenRider() {
            db.collection('settings').doc('rider_stats').onSnapshot(doc => {
                document.getElementById('rider-cash-val').innerText = doc.data()?.cashInHand || 0;
            });
        }
        function settleRiderCash() {
            const val = document.getElementById('rider-cash-val').innerText;
            if(confirm(`Received ₹${val} from Rider? balance will be 0.`)) {
                db.collection('settings').doc('rider_stats').update({ cashInHand: 0 });
            }
        }

        init();
    </script>
</body>
</html>
