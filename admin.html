<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGMC - Admin Dashboard</title>
    <style>
        /* Dark Theme Admin UI */
        body { font-family: 'Segoe UI', sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        
        h1 { text-align: center; color: #f39c12; margin-bottom: 20px; }

        /* Stats Section */
        .stats-container { display: flex; gap: 10px; margin-bottom: 20px; }
        .stat-box { flex: 1; background: #1e1e1e; padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border: 1px solid #333; }
        .stat-number { font-size: 32px; font-weight: bold; color: #f39c12; margin-top: 5px; }
        .stat-label { font-size: 14px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }

        /* Shop Control Switch */
        .control-panel { background: #1e1e1e; padding: 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border: 1px solid #333; }
        .status-text { font-size: 18px; font-weight: bold; }
        button#toggleBtn { padding: 12px 25px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 16px; }
        .btn-open { background-color: #27ae60; color: white; }
        .btn-closed { background-color: #c0392b; color: white; }

        /* Order List */
        .order-card { background: #252525; padding: 15px; margin-bottom: 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid #f39c12; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .order-details h3 { margin: 0 0 5px 0; font-size: 18px; color: #fff; }
        .order-details p { margin: 2px 0; color: #bbb; font-size: 14px; }
        .payment-badge { font-size: 12px; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
        .badge-cash { background: #27ae60; color: white; }
        .badge-udhaar { background: #c0392b; color: white; }
        
        /* Delete Button */
        .delete-btn { background: #e74c3c; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-size: 14px; margin-left: 10px; }
        .delete-btn:hover { background: #c0392b; }

    </style>
</head>
<body>

    <div class="container">
        <h1>🛠️ SGMC Admin</h1>
        
        <div class="stats-container">
            <div class="stat-box">
                <div class="stat-label">Total Orders</div>
                <div class="stat-number" id="totalOrders">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Udhaar Orders</div>
                <div class="stat-number" id="udhaarCount" style="color: #e74c3c;">0</div>
            </div>
        </div>

        <div class="control-panel">
            <span id="shopStatusText" class="status-text">Status Check...</span>
            <button id="toggleBtn" onclick="toggleShop()">Loading...</button>
        </div>

        <h3 style="color: #888; border-bottom: 1px solid #333; padding-bottom: 10px;">Recent Orders</h3>
        <div id="adminOrderList">
            <p style="text-align: center; color: #555;">Orders loading...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc, setDoc, query, orderBy } 
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBadYpoNTL0dHkBQO4UddRVtPIfUOlf-bA",
            authDomain: "sgmc-16568.firebaseapp.com",
            projectId: "sgmc-16568",
            storageBucket: "sgmc-16568.firebasestorage.app",
            messagingSenderId: "339041646158",
            appId: "1:339041646158:web:85d9a50a3b51b30aae351f",
            measurementId: "G-4996NPF55N"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- SHOP STATUS LOGIC ---
        const statusDocRef = doc(db, "shopSettings", "status");
        let currentStatus = true;

        onSnapshot(statusDocRef, (docSnap) => {
            const btn = document.getElementById("toggleBtn");
            const txt = document.getElementById("shopStatusText");

            if (docSnap.exists()) {
                currentStatus = docSnap.data().isOpen;
            } else {
                setDoc(statusDocRef, { isOpen: true });
                currentStatus = true;
            }

            if (currentStatus) {
                txt.innerHTML = "🟢 Dukan Khuli Hai";
                txt.style.color = "#2ecc71";
                btn.innerText = "BAND KARO (Close)";
                btn.className = "btn-closed";
            } else {
                txt.innerHTML = "🔴 Dukan Band Hai";
                txt.style.color = "#e74c3c";
                btn.innerText = "KHOLO (Open)";
                btn.className = "btn-open";
            }
        });

        window.toggleShop = async function() {
            try { await updateDoc(statusDocRef, { isOpen: !currentStatus }); } 
            catch (e) { alert("Error changing status"); }
        }

        // --- ORDER LIST LOGIC ---
        const q = query(collection(db, "orders"), orderBy("timestamp", "desc"));
        onSnapshot(q, (snapshot) => {
            const listDiv = document.getElementById("adminOrderList");
            const totalDiv = document.getElementById("totalOrders");
            const udhaarDiv = document.getElementById("udhaarCount");

            listDiv.innerHTML = "";
            let total = 0;
            let udhaar = 0;

            snapshot.forEach((doc) => {
                const order = doc.data();
                total++;
                if (order.payment.includes("Udhaar")) udhaar++;

                const badgeClass = order.payment.includes("Udhaar") ? "badge-udhaar" : "badge-cash";

                listDiv.innerHTML += `
                    <div class="order-card">
                        <div class="order-details">
                            <h3>${order.customer} <span style="font-size:12px; color:#aaa;">(${order.phone || "No Phone"})</span></h3>
                            <p>🛒 ${order.items.join(", ")}</p>
                            <span class="payment-badge ${badgeClass}">${order.payment}</span>
                        </div>
                        <button class="delete-btn" onclick="deleteOrder('${doc.id}')">Done ✅</button>
                    </div>
                `;
            });
            totalDiv.innerText = total;
            udhaarDiv.innerText = udhaar;
            if(total === 0) listDiv.innerHTML = "<p style='text-align:center; color:#555;'>No new orders.</p>";
        });

        window.deleteOrder = async function(id) {
            if(confirm("Order complete ho gaya?")) await deleteDoc(doc(db, "orders", id));
        }
    </script>
</body>
</html>
