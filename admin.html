<!DOCTYPE html>
<html>
<head>
  <title>SGMC – Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{font-family:Arial;background:#f4f4f4;margin:0;padding:10px}
    h2{text-align:center}
    .order{background:#fff;padding:10px;margin-bottom:10px;border-radius:8px}
    button{padding:6px 10px;margin:3px;border:none;border-radius:5px;color:#fff}
    .accept{background:#007bff}
    .reject{background:#dc3545}
    .prep{background:#ffc107;color:#000}
    .ready{background:#28a745}
  </style>
</head>
<body>

<h2>🧑‍🍳 SGMC – Admin Panel</h2>

<div id="orders"></div>

<script src="firebase.js"></script>

<script>
db.collection("orders").orderBy("time","desc")
.onSnapshot(snap=>{
  orders.innerHTML="";
  snap.forEach(doc=>{
    const o=doc.data();
    orders.innerHTML+=`
      <div class="order">
        <b>${o.name}</b> (${o.phone})<br>
        Items: ${o.items.map(i=>i.name).join(", ")}<br>
        Total: ₹${o.total}<br>
        Status: <b>${o.status}</b><br><br>

        <button class="accept" onclick="update('${doc.id}','Accepted')">Accept</button>
        <button class="reject" onclick="update('${doc.id}','Rejected')">Reject</button><br>
        <button class="prep" onclick="update('${doc.id}','Preparing')">Preparing</button>
        <button class="ready" onclick="update('${doc.id}','Ready')">Ready</button>
      </div>
    `;
  });
});

function update(id,status){
  db.collection("orders").doc(id).update({status});
}
</script>

</body>
</html>
