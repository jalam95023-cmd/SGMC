<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGMC Admin Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0f0f0f; color: white; font-family: sans-serif; transition: background 0.3s, color 0.3s; }
        .card { background: #1f1f1f; border-radius: 12px; border: 1px solid #333; transition: background 0.3s, border 0.3s; }
        /* Light Mode Styles */
        body.light-mode { background-color: #f3f4f6; color: #111; }
        body.light-mode .card { background: #ffffff; border-color: #e5e7eb; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        body.light-mode .text-gray-400 { color: #6b7280; } body.light-mode .text-gray-500 { color: #9ca3af; }
        body.light-mode .bg-gray-800 { background-color: #f9fafb; border: 1px solid #e5e7eb; color: #111; }
        body.light-mode .bg-gray-900 { background-color: #ffffff; border: 1px solid #e5e7eb; color: #111; }
        
        .sidebar { position: fixed; top: 0; right: 0; bottom: 0; width: 280px; background: #1a1a1a; z-index: 100; transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); border-left: 1px solid #333; }
        body.light-mode .sidebar { background: #ffffff; border-left: 1px solid #e5e7eb; }
        .sidebar.open { transform: translateX(0); }
        .tab-active { border-bottom: 2px solid #F97316; color: #F97316; }
        #toast-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 110; pointer-events: none; }
        .toast { background: rgba(30, 30, 30, 0.95); border: 1px solid #333; padding: 10px 20px; border-radius: 50px; color: white; font-size: 14px; opacity: 0; transform: translateY(20px); transition: all 0.3s; display: flex; align-items: center; gap: 8px; }
        .toast.show { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body class="p-4 max-w-2xl mx-auto pb-24" onclick="enableSound()">

    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-orange-500">SGMC Admin</h1>
        <div class="flex gap-3">
            <button onclick="setShopLocation()" class="w-9 h-9 rounded-full bg-blue-900/20 text-blue-500 border border-blue-500/30 flex items-center justify-center"><i class="fas fa-map-marker-alt"></i></button>
            <button onclick="toggleSidebar()" class="w-9 h-9 rounded-full bg-gray-800 text-white border border-gray-700 flex items-center justify-center"><i class="fas fa-bars"></i></button>
        </div>
    </div>

    <div id="sidebar" class="sidebar p-6 shadow-2xl flex flex-col h-full">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-xl font-bold text-orange-500">Menu</h2>
            <button onclick="toggleSidebar()" class="text-gray-500 text-xl"><i class="fas fa-times"></i></button>
        </div>
        <div class="space-y-4 flex-1">
            <div class="flex justify-between items-center p-3 bg-gray-800 rounded-lg">
                <span class="font-bold">Shop Status</span>
                <button id="shop-toggle-btn" onclick="toggleShop()" class="px-3 py-1 rounded text-xs font-bold bg-green-600 text-white">OPEN</button>
            </div>
            <button onclick="toggleTheme()" class="w-full text-left p-3 bg-gray-800 rounded-lg font-bold flex justify-between items-center">
                <span><i class="fas fa-moon mr-2 text-purple-400"></i> Day/Night</span>
                <i class="fas fa-toggle-on text-2xl text-purple-500" id="theme-icon"></i>
            </button>
            <button onclick="openMenuControl(); toggleSidebar()" class="w-full text-left p-3 bg-gray-800 rounded-lg font-bold"><i class="fas fa-boxes mr-2 text-blue-400"></i> Stock Management</button>
            <button onclick="openBroadcastModal(); toggleSidebar()" class="w-full text-left p-3 bg-gray-800 rounded-lg font-bold"><i class="fas fa-bullhorn mr-2 text-yellow-400"></i> Broadcast</button>
            <button onclick="openPaymentLogs(); toggleSidebar()" class="w-full text-left p-3 bg-gray-800 rounded-lg font-bold"><i class="fas fa-history mr-2 text-green-400"></i> Payment Logs (Proof)</button>
        </div>
    </div>
    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 z-90 hidden backdrop-blur-sm"></div>

    <div class="grid grid-cols-2 gap-4 mb-4">
        <div class="card p-3 flex flex-col justify-between relative overflow-hidden" onclick="openSalesAnalysis()">
            <div class="text-center z-10 relative">
                <p class="text-gray-400 text-xs uppercase tracking-wider">Sales Today</p>
                <h2 class="text-2xl font-bold text-green-400 mt-1">₹<span id="total-sales">0</span></h2>
                <button onclick="event.stopPropagation(); tryEndDay()" class="mt-2 w-full py-1 text-[10px] bg-red-500/10 text-red-400 rounded border border-red-500/20">RESET DAY</button>
            </div>
        </div>
        <div class="card p-3 text-center flex flex-col justify-center">
            <p class="text-gray-400 text-xs uppercase tracking-wider">Active</p>
            <h2 class="text-3xl font-bold text-yellow-400 my-1" id="pending-count">0</h2>
            <p class="text-[10px] text-gray-500" id="sound-status">Sound 🔇</p>
        </div>
    </div>

    <div class="flex mb-4 border-b border-gray-800">
        <button onclick="switchTab('live')" id="tab-live" class="flex-1 py-3 tab-active font-bold text-sm">LIVE</button>
        <button onclick="switchTab('history')" id="tab-history" class="flex-1 py-3 text-gray-500 font-bold text-sm">HISTORY</button>
        <button onclick="switchTab('udhaar')" id="tab-udhaar" class="flex-1 py-3 text-gray-500 font-bold text-sm">UDHAAR</button>
    </div>

    <div id="view-live" class="space-y-3 min-h-[50vh]"></div>
    <div id="view-history" class="hidden space-y-3"><div id="history-container" class="space-y-2"></div></div>
    <div id="view-udhaar" class="hidden space-y-3">
        <input type="text" id="search-udhaar" onkeyup="filterUdhaar()" placeholder="Search..." class="w-full p-2 bg-gray-800 rounded-lg border border-gray-700 text-sm mb-2 outline-none">
        <div id="udhaar-list" class="space-y-2"></div>
    </div>

    <div id="order-full-modal" class="fixed inset-0 bg-[#0f0f0f] z-[120] hidden overflow-y-auto">
        <div class="p-4 max-w-2xl mx-auto">
            <button onclick="closeFullModal()" class="mb-4 text-gray-400 flex items-center gap-2"><i class="fas fa-arrow-left"></i> Back</button>
            <div class="card p-5 border border-gray-700 rounded-xl relative">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <h1 class="text-2xl font-bold text-white" id="fm-name">Customer</h1>
                        <p class="text-sm text-gray-400" id="fm-phone">Phone</p>
                        <p class="text-xs text-blue-400 mt-1" id="fm-recipient"></p> </div>
                    <div class="text-right">
                        <span class="px-2 py-1 rounded text-xs font-bold uppercase" id="fm-status-badge">STATUS</span>
                        <p class="text-xs text-gray-500 mt-1" id="fm-time">Time</p>
                    </div>
                </div>
                
                <div class="grid grid-cols-3 gap-3 mb-6">
                    <a id="fm-btn-call" href="#" class="p-3 bg-gray-800 rounded text-center"><i class="fas fa-phone text-green-400"></i></a>
                    <a id="fm-btn-wa" href="#" class="p-3 bg-gray-800 rounded text-center"><i class="fab fa-whatsapp text-green-500"></i></a>
                    <a id="fm-btn-map" href="#" class="p-3 bg-gray-800 rounded text-center"><i class="fas fa-map-marker-alt text-blue-400"></i></a>
                </div>

                <div class="mb-4 bg-gray-800/50 p-3 rounded-lg">
                    <p class="text-xs text-gray-500 uppercase mb-2 font-bold">Items</p>
                    <div id="fm-items-list" class="space-y-2"></div>
                    <div class="flex justify-between items-center mt-4 pt-2 border-t border-gray-700">
                        <span class="font-bold text-white">Total Amount</span>
                        <span class="font-bold text-xl text-orange-500">₹<span id="fm-total">0</span></span>
                    </div>
                </div>

                <div id="fm-controls" class="space-y-3">
                    <p class="text-xs text-gray-500 uppercase font-bold">Update Status</p>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="updateStatus('pending')" class="p-2 bg-gray-800 rounded text-xs font-bold">Pending</button>
                        <button onclick="updateStatus('cooking')" class="p-2 bg-gray-800 rounded text-xs font-bold">Cooking</button>
                        <button onclick="updateStatus('ready')" class="p-2 bg-gray-800 rounded text-xs font-bold">Ready</button>
                    </div>
                    <button onclick="updateStatus('completed')" class="w-full py-3 bg-green-600 rounded font-bold text-white shadow-lg mt-2">Mark Completed</button>
                    
                    <div class="pt-4 mt-4 border-t border-gray-800 text-center">
                        <button onclick="deleteOrder()" class="text-red-500 text-xs font-bold flex items-center justify-center gap-2 mx-auto hover:bg-red-900/20 px-4 py-2 rounded"><i class="fas fa-trash"></i> Delete Order Permanently</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="logs-modal" class="fixed inset-0 bg-black/95 z-[110] hidden flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-700 w-full max-w-sm rounded-xl h-[80vh] flex flex-col p-4">
            <div class="flex justify-between items-center mb-4"><h3 class="font-bold text-white">Payment Logs</h3><button onclick="document.getElementById('logs-modal').classList.add('hidden')" class="text-gray-400"><i class="fas fa-times"></i></button></div>
            <div id="logs-list" class="overflow-y-auto flex-1 space-y-2"></div>
        </div>
    </div>

    <div id="menu-modal" class="hidden fixed inset-0 bg-black/90 z-[110] flex items-center justify-center p-4"><div class="bg-gray-900 p-6 rounded-xl w-full max-w-sm"><h3 class="font-bold mb-4">Stock</h3><div id="menu-list-items" class="max-h-60 overflow-y-auto mb-4"></div><div class="flex gap-2"><input id="new-item-name" placeholder="Name" class="bg-gray-800 p-2 rounded w-full text-xs"><input id="new-item-price" placeholder="Price" type="number" class="bg-gray-800 p-2 rounded w-20 text-xs"></div><button onclick="addNewItem()" class="w-full bg-orange-600 p-2 rounded mt-2 text-xs font-bold">Add</button><button onclick="saveMenuStatus()" class="w-full bg-green-600 p-3 rounded mt-4 font-bold">Save</button><button onclick="document.getElementById('menu-modal').classList.add('hidden')" class="w-full mt-2 text-gray-500 text-xs">Close</button></div></div>
    <div id="broadcast-modal" class="hidden fixed inset-0 bg-black/90 z-[110] flex items-center justify-center p-4"><div class="bg-gray-900 p-6 rounded-xl w-full max-w-sm"><h3 class="font-bold mb-2">Broadcast</h3><textarea id="broadcast-input" class="w-full bg-gray-800 p-3 rounded mb-4" rows="3"></textarea><div class="flex gap-2"><button onclick="saveBroadcast('')" class="flex-1 bg-red-900 text-red-200 p-2 rounded">Clear</button><button onclick="saveBroadcast(document.getElementById('broadcast-input').value)" class="flex-1 bg-orange-600 text-white p-2 rounded">Send</button></div><button onclick="document.getElementById('broadcast-modal').classList.add('hidden')" class="w-full mt-2 text-gray-500 text-xs">Close</button></div></div>
    <div id="settle-modal" class="hidden fixed inset-0 bg-black/90 z-[110] flex items-center justify-center p-4"><div class="bg-gray-900 p-6 rounded-xl w-full max-w-sm"><h3 class="font-bold">Settle</h3><p id="settle-name" class="text-gray-400 text-sm mb-2"></p><h1 class="text-3xl font-bold text-red-400 mb-4">₹<span id="settle-due">0</span></h1><input id="settle-amount" type="number" class="w-full bg-gray-800 p-3 rounded text-center text-xl font-bold mb-4" placeholder="Amount"><button onclick="submitPayment()" class="w-full bg-green-600 p-3 rounded font-bold">Settle</button><button onclick="document.getElementById('settle-modal').classList.add('hidden')" class="w-full mt-2 text-gray-500">Cancel</button></div></div>

    <div id="toast-container"></div>
    <audio id="order-sound"></audio>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyBadYpoNTL0dHkBQO4UddRVtPIfUOlf-bA", authDomain: "sgmc-16568.firebaseapp.com", projectId: "sgmc-16568", storageBucket: "sgmc-16568.firebasestorage.app", messagingSenderId: "339041646158", appId: "1:339041646158:web:85d9a50a3b51b30aae351f", measurementId: "G-4996NPF55N" };
        firebase.initializeApp(firebaseConfig); const db = firebase.firestore();

        let isShopOpen=true, soundEnabled=false, udhaarMap={}, currentMenuData={stock:{},customItems:[]}, currentOpenOrder=null;
        const baseItems = [{id:1,name:"Normal Chai",price:10},{id:2,name:"Adrak Chai",price:15},{id:3,name:"Cigarette",price:0},{id:4,name:"Matthi",price:5},{id:5,name:"Cream Roll",price:10},{id:6,name:"Biscuit",price:5},{id:7,name:"Namkeen",price:10}];

        function init() {
            db.collection('settings').doc('config').onSnapshot(d=>{ if(d.exists && d.data().lastReset) window.lastReset=d.data().lastReset.seconds; render(); });
            db.collection('settings').doc('status').onSnapshot(d=>{ isShopOpen=d.exists?d.data().isOpen:true; document.getElementById('shop-toggle-btn').innerText=isShopOpen?"OPEN":"CLOSED"; document.getElementById('shop-toggle-btn').className=isShopOpen?"px-3 py-1 rounded text-xs font-bold bg-green-600 text-white":"px-3 py-1 rounded text-xs font-bold bg-red-600 text-white"; });
            db.collection('settings').doc('menu_data').onSnapshot(d=>{ if(d.exists) currentMenuData=d.data(); });
            db.collection('orders').orderBy('timestamp','desc').onSnapshot(s=>{ window.ordersSnap=s; render(); });
            db.collection('payments').orderBy('timestamp','desc').onSnapshot(s=>{ window.paymentsSnap=s; render(); });
        }

        function toggleSidebar() { const sb=document.getElementById('sidebar'); const ol=document.getElementById('sidebar-overlay'); sb.classList.toggle('open'); ol.classList.toggle('hidden'); }
        function toggleTheme() { document.body.classList.toggle('light-mode'); const isLight=document.body.classList.contains('light-mode'); document.getElementById('theme-icon').className = isLight ? "fas fa-toggle-off text-gray-400" : "fas fa-toggle-on text-purple-500"; }
        
        function render() {
            if(!window.ordersSnap) return;
            let active=0, sales=0, liveHtml='', historyHtml=''; udhaarMap={};
            if(window.paymentsSnap) window.paymentsSnap.docs.forEach(d=>{ const p=d.data(); if(!udhaarMap[p.phone]) udhaarMap[p.phone]={name:"User",debit:0,credit:0}; udhaarMap[p.phone].credit+=p.amount; });

            window.ordersSnap.docs.forEach(doc=>{
                const d=doc.data(); const id=doc.id;
                if(d.paymentMode==='Udhaar' && d.status!=='cancelled') { if(!udhaarMap[d.customerPhone]) udhaarMap[d.customerPhone]={name:d.customerName,debit:0,credit:0}; udhaarMap[d.customerPhone].debit+=d.totalAmount; udhaarMap[d.customerPhone].name=d.customerName; }
                if(d.status==='completed' && d.timestamp && d.timestamp.seconds > (window.lastReset||0)) sales+=d.totalAmount;
                
                // LIVE
                if(['pending','cooking','ready'].includes(d.status)) {
                    active++;
                    liveHtml+=`<div class="card p-4 border-l-4 ${d.paymentMode==='Udhaar'?'border-red-500':'border-blue-500'}" onclick="openFullModal('${id}')">
                        <div class="flex justify-between"><div><h3 class="font-bold text-lg">${d.customerName}</h3><span class="text-xs bg-gray-700 px-2 rounded">${d.status}</span></div><h3 class="font-bold text-orange-400">₹${d.totalAmount}</h3></div>
                        ${d.recipient ? `<p class="text-xs text-blue-400 mt-1">Delivery For: ${d.recipient.name}</p>` : ''}
                    </div>`;
                } else {
                    // HISTORY
                    const date = d.timestamp ? new Date(d.timestamp.toDate()).toLocaleDateString() : '';
                    historyHtml+=`<div class="bg-gray-800 p-3 rounded mb-2 flex justify-between items-center cursor-pointer hover:bg-gray-700" onclick="openFullModal('${id}')">
                        <div><p class="font-bold text-sm">${d.customerName}</p><p class="text-xs text-gray-500">${date} • ${d.items.length} items</p></div>
                        <div class="text-right"><p class="font-bold ${d.status==='cancelled'?'text-red-500':'text-green-500'} text-xs uppercase">${d.status}</p><p class="font-bold">₹${d.totalAmount}</p></div>
                    </div>`;
                }
            });

            document.getElementById('view-live').innerHTML=liveHtml || "<p class='text-center opacity-50 mt-10'>No active orders</p>";
            document.getElementById('history-container').innerHTML=historyHtml;
            document.getElementById('pending-count').innerText=active;
            document.getElementById('total-sales').innerText=sales;
            renderUdhaar();
            if(active > (window.lastActive||0)) { const a=document.getElementById('order-sound'); if(soundEnabled){a.src="https://assets.mixkit.co/active_storage/sfx/2865/2865-preview.mp3"; a.play();} }
            window.lastActive=active;
        }

        // --- FULL MODAL LOGIC ---
        function openFullModal(id) {
            const doc = window.ordersSnap.docs.find(d=>d.id===id); if(!doc) return;
            const d = doc.data(); currentOpenOrder = {id, ...d};
            document.getElementById('fm-name').innerText = d.customerName;
            document.getElementById('fm-phone').innerText = d.customerPhone;
            document.getElementById('fm-time').innerText = d.timestamp ? new Date(d.timestamp.toDate()).toLocaleString() : '';
            document.getElementById('fm-status-badge').innerText = d.status;
            document.getElementById('fm-status-badge').className = `px-2 py-1 rounded text-xs font-bold uppercase ${d.status==='completed'?'bg-green-600':d.status==='cancelled'?'bg-red-600':'bg-yellow-600'}`;
            document.getElementById('fm-total').innerText = d.totalAmount;
            
            // Recipient Check
            if(d.recipient) {
                document.getElementById('fm-recipient').innerText = `For: ${d.recipient.name} (${d.recipient.phone})`;
            } else {
                document.getElementById('fm-recipient').innerText = '';
            }

            // Buttons
            document.getElementById('fm-btn-call').href = `tel:${d.recipient ? d.recipient.phone : d.customerPhone}`;
            let wa = (d.recipient ? d.recipient.phone : d.customerPhone).replace(/\D/g,''); if(wa.length===10) wa="91"+wa;
            document.getElementById('fm-btn-wa').href = `https://wa.me/${wa}`;
            if(d.customerCoordinates) document.getElementById('fm-btn-map').href=`https://www.google.com/maps/dir/?api=1&destination=${d.customerCoordinates.lat},${d.customerCoordinates.lng}`;

            // Items (with PNA check)
            document.getElementById('fm-items-list').innerHTML = d.items.map(i=> `
                <div class="flex justify-between border-b border-gray-700 pb-1">
                    <span class="${i.status==='pna'?'line-through text-red-400':''}">${i.qty} x ${i.name}</span>
                    <span>₹${i.qty*i.price}</span>
                </div>
            `).join('');

            // Controls Visibility
            const controls = document.getElementById('fm-controls');
            if(d.status === 'completed' || d.status === 'cancelled') {
                controls.innerHTML = `<button onclick="deleteOrder()" class="text-red-500 text-xs font-bold flex items-center justify-center gap-2 mx-auto hover:bg-red-900/20 px-4 py-2 rounded mt-4"><i class="fas fa-trash"></i> Delete Record</button>`;
            } else {
                controls.innerHTML = `<p class="text-xs text-gray-500 uppercase font-bold">Update Status</p>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="updateStatus('pending')" class="p-2 bg-gray-800 rounded text-xs font-bold">Pending</button>
                        <button onclick="updateStatus('cooking')" class="p-2 bg-gray-800 rounded text-xs font-bold">Cooking</button>
                        <button onclick="updateStatus('ready')" class="p-2 bg-gray-800 rounded text-xs font-bold">Ready</button>
                    </div>
                    <button onclick="updateStatus('completed')" class="w-full py-3 bg-green-600 rounded font-bold text-white shadow-lg mt-2">Mark Completed</button>
                    <button onclick="updateStatus('cancelled')" class="w-full py-2 bg-red-900/50 text-red-400 rounded text-xs font-bold mt-2">Cancel Order</button>`;
            }

            // Theme adjustment
            if(document.body.classList.contains('light-mode')) {
                document.getElementById('order-full-modal').style.backgroundColor = "#f3f4f6";
                document.querySelector('#order-full-modal .card').style.backgroundColor = "#ffffff";
                document.querySelector('#order-full-modal h1').style.color = "#111";
            } else {
                document.getElementById('order-full-modal').style.backgroundColor = "#0f0f0f";
                document.querySelector('#order-full-modal .card').style.backgroundColor = "#1f1f1f";
                document.querySelector('#order-full-modal h1').style.color = "#fff";
            }

            document.getElementById('order-full-modal').classList.remove('hidden');
        }

        function closeFullModal() { document.getElementById('order-full-modal').classList.add('hidden'); }
        function updateStatus(s) { if(!currentOpenOrder) return; db.collection('orders').doc(currentOpenOrder.id).update({status:s}).then(()=>{ closeFullModal(); }); }
        function deleteOrder() { if(confirm("Delete this order permanently? Cannot be undone.")) { db.collection('orders').doc(currentOpenOrder.id).delete().then(()=>{ closeFullModal(); }); } }

        // --- UDHAAR & LOGS ---
        function renderUdhaar() {
            const list = document.getElementById('udhaar-list'); const q = document.getElementById('search-udhaar').value.toLowerCase(); let html = '';
            for(let ph in udhaarMap) {
                const u = udhaarMap[ph]; const due = u.debit - u.credit;
                if(due > 0 && (u.name.toLowerCase().includes(q) || ph.includes(q))) {
                    html += `<div class="card p-3 flex justify-between items-center">
                        <div><p class="font-bold">${u.name}</p><p class="text-xs text-gray-500">${ph}</p></div>
                        <div class="text-right"><p class="text-red-400 font-bold">₹${due}</p><button onclick="openSettle('${ph}','${u.name}',${due})" class="bg-blue-600 px-2 py-1 rounded text-xs text-white mt-1">SETTLE</button></div>
                    </div>`;
                }
            }
            list.innerHTML = html || '<p class="text-center mt-4 text-gray-500">No Pending Udhaar</p>';
        }

        function openPaymentLogs() {
            const list = document.getElementById('logs-list');
            if(!window.paymentsSnap) { list.innerHTML = "No logs."; return; }
            list.innerHTML = window.paymentsSnap.docs.map(d=>{
                const p = d.data(); const date = p.timestamp ? new Date(p.timestamp.toDate()).toLocaleString() : '';
                return `<div class="bg-gray-800 p-2 rounded flex justify-between border border-gray-700">
                    <div><p class="text-xs text-gray-400">${date}</p><p class="text-sm font-bold text-white">${p.phone}</p></div>
                    <span class="text-green-400 font-bold">+₹${p.amount}</span>
                </div>`;
            }).join('');
            document.getElementById('logs-modal').classList.remove('hidden');
        }

        // --- UTILS ---
        function setShopLocation() { navigator.geolocation.getCurrentPosition(p=>{ db.collection('settings').doc('config').set({location:{lat:p.coords.latitude,lng:p.coords.longitude}},{merge:true}).then(()=>alert("Location Updated")); }); }
        function toggleShop() { db.collection('settings').doc('status').set({isOpen:!isShopOpen}); }
        function openMenuControl() { document.getElementById('menu-list-items').innerHTML = baseItems.map(i=>`<div class="flex justify-between p-2 border-b border-gray-700"><span>${i.name}</span><input type="checkbox" id="stock-${i.id}" checked></div>`).join(''); document.getElementById('menu-modal').classList.remove('hidden'); } // Simplified logic
        function saveMenuStatus() { alert("Stock Saved (Simulation)"); document.getElementById('menu-modal').classList.add('hidden'); }
        function openBroadcastModal() { document.getElementById('broadcast-modal').classList.remove('hidden'); }
        function saveBroadcast(m) { db.collection('settings').doc('config').set({broadcastMessage:m},{merge:true}); document.getElementById('broadcast-modal').classList.add('hidden'); }
        function openSettle(ph,n,d) { currentSettlePhone=ph; document.getElementById('settle-name').innerText=n; document.getElementById('settle-due').innerText=d; document.getElementById('settle-modal').classList.remove('hidden'); }
        function submitPayment() { const amt=parseInt(document.getElementById('settle-amount').value); if(amt) db.collection('payments').add({phone:currentSettlePhone,amount:amt,timestamp:firebase.firestore.FieldValue.serverTimestamp()}); document.getElementById('settle-modal').classList.add('hidden'); }
        function enableSound() { if(!soundEnabled) { soundEnabled=true; document.getElementById('sound-status').innerText="Sound 🔊"; } }
        function switchTab(t) { ['live','history','udhaar'].forEach(x=>{ document.getElementById('view-'+x).classList.add('hidden'); document.getElementById('tab-'+x).classList.remove('tab-active','text-white'); }); document.getElementById('view-'+t).classList.remove('hidden'); document.getElementById('tab-'+t).classList.add('tab-active','text-white'); }
        function filterUdhaar() { renderUdhaar(); }

        init();
    </script>
</body>
</html>
