<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SGMC – Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#c79081,#dfa579);
}
header{
  background:#4e342e;
  color:#fff;
  padding:14px;
  text-align:center;
  font-size:20px;
}
.card{
  background:#fff;
  margin:12px;
  padding:12px;
  border-radius:12px;
  box-shadow:0 4px 8px rgba(0,0,0,.2);
}
.status{
  font-size:13px;
  padding:4px 8px;
  border-radius:6px;
  display:inline-block;
  margin-bottom:6px;
}
.Placed{background:#ffeb3b}
.Preparing{background:#03a9f4;color:#fff}
.Ready{background:#4caf50;color:#fff}
.Delivered{background:#9e9e9e;color:#fff}
select,button{
  width:100%;
  padding:8px;
  margin-top:6px;
  border-radius:6px;
}
button{
  background:#4e342e;
  color:white;
  border:none;
}
</style>
</head>

<body>

<header>☕ SGMC Admin Panel</header>
<div id="orders"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBadYpoNTL0dHkBQO4UddRVtPIfUOlf-bA",
  authDomain: "sgmc-16568.firebaseapp.com",
  databaseURL: "https://sgmc-16568-default-rtdb.firebaseio.com",
  projectId: "sgmc-16568",
  storageBucket: "sgmc-16568.firebasestorage.app",
  messagingSenderId: "339041646158",
  appId: "1:339041646158:web:85d9a50a3b51b30aae351f"
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}

const db = firebase.database();
const ordersDiv = document.getElementById("orders");

db.ref("orders").on("value", snap => {
  ordersDiv.innerHTML = "";
  snap.forEach(child => {
    const o = child.val();
    const id = child.key;

    ordersDiv.innerHTML += `
      <div class="card">
        <div class="status ${o.status}">${o.status}</div><br>
        ☕ <b>Order</b><br>
        Total: ₹<b>${o.total}</b><br>
        Time: ${o.time}

        <select onchange="updateStatus('${id}',this.value)">
          <option ${o.status=="Placed"?"selected":""}>Placed</option>
          <option ${o.status=="Preparing"?"selected":""}>Preparing</option>
          <option ${o.status=="Ready"?"selected":""}>Ready</option>
          <option ${o.status=="Delivered"?"selected":""}>Delivered</option>
        </select>
      </div>
    `;
  });
});

function updateStatus(id,status){
  db.ref("orders/"+id+"/status").set(status);
}
</script>

</body>
</html>
