<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGMC Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0f0f0f; color: white; font-family: sans-serif; }
        .card { background: #1f1f1f; border-radius: 12px; border: 1px solid #333; }
        .tab-active { border-bottom: 2px solid #F97316; color: #F97316; }
    </style>
</head>
<body class="p-4 max-w-2xl mx-auto">

    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-orange-500">SGMC Admin</h1>
        <button id="shop-toggle-btn" onclick="toggleShop()" class="px-4 py-2 rounded text-sm font-bold bg-gray-700">Loading...</button>
    </div>

    <div class="grid grid-cols-2 gap-4 mb-6">
        <div class="card p-3 text-center">
            <p class="text-gray-400 text-xs">Total Sales Today</p>
            <h2 class="text-xl font-bold text-green-400">₹<span id="total-sales">0</span></h2>
        </div>
        <div class="card p-3 text-center">
            <p class="text-gray-400 text-xs">Active Orders</p>
            <h2 class="text-xl font-bold text-yellow-400" id="pending-count">0</h2>
        </div>
    </div>

    <div class="flex mb-4 border-b border-gray-700">
        <button onclick="switchTab('live')" id="tab-live" class="flex-1 py-3 tab-active font-bold">Live Orders</button>
        <button onclick="switchTab('history')" id="tab-history" class="flex-1 py-3 text-gray-400 font-bold">History</button>
        <button onclick="switchTab('udhaar')" id="tab-udhaar" class="flex-1 py-3 text-gray-400 font-bold">Udhaar</button>
    </div>

    <div id="view-live" class="space-y-4"></div>

    <div id="view-history" class="hidden space-y-4">
        <div id="history-list"></div>
    </div>

    <div id="view-udhaar" class="hidden space-y-4">
        <input type="text" id="search-udhaar" onkeyup="filterUdhaar()" placeholder="Search Name..." class="w-full p-2 bg-gray-800 rounded border border-gray-700 mb-2">
        <div id="udhaar-list"></div>
    </div>

    <div id="settle-modal" class="fixed inset-0 bg-black/90 hidden flex items-center justify-center p-4">
        <div class="bg-gray-800 p-6 rounded-xl w-full max-w-sm">
            <h3 class="text-xl font-bold mb-4">Settle Udhaar</h3>
            <p class="text-gray-400 text-sm mb-2" id="settle-name">Customer Name</p>
            <p class="text-2xl font-bold text-red-400 mb-4">Due: ₹<span id="settle-due">0</span></p>
            
            <label class="text-xs uppercase text-gray-500">Amount Received</label>
            <input type="number" id="settle-amount" class="w-full p-3 bg-gray-700 rounded text-white mb-4 border border-gray-600 focus:border-green-500 outline-none" placeholder="Enter amount">
            
            <button onclick="submitPayment()" class="w-full bg-green-600 text-white p-3 rounded font-bold mb-2">Mark as Paid</button>
            <button onclick="closeSettle()" class="w-full text-gray-400 p-2">Cancel</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBadYpoNTL0dHkBQO4UddRVtPIfUOlf-bA",
            authDomain: "sgmc-16568.firebaseapp.com",
            projectId: "sgmc-16568",
            storageBucket: "sgmc-16568.firebasestorage.app",
            messagingSenderId: "339041646158",
            appId: "1:339041646158:web:85d9a50a3b51b30aae351f",
            measurementId: "G-4996NPF55N"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let isShopOpen = false;
        let udhaarMap = {}; // Stores { phone: { name, debit, credit } }
        let currentSettlePhone = null;

        function init() {
            // 1. Settings
            db.collection('settings').doc('status').onSnapshot(doc => {
                isShopOpen = doc.exists ? doc.data().isOpen : true;
                const btn = document.getElementById('shop-toggle-btn');
                btn.innerText = isShopOpen ? "OPEN (Click to Close)" : "CLOSED (Click to Open)";
                btn.className = isShopOpen ? "px-4 py-2 rounded text-sm font-bold bg-green-600 text-white" : "px-4 py-2 rounded text-sm font-bold bg-red-600 text-white";
            });

            // 2. Fetch Payments (Credit)
            db.collection('payments').onSnapshot(snap => {
                // Reset credits in map
                for(let p in udhaarMap) udhaarMap[p].credit = 0;
                
                snap.docs.forEach(doc => {
                    const d = doc.data();
                    if(!udhaarMap[d.phone]) udhaarMap[d.phone] = { name: "Unknown", debit: 0, credit: 0 };
                    udhaarMap[d.phone].credit += d.amount;
                });
                renderUdhaar();
            });

            // 3. Fetch Orders (Debit & Live Status)
            db.collection('orders').orderBy('timestamp', 'desc').onSnapshot(snapshot => {
                const liveDiv = document.getElementById('view-live');
                const histDiv = document.getElementById('history-list');
                
                let liveHtml = '', histHtml = '', sales = 0, activeCount = 0;

                // Reset Debits
                for(let p in udhaarMap) udhaarMap[p].debit = 0;

                snapshot.docs.forEach(doc => {
                    const data = doc.data();
                    const id = doc.id;

                    // Calculate Udhaar (Debit)
                    if(data.paymentMode === 'Udhaar' && data.customerPhone) {
                        if(!udhaarMap[data.customerPhone]) udhaarMap[data.customerPhone] = { name: data.customerName, debit: 0, credit: 0 };
                        if(data.status !== 'cancelled') {
                            udhaarMap[data.customerPhone].debit += data.totalAmount;
                            udhaarMap[data.customerPhone].name = data.customerName; // Update name to latest
                        }
                    }

                    // Sales & Live View
                    if(data.status === 'completed' && data.paymentMode !== 'Udhaar') sales += data.totalAmount;

                    if(['pending', 'cooking', 'ready'].includes(data.status)) {
                        activeCount++;
                        const isUpiPending = (data.paymentMode === 'UPI' && !data.paymentVerified);
                        liveHtml += `
                        <div class="card p-4 border-l-4 ${data.paymentMode === 'Udhaar' ? 'border-red-500' : 'border-blue-500'}">
                            <div class="flex justify-between">
                                <h3 class="font-bold text-lg">${data.customerName} <span class="text-sm text-gray-400">(${data.paymentMode})</span></h3>
                                <h3 class="font-bold text-orange-400">₹${data.totalAmount}</h3>
                            </div>
                            <ul class="text-sm text-gray-300 mt-2 mb-3">${data.items.map(i => `<li>${i.qty} x ${i.name}</li>`).join('')}</ul>
                            ${isUpiPending ? `<div class="bg-yellow-900/50 text-yellow-200 text-xs p-2 rounded mb-2 flex justify-between items-center"><span>UPI Check Karo!</span><button onclick="verifyPayment('${id}')" class="bg-yellow-600 text-white px-2 py-1 rounded">Verify</button></div>` : ''}
                            <div class="flex gap-2 mt-2">
                                <select onchange="updateStatus('${id}', this.value)" class="bg-gray-700 text-white text-sm p-2 rounded border border-gray-600">
                                    <option value="pending" ${data.status === 'pending' ? 'selected' : ''}>Pending</option>
                                    <option value="cooking" ${data.status === 'cooking' ? 'selected' : ''}>Cooking</option>
                                    <option value="ready" ${data.status === 'ready' ? 'selected' : ''}>Ready</option>
                                </select>
                                <button onclick="markComplete('${id}')" class="bg-green-600 text-white px-4 py-2 rounded text-sm font-bold flex-1">Complete</button>
                                <button onclick="cancelOrder('${id}')" class="bg-red-900 text-red-200 px-3 py-2 rounded"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>`;
                    } else if (data.status === 'completed') {
                        if(histHtml.split('div').length < 60) {
                            histHtml += `<div class="bg-gray-800 p-3 rounded border border-gray-700 opacity-70 mb-2 flex justify-between"><span class="font-bold">${data.customerName}</span><span class="text-green-400">₹${data.totalAmount}</span></div>`;
                        }
                    }
                });

                document.getElementById('view-live').innerHTML = liveHtml || '<p class="text-center text-gray-500 mt-10">No orders.</p>';
                document.getElementById('history-list').innerHTML = histHtml;
                document.getElementById('total-sales').innerText = sales;
                document.getElementById('pending-count').innerText = activeCount;
                renderUdhaar();
            });
        }

        // --- UDHAAR LOGIC ---
        function renderUdhaar() {
            const list = document.getElementById('udhaar-list');
            const q = document.getElementById('search-udhaar').value.toLowerCase();
            
            let html = '';
            for(let phone in udhaarMap) {
                const u = udhaarMap[phone];
                const netDue = u.debit - u.credit;
                
                if(netDue > 0 && (u.name.toLowerCase().includes(q) || phone.includes(q))) {
                    html += `
                    <div class="card p-4 flex justify-between items-center mb-2">
                        <div>
                            <h4 class="font-bold text-lg">${u.name}</h4>
                            <p class="text-xs text-gray-400">${phone}</p>
                        </div>
                        <div class="text-right">
                            <h4 class="text-red-400 font-bold text-xl">₹${netDue}</h4>
                            <button onclick="openSettle('${phone}', '${u.name}', ${netDue})" class="bg-blue-600 text-white text-xs px-3 py-1 rounded mt-1">Settle / Edit</button>
                        </div>
                    </div>`;
                }
            }
            list.innerHTML = html || "<p class='text-center text-gray-500'>No Udhaar pending.</p>";
        }

        function openSettle(phone, name, due) {
            currentSettlePhone = phone;
            document.getElementById('settle-name').innerText = name + " (" + phone + ")";
            document.getElementById('settle-due').innerText = due;
            document.getElementById('settle-amount').value = due; // Default to full amount
            document.getElementById('settle-modal').classList.remove('hidden');
        }

        function closeSettle() { document.getElementById('settle-modal').classList.add('hidden'); }

        function submitPayment() {
            const amount = parseInt(document.getElementById('settle-amount').value);
            if(!amount || amount <= 0) return alert("Valid amount daalo");

            db.collection('payments').add({
                phone: currentSettlePhone,
                amount: amount,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                closeSettle();
                alert("Payment added!");
            });
        }

        // --- HELPERS ---
        function toggleShop() { db.collection('settings').doc('status').set({ isOpen: !isShopOpen }); }
        function updateStatus(id, st) { db.collection('orders').doc(id).update({ status: st }); }
        function markComplete(id) { if(confirm('Complete?')) db.collection('orders').doc(id).update({ status: 'completed' }); }
        function cancelOrder(id) { if(confirm('Cancel?')) db.collection('orders').doc(id).update({ status: 'cancelled' }); }
        function verifyPayment(id) { if(confirm('Money Received?')) db.collection('orders').doc(id).update({ paymentVerified: true }); }
        function switchTab(t) {
            ['live', 'history', 'udhaar'].forEach(x => {
                document.getElementById(`view-${x}`).classList.add('hidden');
                document.getElementById(`tab-${x}`).classList.remove('tab-active', 'text-white');
                document.getElementById(`tab-${x}`).classList.add('text-gray-400');
            });
            document.getElementById(`view-${t}`).classList.remove('hidden');
            document.getElementById(`tab-${t}`).classList.add('tab-active', 'text-white');
            document.getElementById(`tab-${t}`).classList.remove('text-gray-400');
        }
        function filterUdhaar() { renderUdhaar(); }

        init();
    </script>
</body>
</html>
