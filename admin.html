<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGMC - Admin Panel</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #1a1a1a; color: white; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 600px; margin: auto; }
        
        h1 { color: #f39c12; }
        
        /* Dashboard Stats */
        .stats { display: flex; justify-content: space-around; margin-bottom: 20px; }
        .stat-box { background: #333; padding: 15px; border-radius: 10px; width: 45%; }
        .stat-number { font-size: 24px; font-weight: bold; color: #f39c12; }

        /* Shop Toggle Switch */
        .switch-container { background: #333; padding: 20px; border-radius: 10px; margin-bottom: 30px; }
        .status-text { font-size: 18px; margin-bottom: 10px; display: block; }
        button#toggleBtn { padding: 10px 30px; font-size: 16px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; }
        .btn-open { background-color: #2ecc71; color: white; }
        .btn-closed { background-color: #e74c3c; color: white; }

        /* Order Cards */
        .order-card { background: #2c3e50; padding: 15px; margin-bottom: 15px; border-radius: 8px; text-align: left; border-left: 5px solid #f39c12; display: flex; justify-content: space-between; align-items: center; }
        .order-info { flex-grow: 1; }
        .customer-name { font-size: 18px; font-weight: bold; color: #ecf0f1; }
        .order-items { color: #bdc3c7; font-size: 14px; margin-top: 5px; }
        .payment-status { font-size: 12px; font-weight: bold; padding: 2px 6px; border-radius: 4px; margin-left: 10px; }
        
        .pay-udhaar { background: #e74c3c; color: white; }
        .pay-cash { background: #2ecc71; color: white; }

        /* Done Button */
        .done-btn { background-color: #27ae60; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; margin-left: 10px; }
        .done-btn:hover { background-color: #219150; }

    </style>
</head>
<body>

    <div class="container">
        <h1>🛠️ SGMC Admin</h1>
        
        <div class="switch-container">
            <span id="shopStatusText" class="status-text">Checking Status...</span>
            <button id="toggleBtn" onclick="toggleShop()">Loading...</button>
        </div>

        <div class="stats">
            <div class="stat-box">
                <div>Active Orders</div>
                <div class="stat-number" id="totalOrders">0</div>
            </div>
            <div class="stat-box">
                <div>Pending Udhaar</div>
                <div class="stat-number" id="udhaarCount">0</div>
            </div>
        </div>

        <h3 style="text-align: left; color: #aaa;">Recent Orders:</h3>
        <div id="adminOrderList">
            <p>Loading orders...</p>
        </div>
    </div>

    <script type="module">
        // 🔒 Simple Security Check
        const pass = prompt("Admin Password daalo:");
        if(pass !== "1234") {
            document.body.innerHTML = "<h1 style='color:red; text-align:center; margin-top:50px;'>Galat Password! Access Denied. ❌</h1>";
            throw new Error("Wrong Password");
        }

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc, setDoc, getDoc, query, orderBy } 
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBadYpoNTL0dHkBQO4UddRVtPIfUOlf-bA",
            authDomain: "sgmc-16568.firebaseapp.com",
            projectId: "sgmc-16568",
            storageBucket: "sgmc-16568.firebasestorage.app",
            messagingSenderId: "339041646158",
            appId: "1:339041646158:web:85d9a50a3b51b30aae351f",
            measurementId: "G-4996NPF55N"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- 1. SHOP STATUS LOGIC (Open/Close) ---
        const statusDocRef = doc(db, "shopSettings", "status");
        let currentStatus = true;

        // Listen to Shop Status
        onSnapshot(statusDocRef, (docSnap) => {
            const btn = document.getElementById("toggleBtn");
            const txt = document.getElementById("shopStatusText");

            if (docSnap.exists()) {
                currentStatus = docSnap.data().isOpen;
            } else {
                // Agar setting exist nahi karti to create kar do
                setDoc(statusDocRef, { isOpen: true });
                currentStatus = true;
            }

            if (currentStatus) {
                txt.innerText = "🟢 Dukan ABHI KHULI hai";
                btn.innerText = "Band Karein (Close)";
                btn.className = "btn-closed"; // Red button to close
            } else {
                txt.innerText = "🔴 Dukan ABHI BAND hai";
                btn.innerText = "Kholein (Open)";
                btn.className = "btn-open"; // Green button to open
            }
        });

        // Function to Toggle Status
        window.toggleShop = async function() {
            try {
                await updateDoc(statusDocRef, {
                    isOpen: !currentStatus
                });
            } catch (error) {
                console.error("Error updating status:", error);
                alert("Setting save nahi ho payi.");
            }
        }

        // --- 2. ORDER LIST LOGIC ---
        const q = query(collection(db, "orders"), orderBy("timestamp", "desc"));
        
        onSnapshot(q, (snapshot) => {
            const listDiv = document.getElementById("adminOrderList");
            const totalDiv = document.getElementById("totalOrders");
            const udhaarDiv = document.getElementById("udhaarCount");

            listDiv.innerHTML = "";
            
            let total = 0;
            let udhaar = 0;

            snapshot.forEach((doc) => {
                const order = doc.data();
                const orderId = doc.id;
                total++;
                
                const isUdhaar = order.payment.includes("Udhaar");
                if (isUdhaar) udhaar++;

                const badgeClass = isUdhaar ? "pay-udhaar" : "pay-cash";

                listDiv.innerHTML += `
                    <div class="order-card">
                        <div class="order-info">
                            <span class="customer-name">${order.customer}</span>
                            <span class="payment-status ${badgeClass}">${order.payment}</span>
                            <div class="order-items">🛒 ${order.items.join(", ")}</div>
                        </div>
                        <button class="done-btn" onclick="deleteOrder('${orderId}')">✅ Done</button>
                    </div>
                `;
            });

            totalDiv.innerText = total;
            udhaarDiv.innerText = udhaar;

            if(total === 0) {
                listDiv.innerHTML = "<p style='color:#777;'>Koi naya order nahi hai.</p>";
            }
        });

        // Function to Delete Order (Complete)
        window.deleteOrder = async function(id) {
            if(confirm("Kya ye order deliver ho gaya? List se hata dun?")) {
                await deleteDoc(doc(db, "orders", id));
            }
        }

    </script>
</body>
</html>
