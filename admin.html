<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGMC Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0f0f0f; color: white; font-family: sans-serif; }
        .card { background: #1f1f1f; border-radius: 12px; border: 1px solid #333; }
        .tab-active { border-bottom: 2px solid #F97316; color: #F97316; }
    </style>
</head>
<body class="p-4 max-w-2xl mx-auto">

    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-orange-500">SGMC Admin</h1>
        <div class="flex gap-2">
            <button onclick="openMenuControl()" class="px-3 py-2 rounded text-xs font-bold bg-blue-600 text-white">Stock</button>
            <button id="shop-toggle-btn" onclick="toggleShop()" class="px-3 py-2 rounded text-xs font-bold bg-gray-700">Loading...</button>
        </div>
    </div>

    <div class="grid grid-cols-2 gap-4 mb-4">
        <div class="card p-3 flex flex-col justify-between">
            <div class="text-center">
                <p class="text-gray-400 text-xs">Sales Today</p>
                <h2 class="text-xl font-bold text-green-400">₹<span id="total-sales">0</span></h2>
            </div>
            <button onclick="endDay()" class="mt-2 w-full py-1 text-xs bg-red-900 text-red-200 rounded border border-red-700 hover:bg-red-800">End Day</button>
        </div>
        <div class="card p-3 text-center flex flex-col justify-center">
            <p class="text-gray-400 text-xs">Active Orders</p>
            <h2 class="text-xl font-bold text-yellow-400" id="pending-count">0</h2>
        </div>
    </div>

    <div class="flex mb-4 border-b border-gray-700">
        <button onclick="switchTab('live')" id="tab-live" class="flex-1 py-3 tab-active font-bold">Live</button>
        <button onclick="switchTab('history')" id="tab-history" class="flex-1 py-3 text-gray-400 font-bold">History</button>
        <button onclick="switchTab('udhaar')" id="tab-udhaar" class="flex-1 py-3 text-gray-400 font-bold">Udhaar</button>
    </div>

    <div id="view-live" class="space-y-4"></div>
    <div id="view-history" class="hidden space-y-4">
        <div id="history-container" class="space-y-2"></div>
    </div>
    <div id="view-udhaar" class="hidden space-y-4">
        <input type="text" id="search-udhaar" onkeyup="filterUdhaar()" placeholder="Search Name..." class="w-full p-2 bg-gray-800 rounded border border-gray-700 mb-2">
        <div id="udhaar-list"></div>
    </div>

    <div id="menu-modal" class="fixed inset-0 bg-black/90 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-gray-800 p-6 rounded-xl w-full max-w-sm max-h-[80vh] overflow-y-auto">
            <h3 class="text-xl font-bold mb-4">Stock</h3>
            <div id="menu-list-items" class="space-y-3"></div>
            <button onclick="saveMenuStatus()" class="w-full bg-green-600 text-white p-3 rounded font-bold mt-4">Save</button>
            <button onclick="document.getElementById('menu-modal').classList.add('hidden')" class="w-full text-gray-400 p-2">Cancel</button>
        </div>
    </div>

    <div id="settle-modal" class="fixed inset-0 bg-black/90 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-gray-800 p-6 rounded-xl w-full max-w-sm">
            <h3 class="text-xl font-bold mb-4">Settle Payment</h3>
            <p class="text-gray-400 text-sm mb-2" id="settle-name"></p>
            <p class="text-2xl font-bold text-red-400 mb-4">Due: ₹<span id="settle-due">0</span></p>
            <input type="number" id="settle-amount" class="w-full p-3 bg-gray-700 rounded text-white mb-4 border border-gray-600 outline-none" placeholder="Amount Recieved">
            <button onclick="submitPayment()" class="w-full bg-green-600 text-white p-3 rounded font-bold mb-2">Settle</button>
            <button onclick="closeSettle()" class="w-full text-gray-400 p-2">Cancel</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBadYpoNTL0dHkBQO4UddRVtPIfUOlf-bA",
            authDomain: "sgmc-16568.firebaseapp.com",
            projectId: "sgmc-16568",
            storageBucket: "sgmc-16568.firebasestorage.app",
            messagingSenderId: "339041646158",
            appId: "1:339041646158:web:85d9a50a3b51b30aae351f",
            measurementId: "G-4996NPF55N"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const adminMenuItems = [ { id: 1, name: "Normal Chai" }, { id: 2, name: "Adrak Chai" }, { id: 3, name: "Cigarette" }, { id: 4, name: "Matthi" }, { id: 5, name: "Veg Roll" }, { id: 6, name: "Biscuit" }, { id: 7, name: "Namkeen" } ];

        let isShopOpen = false;
        let udhaarMap = {}; // { phone: {name, debit, credit} }
        let currentSettlePhone = null; 
        let allHistoryOrders = [];
        let lastResetSeconds = 0;

        function init() {
            // Config
            db.collection('settings').doc('config').onSnapshot(doc => {
                if(doc.exists && doc.data().lastReset) lastResetSeconds = doc.data().lastReset.seconds;
                recalculateData();
            });
            // Shop Status
            db.collection('settings').doc('status').onSnapshot(doc => {
                isShopOpen = doc.exists ? doc.data().isOpen : true;
                const btn = document.getElementById('shop-toggle-btn');
                btn.innerText = isShopOpen ? "OPEN" : "CLOSED";
                btn.className = isShopOpen ? "px-3 py-2 rounded text-xs font-bold bg-green-600 text-white" : "px-3 py-2 rounded text-xs font-bold bg-red-600 text-white";
            });
            // Payments Listener
            db.collection('payments').onSnapshot(snap => {
                window.paymentsSnapshot = snap;
                recalculateData();
            });
            // Orders Listener
            db.collection('orders').orderBy('timestamp', 'desc').onSnapshot(snap => {
                window.ordersSnapshot = snap;
                recalculateData();
            });
        }

        // --- CORE LOGIC: Recalculate everything when either Orders or Payments change ---
        function recalculateData() {
            if(!window.ordersSnapshot) return;
            
            // 1. Reset Data Maps
            udhaarMap = {};
            allHistoryOrders = [];
            let liveHtml = '', sales = 0, activeCount = 0;

            // 2. Process Payments First (Build Credit Map)
            if(window.paymentsSnapshot) {
                window.paymentsSnapshot.docs.forEach(doc => {
                    const d = doc.data();
                    if(!udhaarMap[d.phone]) udhaarMap[d.phone] = { name: "Unknown", debit: 0, credit: 0 };
                    udhaarMap[d.phone].credit += d.amount;
                });
            }

            // 3. Process Orders
            window.ordersSnapshot.docs.forEach(doc => {
                const data = doc.data(); const id = doc.id;
                const orderTime = data.timestamp ? data.timestamp.seconds : 0;

                // For History
                if(data.status === 'completed' || data.status === 'cancelled') allHistoryOrders.push({id, ...data});

                // Udhaar Logic (Debit)
                if(data.paymentMode === 'Udhaar' && data.customerPhone) {
                    if(!udhaarMap[data.customerPhone]) udhaarMap[data.customerPhone] = { name: data.customerName, debit: 0, credit: 0 };
                    if(data.status !== 'cancelled') {
                        udhaarMap[data.customerPhone].debit += data.totalAmount;
                        udhaarMap[data.customerPhone].name = data.customerName; // Update name
                    }
                }

                // Sales Counter (Reset Logic)
                if(orderTime > lastResetSeconds) {
                    if(data.status === 'completed' && data.paymentMode !== 'Udhaar') sales += data.totalAmount;
                }

                // Live Orders
                const isActive = ['pending', 'cooking', 'ready'].includes(data.status);
                if(isActive) {
                    activeCount++;
                    const isUpiPending = (data.paymentMode === 'UPI' && !data.paymentVerified);
                    liveHtml += `
                    <div class="card p-4 border-l-4 ${data.paymentMode === 'Udhaar' ? 'border-red-500' : 'border-blue-500'}">
                        <div class="flex justify-between"><h3 class="font-bold text-lg">${data.customerName} <span class="text-sm text-gray-400">(${data.paymentMode})</span></h3><h3 class="font-bold text-orange-400">₹${data.totalAmount}</h3></div>
                        <ul class="text-sm text-gray-300 mt-2 mb-3">${data.items.map(i => `<li>${i.qty} x ${i.name}</li>`).join('')}</ul>
                        ${isUpiPending ? `<div class="bg-yellow-900/50 text-yellow-200 text-xs p-2 rounded mb-2 flex justify-between items-center"><span>UPI Check!</span><button onclick="verifyPayment('${id}')" class="bg-yellow-600 text-white px-2 py-1 rounded">Verify</button></div>` : ''}
                        <div class="flex gap-2 mt-2">
                            <select onchange="updateStatus('${id}', this.value)" class="bg-gray-700 text-white text-sm p-2 rounded border border-gray-600">
                                <option value="pending" ${data.status === 'pending' ? 'selected' : ''}>Pending</option><option value="cooking" ${data.status === 'cooking' ? 'selected' : ''}>Cooking</option><option value="ready" ${data.status === 'ready' ? 'selected' : ''}>Ready</option>
                            </select>
                            <button onclick="markComplete('${id}')" class="bg-green-600 text-white px-4 py-2 rounded text-sm font-bold flex-1">Complete</button>
                            <button onclick="cancelOrder('${id}')" class="bg-red-900 text-red-200 px-3 py-2 rounded"><i class="fas fa-trash"></i></button>
                        </div></div>`;
                }
            });

            // Update UI
            document.getElementById('view-live').innerHTML = liveHtml || '<p class="text-center text-gray-500 mt-10">No active orders.</p>';
            document.getElementById('total-sales').innerText = sales;
            document.getElementById('pending-count').innerText = activeCount;
            renderUdhaar();
            if(!document.getElementById('view-history').classList.contains('hidden')) renderHistory();
        }

        // --- RENDERERS ---
        function renderUdhaar() {
            const list = document.getElementById('udhaar-list'); 
            const q = document.getElementById('search-udhaar').value.toLowerCase(); 
            let html = '';
            
            for(let phone in udhaarMap) {
                const u = udhaarMap[phone]; 
                const netDue = u.debit - u.credit; // MATH FIX HERE
                
                if(netDue > 0 && (u.name.toLowerCase().includes(q) || phone.includes(q))) {
                    html += `
                    <div class="card p-4 flex justify-between items-center mb-2">
                        <div><h4 class="font-bold text-lg">${u.name}</h4><p class="text-xs text-gray-400">${phone}</p></div>
                        <div class="text-right">
                            <h4 class="text-red-400 font-bold text-xl">₹${netDue}</h4>
                            <button onclick="openSettle('${phone}', '${u.name}', ${netDue})" class="bg-blue-600 text-white text-xs px-3 py-1 rounded mt-1">Settle</button>
                        </div>
                    </div>`;
                }
            }
            list.innerHTML = html || "<p class='text-center text-gray-500'>No Udhaar pending.</p>";
        }

        function renderHistory() {
            const container = document.getElementById('history-container');
            let groups = {}; 
            allHistoryOrders.forEach(o => { 
                const k = o.customerPhone||"Unknown"; 
                if(!groups[k]) groups[k]={name:o.customerName,orders:[]}; 
                groups[k].orders.push(o); 
            });
            if(Object.keys(groups).length===0) { container.innerHTML="<p class='text-center text-gray-500'>No history.</p>"; return; }
            
            container.innerHTML = Object.keys(groups).map(p => {
                const g = groups[p]; 
                const t = g.orders.reduce((s,o) => s+(o.status==='completed'?o.totalAmount:0),0);
                return `
                <div class="card overflow-hidden">
                    <div onclick="this.nextElementSibling.classList.toggle('hidden')" class="p-4 bg-gray-800 flex justify-between items-center cursor-pointer hover:bg-gray-700">
                        <div><h3 class="font-bold text-white">${g.name}</h3><p class="text-xs text-gray-400">${p}</p></div>
                        <div class="text-right"><p class="text-orange-400 font-bold">Total: ₹${t}</p><p class="text-xs text-gray-500">${g.orders.length} orders</p></div>
                    </div>
                    <div class="hidden bg-gray-900 p-2 space-y-2 border-t border-gray-700">
                        ${g.orders.map(o => {
                            const dateObj = o.timestamp ? new Date(o.timestamp.toDate()) : new Date();
                            const dateStr = dateObj.toLocaleDateString() + ' ' + dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}); // TIME ADDED
                            return `<div class="flex justify-between items-center bg-gray-800 p-2 rounded text-sm">
                                <div><span class="text-gray-300 text-xs">${dateStr}</span> <span class="ml-2 font-bold ${o.status==='completed'?'text-green-400':'text-red-400'}">${o.status}</span><p class="text-xs text-gray-500">${o.items.map(i=>i.name).join(', ')}</p></div>
                                <div class="font-bold text-white">₹${o.totalAmount}</div>
                            </div>`;
                        }).join('')}
                    </div>
                </div>`;
            }).join('');
        }

        // --- ACTIONS ---
        function openSettle(phone, name, due) { currentSettlePhone = phone; document.getElementById('settle-name').innerText = name + " (" + phone + ")"; document.getElementById('settle-due').innerText = due; document.getElementById('settle-amount').value = ""; document.getElementById('settle-modal').classList.remove('hidden'); }
        function closeSettle() { document.getElementById('settle-modal').classList.add('hidden'); }
        function submitPayment() { 
            const amount = parseInt(document.getElementById('settle-amount').value); 
            if(!amount) return; 
            db.collection('payments').add({ phone: currentSettlePhone, amount: amount, timestamp: firebase.firestore.FieldValue.serverTimestamp(), mode: 'Manual_Admin' }).then(() => { closeSettle(); alert("Updated!"); }); 
        }
        
        function endDay() { if(confirm("Reset Counter?")) db.collection('settings').doc('config').set({ lastReset: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true }); }
        
        function openMenuControl() { db.collection('settings').doc('menu').get().then(doc => { const s = doc.exists ? doc.data() : {}; document.getElementById('menu-list-items').innerHTML = adminMenuItems.map(i => `<div class="flex justify-between items-center bg-gray-700 p-3 rounded"><span>${i.name}</span><input type="checkbox" id="stock-${i.id}" ${s[i.id]!==false?'checked':''} class="w-5 h-5 accent-green-500"></div>`).join(''); document.getElementById('menu-modal').classList.remove('hidden'); }); }
        function saveMenuStatus() { const u = {}; adminMenuItems.forEach(i => u[i.id] = document.getElementById(`stock-${i.id}`).checked); db.collection('settings').doc('menu').set(u).then(() => document.getElementById('menu-modal').classList.add('hidden')); }

        function toggleShop() { db.collection('settings').doc('status').set({ isOpen: !isShopOpen }); }
        function updateStatus(id, st) { db.collection('orders').doc(id).update({ status: st }); }
        function markComplete(id) { if(confirm('Complete?')) db.collection('orders').doc(id).update({ status: 'completed' }); }
        function cancelOrder(id) { if(confirm('Cancel?')) db.collection('orders').doc(id).update({ status: 'cancelled' }); }
        function verifyPayment(id) { if(confirm('Received?')) db.collection('orders').doc(id).update({ paymentVerified: true }); }
        function switchTab(t) { ['live', 'history', 'udhaar'].forEach(x => { document.getElementById(`view-${x}`).classList.add('hidden'); document.getElementById(`tab-${x}`).classList.remove('tab-active', 'text-white'); document.getElementById(`tab-${x}`).classList.add('text-gray-400'); }); document.getElementById(`view-${t}`).classList.remove('hidden'); document.getElementById(`tab-${t}`).classList.add('tab-active', 'text-white'); document.getElementById(`tab-${t}`).classList.remove('text-gray-400'); if(t==='history') renderHistory(); }
        function filterUdhaar() { renderUdhaar(); }

        init();
    </script>
</body>
</html>
