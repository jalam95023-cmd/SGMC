<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGMC Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #0f0f0f; color: white; font-family: sans-serif; }
        .card { background: #1f1f1f; border-radius: 12px; border: 1px solid #333; }
        .status-open { background-color: #10B981; }
        .status-closed { background-color: #EF4444; }
        .tab-active { border-bottom: 2px solid #F97316; color: #F97316; }
    </style>
</head>
<body class="p-4 max-w-2xl mx-auto">

    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-orange-500">SGMC Admin</h1>
        <button id="shop-toggle-btn" onclick="toggleShop()" class="px-6 py-2 rounded-full font-bold text-white shadow-lg transition-all">
            Loading...
        </button>
    </div>

    <div class="grid grid-cols-2 gap-4 mb-6">
        <div class="card p-4 text-center">
            <p class="text-gray-400 text-xs uppercase">Today's Sales (Paid)</p>
            <h2 class="text-2xl font-bold text-green-400">₹<span id="total-sales">0</span></h2>
        </div>
        <div class="card p-4 text-center">
            <p class="text-gray-400 text-xs uppercase">Pending Orders</p>
            <h2 class="text-2xl font-bold text-yellow-400" id="pending-count">0</h2>
        </div>
    </div>

    <div class="flex mb-4 border-b border-gray-700">
        <button onclick="switchTab('orders')" id="tab-orders" class="flex-1 py-3 text-center tab-active font-bold">New Orders</button>
        <button onclick="switchTab('udhaar')" id="tab-udhaar" class="flex-1 py-3 text-center text-gray-400 font-bold">Udhaar Khata</button>
    </div>

    <div id="view-orders" class="space-y-4">
        <p class="text-center text-gray-500 mt-10">Checking for orders...</p>
    </div>

    <div id="view-udhaar" class="hidden space-y-4">
        <input type="text" id="search-udhaar" onkeyup="filterUdhaar()" placeholder="Search Name or Number..." class="w-full p-3 bg-gray-800 rounded-lg text-white border border-gray-700 mb-2">
        <div id="udhaar-list" class="space-y-3">
            </div>
    </div>

    <script>
        // *** FIREBASE KEYS ***
        const firebaseConfig = {
            apiKey: "AIzaSyBadYpoNTL0dHkBQO4UddRVtPIfUOlf-bA",
            authDomain: "sgmc-16568.firebaseapp.com",
            projectId: "sgmc-16568",
            storageBucket: "sgmc-16568.firebasestorage.app",
            messagingSenderId: "339041646158",
            appId: "1:339041646158:web:85d9a50a3b51b30aae351f",
            measurementId: "G-4996NPF55N"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let isShopOpen = false;
        let udhaarData = [];

        function init() {
            // 1. Listen to Shop Status
            db.collection('settings').doc('status').onSnapshot(doc => {
                if(doc.exists) {
                    isShopOpen = doc.data().isOpen;
                    updateShopBtn();
                } else {
                    db.collection('settings').doc('status').set({isOpen: true});
                }
            });

            // 2. Listen to Orders & Calculate Udhaar
            db.collection('orders').orderBy('timestamp', 'desc').onSnapshot(snapshot => {
                const ordersDiv = document.getElementById('view-orders');
                
                let html = '';
                let sales = 0;
                let pending = 0;
                let tempUdhaarMap = {}; 

                snapshot.docs.forEach(doc => {
                    const data = doc.data();
                    const id = doc.id;

                    // Calculate Udhaar (Based on Phone Number)
                    if(data.paymentMode === 'Udhaar' && data.customerPhone) {
                        const phone = data.customerPhone;
                        if(!tempUdhaarMap[phone]) {
                            tempUdhaarMap[phone] = { name: data.customerName, total: 0, orders: 0 };
                        }
                        // Assuming Udhaar orders are unpaid debts
                        tempUdhaarMap[phone].total += data.totalAmount;
                        tempUdhaarMap[phone].orders += 1;
                    }

                    // Calculate Sales (Only Completed & Paid via Cash/UPI)
                    if(data.status === 'completed' && data.paymentMode !== 'Udhaar') {
                        sales += data.totalAmount;
                    }

                    // Show Pending Orders
                    if(data.status === 'pending') {
                        pending++;
                        const isUdhaar = data.paymentMode === 'Udhaar';
                        html += `
                        <div class="card p-4 border-l-4 ${isUdhaar ? 'border-red-500' : 'border-green-500'}">
                            <div class="flex justify-between items-start">
                                <div>
                                    <h3 class="font-bold text-lg">${data.customerName}</h3>
                                    <p class="text-xs text-gray-400 mb-2">${new Date(data.timestamp.toDate()).toLocaleTimeString()} • ${data.paymentMode}</p>
                                    <ul class="text-sm space-y-1 mb-3 text-gray-300">
                                        ${data.items.map(i => `<li>• ${i.qty} x ${i.name}</li>`).join('')}
                                    </ul>
                                    <h4 class="font-bold text-orange-400 text-lg">Total: ₹${data.totalAmount}</h4>
                                </div>
                                <div class="flex flex-col space-y-2">
                                    <a href="tel:${data.customerPhone}" class="bg-blue-600 text-white w-10 h-10 flex items-center justify-center rounded-lg"><i class="fas fa-phone"></i></a>
                                    <button onclick="markComplete('${id}')" class="bg-green-600 text-white px-4 py-2 rounded-lg font-bold text-sm">Done</button>
                                </div>
                            </div>
                        </div>`;
                    }
                });

                document.getElementById('view-orders').innerHTML = html || '<p class="text-center text-gray-500 mt-10">Abhi koi order nahi hai.</p>';
                document.getElementById('total-sales').innerText = sales;
                document.getElementById('pending-count').innerText = pending;

                // Prepare Udhaar List
                udhaarData = Object.entries(tempUdhaarMap).map(([phone, info]) => ({phone, ...info}));
                renderUdhaarList(udhaarData);
            });
        }

        function toggleShop() {
            db.collection('settings').doc('status').set({ isOpen: !isShopOpen });
        }

        function updateShopBtn() {
            const btn = document.getElementById('shop-toggle-btn');
            if(isShopOpen) {
                btn.innerText = "DUKAN KHULI HAI";
                btn.className = "px-6 py-2 rounded-full font-bold text-white shadow-lg transition-all status-open";
            } else {
                btn.innerText = "DUKAN BAND HAI";
                btn.className = "px-6 py-2 rounded-full font-bold text-white shadow-lg transition-all status-closed";
            }
        }

        function markComplete(id) {
            if(confirm("Order complete ho gaya?")) {
                db.collection('orders').doc(id).update({ status: 'completed' });
            }
        }

        function switchTab(tab) {
            if(tab === 'orders') {
                document.getElementById('view-orders').classList.remove('hidden');
                document.getElementById('view-udhaar').classList.add('hidden');
                document.getElementById('tab-orders').className = "flex-1 py-3 text-center tab-active font-bold";
                document.getElementById('tab-udhaar').className = "flex-1 py-3 text-center text-gray-400 font-bold";
            } else {
                document.getElementById('view-orders').classList.add('hidden');
                document.getElementById('view-udhaar').classList.remove('hidden');
                document.getElementById('tab-udhaar').className = "flex-1 py-3 text-center tab-active font-bold";
                document.getElementById('tab-orders').className = "flex-1 py-3 text-center text-gray-400 font-bold";
            }
        }

        function renderUdhaarList(list) {
            const container = document.getElementById('udhaar-list');
            if(list.length === 0) {
                container.innerHTML = "<p class='text-center text-gray-500'>Koi udhaar nahi hai.</p>";
                return;
            }
            container.innerHTML = list.map(u => `
                <div class="card p-4 flex justify-between items-center">
                    <div>
                        <h3 class="font-bold text-lg">${u.name}</h3>
                        <p class="text-xs text-gray-400 font-mono">${u.phone}</p>
                        <p class="text-xs text-gray-500">${u.orders} orders pending</p>
                    </div>
                    <div class="text-right">
                        <h3 class="font-bold text-red-400 text-xl">₹${u.total}</h3>
                        <a href="tel:${u.phone}" class="text-blue-400 text-xs mt-1 block"><i class="fas fa-phone"></i> Call</a>
                    </div>
                </div>
            `).join('');
        }

        function filterUdhaar() {
            const q = document.getElementById('search-udhaar').value.toLowerCase();
            const filtered = udhaarData.filter(u => u.name.toLowerCase().includes(q) || u.phone.includes(q));
            renderUdhaarList(filtered);
        }

        init();
    </script>
</body>
</html>
