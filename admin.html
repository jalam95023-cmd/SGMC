<div id="orders"></div>

<script>
firebase.initializeApp({
 apiKey:"AIzaSyCcUPgsZYqNZyZAUwOhBYpn5_tWeDuRrUg",

 projectId:"sgmc-chai-app"
});
const db=firebase.firestore();

db.collection("orders")
.orderBy("createdAt","desc")
.onSnapshot(snap=>{
 orders.innerHTML="";
 snap.forEach(doc=>{
  const o=doc.data();
  orders.innerHTML+=`
   <div class="order">
    <b>${o.name}</b><br>
    ₹${o.total} – ${o.status}<br>
    ${o.address}
    <div id="map_${doc.id}" style="height:200px"></div>
    <button onclick="update('${doc.id}','ACCEPTED')">Accept</button>
    <button onclick="update('${doc.id}','ONTHEWAY')">On the way</button>
    <button onclick="update('${doc.id}','DELIVERED')">Delivered</button>
   </div>`;
  setTimeout(()=>showMap(doc.id,o.lat,o.lng),200);
 });
});

function update(id,s){
 db.collection("orders").doc(id).update({status:s});
}

</script>
