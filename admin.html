<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SGMC – Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#a18cd1,#fbc2eb);
}
header{
  background:#311b92;
  color:white;
  padding:16px;
  text-align:center;
  font-size:22px;
}
.card{
  background:white;
  margin:14px;
  padding:14px;
  border-radius:14px;
  box-shadow:0 6px 12px rgba(0,0,0,.2);
}
.status{
  font-size:13px;
  padding:4px 10px;
  border-radius:8px;
  display:inline-block;
}
.Placed{background:#ffeb3b}
.Preparing{background:#03a9f4;color:white}
.Ready{background:#4caf50;color:white}
.Delivered{background:#9e9e9e;color:white}
select{
  width:100%;
  padding:8px;
  margin-top:8px;
}
</style>
</head>

<body>

<header>🛠️ SGMC Admin Panel</header>
<div id="orders"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBadYpoNTL0dHkBQO4UddRVtPIfUOlf-bA",
  authDomain: "sgmc-16568.firebaseapp.com",
  databaseURL: "https://sgmc-16568-default-rtdb.firebaseio.com",
  projectId: "sgmc-16568",
  storageBucket: "sgmc-16568.firebasestorage.app",
  messagingSenderId: "339041646158",
  appId: "1:339041646158:web:85d9a50a3b51b30aae351f"
};

if(!firebase.apps.length){
  firebase.initializeApp(firebaseConfig);
}
const db = firebase.database();
const ordersDiv = document.getElementById("orders");

db.ref("orders").on("child_added", snap=>{
  const o = snap.val();
  const id = snap.key;

  const div = document.createElement("div");
  div.className = "card";
  div.innerHTML = `
    <div class="status ${o.status}">${o.status}</div>
    <p>🕒 ${o.time}</p>
    <p>☕ Chai: ${o.chai}, Adrak: ${o.adrak}, Masala: ${o.masala}</p>
    <p>🍪 Biscuit: ${o.biscuit}, Bun: ${o.bun}</p>
    <h3>Total ₹${o.total}</h3>

    <select onchange="updateStatus('${id}', this.value)">
      <option ${o.status=="Placed"?"selected":""}>Placed</option>
      <option ${o.status=="Preparing"?"selected":""}>Preparing</option>
      <option ${o.status=="Ready"?"selected":""}>Ready</option>
      <option ${o.status=="Delivered"?"selected":""}>Delivered</option>
    </select>
  `;
  ordersDiv.prepend(div);
});

function updateStatus(id,status){
  db.ref("orders/"+id+"/status").set(status);
}
</script>

</body>
</html>
