<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGMC Admin</title>
    <link rel="manifest" href="admin_manifest.json">
    <meta name="theme-color" content="#0f0f0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0f0f0f; color: white; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        .card { background: #1f1f1f; border-radius: 12px; border: 1px solid #333; }
        .tab-active { border-bottom: 2px solid #F97316; color: #F97316; }
        
        /* Modal & Animations */
        #custom-confirm, #manage-modal { backdrop-filter: blur(5px); }
        .modal-content { transform: scale(0.95); transition: transform 0.2s ease-out; }
        .modal-content.open { transform: scale(1); }
        
        /* Toast */
        #toast-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 100; pointer-events: none; }
        .toast { background: rgba(30,30,30,0.95); border: 1px solid #333; padding: 10px 20px; border-radius: 50px; color: white; opacity: 0; transition: all 0.3s; margin-top: 5px; }
        .toast.show { opacity: 1; transform: translateY(-10px); }

        /* Custom Status Select */
        .status-btn { padding: 6px 12px; border-radius: 8px; font-size: 10px; font-weight: bold; text-transform: uppercase; cursor: pointer; border: 1px solid transparent; }
        .status-pending { background: #333; color: #ccc; border-color: #555; }
        .status-cooking { background: #ea580c; color: white; border-color: #c2410c; }
        .status-ready { background: #16a34a; color: white; border-color: #15803d; }
    </style>
</head>
<body class="p-4 max-w-2xl mx-auto pb-24" onclick="enableSound()">

    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-orange-500">SGMC Admin</h1>
        <div class="flex gap-2">
            <button onclick="setShopLocation()" id="loc-btn" class="w-9 h-9 rounded bg-gray-800 text-blue-400 border border-gray-600 flex items-center justify-center shadow"><i class="fas fa-map-marker-alt"></i></button>
            <button onclick="openMenuControl()" class="px-3 py-2 rounded text-xs font-bold bg-blue-600 text-white shadow-lg">Stock</button>
            <button id="shop-toggle-btn" onclick="toggleShop()" class="px-3 py-2 rounded text-xs font-bold bg-gray-700 shadow-lg">Loading...</button>
        </div>
    </div>

    <div class="grid grid-cols-2 gap-4 mb-4">
        <div class="card p-3 text-center">
            <p class="text-gray-400 text-xs uppercase">Sales Today</p>
            <h2 class="text-2xl font-bold text-green-400 mt-1">₹<span id="total-sales">0</span></h2>
            <button onclick="confirmAction('Reset Sales?', endDay)" class="mt-2 text-[10px] bg-red-900/30 text-red-400 px-3 py-1 rounded border border-red-900/50">RESET DAY</button>
        </div>
        <div class="card p-3 text-center" onclick="toggleMute()">
            <p class="text-gray-400 text-xs uppercase">Active Orders</p>
            <h2 class="text-3xl font-bold text-yellow-400 my-1" id="pending-count">0</h2>
            <p class="text-[10px] text-gray-500" id="sound-status">Tap to Unmute 🔇</p>
        </div>
    </div>

    <div class="flex mb-4 border-b border-gray-800">
        <button onclick="switchTab('live')" id="tab-live" class="flex-1 py-3 tab-active font-bold text-sm">LIVE</button>
        <button onclick="switchTab('history')" id="tab-history" class="flex-1 py-3 text-gray-500 font-bold text-sm">HISTORY</button>
        <button onclick="switchTab('udhaar')" id="tab-udhaar" class="flex-1 py-3 text-gray-500 font-bold text-sm">UDHAAR</button>
    </div>

    <div id="view-live" class="space-y-3 min-h-[50vh]"></div>
    <div id="view-history" class="hidden space-y-3"><div id="history-container"></div></div>
    <div id="view-udhaar" class="hidden space-y-3">
        <input type="text" id="search-udhaar" onkeyup="filterUdhaar()" placeholder="Search Name..." class="w-full p-2 bg-gray-800 rounded-lg border border-gray-700 text-sm mb-2 outline-none">
        <div id="udhaar-list" class="space-y-2"></div>
    </div>

    <div id="manage-modal" class="fixed inset-0 bg-black/90 hidden flex items-end sm:items-center justify-center z-50 p-4">
        <div class="bg-[#151515] w-full max-w-sm rounded-2xl border border-gray-700 shadow-2xl modal-content flex flex-col max-h-[90vh]">
            <div class="p-4 border-b border-gray-800 flex justify-between items-center bg-gray-900/50 rounded-t-2xl">
                <div>
                    <h2 class="text-lg font-bold text-white" id="m-cust-name">Customer</h2>
                    <p class="text-xs text-orange-500 font-bold" id="m-pay-mode">CASH</p>
                </div>
                <button onclick="closeManageModal()" class="w-8 h-8 bg-gray-800 rounded-full text-gray-400"><i class="fas fa-times"></i></button>
            </div>

            <div class="p-4 overflow-y-auto flex-1">
                <div class="grid grid-cols-4 gap-2 mb-6">
                    <a id="btn-call" class="col-span-1 bg-green-900/40 border border-green-800 text-green-400 rounded-xl py-3 flex flex-col items-center justify-center gap-1">
                        <i class="fas fa-phone"></i><span class="text-[9px]">Call</span>
                    </a>
                    <a id="btn-wa" class="col-span-1 bg-gray-800 border border-gray-700 text-green-500 rounded-xl py-3 flex flex-col items-center justify-center gap-1">
                        <i class="fab fa-whatsapp"></i><span class="text-[9px]">Chat</span>
                    </a>
                    <a id="btn-map" target="_blank" class="col-span-1 bg-blue-900/40 border border-blue-800 text-blue-400 rounded-xl py-3 flex flex-col items-center justify-center gap-1">
                        <i class="fas fa-map-marker-alt"></i><span class="text-[9px]">Map</span>
                    </a>
                    <button onclick="copyAddress()" class="col-span-1 bg-gray-800 border border-gray-700 text-gray-300 rounded-xl py-3 flex flex-col items-center justify-center gap-1">
                        <i class="fas fa-copy"></i><span class="text-[9px]">Copy</span>
                    </button>
                </div>

                <div class="bg-gray-800/50 p-3 rounded-xl border border-gray-700 mb-4">
                    <p class="text-[10px] text-gray-500 uppercase font-bold mb-1">Delivery Location</p>
                    <p class="text-sm text-gray-200" id="m-address">...</p>
                    <p class="text-xs text-red-400 mt-1 hidden" id="m-dist-warn">⚠️ Out of Range</p>
                </div>

                <div class="mb-4">
                    <div class="flex justify-between items-center mb-2">
                        <p class="text-[10px] text-gray-500 uppercase font-bold">Items (Edit for PNA)</p>
                        <span class="text-xs text-yellow-500" id="pna-indicator" style="display:none">Modified</span>
                    </div>
                    <div id="m-items-list" class="space-y-2"></div>
                </div>
            </div>

            <div class="p-4 border-t border-gray-800 bg-gray-900/50 rounded-b-2xl">
                <div class="flex justify-between items-center mb-3">
                    <span class="text-gray-400 text-sm">Total Bill</span>
                    <span class="text-2xl font-bold text-white">₹<span id="m-total">0</span></span>
                </div>
                <button onclick="saveOrderChanges()" id="btn-save-changes" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold shadow-lg hidden">Save Changes & Notify</button>
                
                <div class="grid grid-cols-2 gap-3 mt-2">
                    <button onclick="updateOrderStatusFromModal('ready')" class="bg-orange-600 text-white py-3 rounded-xl font-bold text-sm">Mark Ready</button>
                    <button onclick="updateOrderStatusFromModal('completed')" class="bg-green-600 text-white py-3 rounded-xl font-bold text-sm">Delivered</button>
                </div>
            </div>
        </div>
    </div>

    <div id="custom-confirm" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center p-4 z-[60]">
        <div class="bg-gray-900 border border-gray-700 p-5 rounded-2xl w-full max-w-xs confirm-box shadow-2xl">
            <h3 class="text-lg font-bold text-white mb-2" id="confirm-title">Confirm?</h3>
            <div class="flex gap-3 mt-4">
                <button onclick="closeConfirm(false)" class="flex-1 py-2 rounded-lg bg-gray-800 text-gray-400 font-bold text-sm">Cancel</button>
                <button onclick="closeConfirm(true)" class="flex-1 py-2 rounded-lg bg-orange-600 text-white font-bold text-sm shadow-lg">Confirm</button>
            </div>
        </div>
    </div>

    <div id="menu-modal" class="fixed inset-0 bg-black/90 hidden flex items-center justify-center p-4 z-40">
        <div class="bg-gray-900 border border-gray-700 p-6 rounded-2xl w-full max-w-sm max-h-[80vh] overflow-y-auto">
            <h3 class="text-xl font-bold mb-4 text-white">Stock Management</h3>
            <div id="menu-list-items" class="space-y-3"></div>
            <button onclick="saveMenuStatus()" class="w-full mt-4 py-3 rounded-lg bg-green-600 text-white font-bold">Save Stock</button>
            <button onclick="document.getElementById('menu-modal').classList.add('hidden')" class="w-full mt-2 py-2 text-gray-500 text-xs">Close</button>
        </div>
    </div>

    <div id="toast-container"></div>
    <audio id="order-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

    <script>
        // --- CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyBadYpoNTL0dHkBQO4UddRVtPIfUOlf-bA",
            authDomain: "sgmc-16568.firebaseapp.com",
            projectId: "sgmc-16568",
            storageBucket: "sgmc-16568.firebasestorage.app",
            messagingSenderId: "339041646158",
            appId: "1:339041646158:web:85d9a50a3b51b30aae351f",
            measurementId: "G-4996NPF55N"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- STATE ---
        let currentOrderData = null; // For Modal
        let currentItemsEdit = []; // For PNA editing
        let isShopOpen = false;
        let soundEnabled = false;
        let audioLoopInterval = null;
        let shopLocation = null;
        
        // --- INIT ---
        function init() {
            db.collection('settings').doc('config').onSnapshot(doc => { 
                if(doc.exists && doc.data().lastReset) window.lastResetSeconds = doc.data().lastReset.seconds; 
                recalculateData(); 
            });
            db.collection('settings').doc('status').onSnapshot(doc => { 
                isShopOpen = doc.exists ? doc.data().isOpen : true; 
                const btn = document.getElementById('shop-toggle-btn'); 
                btn.innerText = isShopOpen ? "OPEN" : "CLOSED"; 
                btn.className = isShopOpen ? "px-3 py-2 rounded text-xs font-bold bg-green-600 text-white" : "px-3 py-2 rounded text-xs font-bold bg-red-600 text-white"; 
            });
            db.collection('settings').doc('location').get().then(doc => { if(doc.exists) shopLocation = doc.data(); });

            db.collection('orders').orderBy('timestamp', 'desc').onSnapshot(snap => { window.ordersSnapshot = snap; recalculateData(); });
        }

        // --- SOUND SYSTEM (Robust) ---
        function enableSound() {
            if(!soundEnabled) {
                const audio = document.getElementById('order-sound');
                audio.play().then(() => {
                    audio.pause(); audio.currentTime = 0;
                    soundEnabled = true;
                    document.getElementById('sound-status').innerHTML = '<i class="fas fa-volume-up text-green-500"></i> Sound ON';
                }).catch(e => console.log("User interaction needed"));
            }
        }
        function toggleMute() {
            soundEnabled = !soundEnabled;
            document.getElementById('sound-status').innerHTML = soundEnabled ? '<i class="fas fa-volume-up text-green-500"></i> Sound ON' : '<i class="fas fa-volume-mute text-red-500"></i> Muted';
        }
        function playNotification() {
            if(soundEnabled) {
                const audio = document.getElementById('order-sound');
                audio.currentTime = 0;
                audio.play().catch(e => {});
            }
        }

        // --- LOCATION SYSTEM ---
        function setShopLocation() {
            if(!navigator.geolocation) { showToast("GPS not supported", "error"); return; }
            document.getElementById('loc-btn').innerHTML = '<i class="fas fa-circle-notch fa-spin"></i>';
            navigator.geolocation.getCurrentPosition(pos => {
                db.collection('settings').doc('location').set({ lat: pos.coords.latitude, lng: pos.coords.longitude }).then(() => {
                    showToast("Shop Location Updated!");
                    shopLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    document.getElementById('loc-btn').innerHTML = '<i class="fas fa-map-marker-alt"></i>';
                });
            });
        }

        // --- DATA HANDLING ---
        function recalculateData() {
            if(!window.ordersSnapshot) return;
            let liveHtml = '', sales = 0, activeCount = 0;
            
            window.ordersSnapshot.docs.forEach(doc => {
                const data = doc.data();
                const id = doc.id;
                
                // Calculate Sales
                if(data.status === 'completed' && (!window.lastResetSeconds || data.timestamp.seconds > window.lastResetSeconds)) {
                    sales += data.totalAmount;
                }

                // Render Active Cards
                if(['pending', 'cooking', 'ready'].includes(data.status)) {
                    activeCount++;
                    const isUpi = data.paymentMode === 'UPI' && !data.paymentVerified;
                    
                    // Simple Card UI
                    liveHtml += `
                    <div class="card p-4 border-l-4 ${data.paymentMode==='Udhaar'?'border-red-500':'border-blue-500'} relative cursor-pointer active:bg-gray-800 transition" onclick="openOrderManageModal('${id}')">
                        <div class="flex justify-between items-start">
                            <div>
                                <h3 class="font-bold text-lg">${data.customerName}</h3>
                                <p class="text-xs text-gray-400">${data.items.length} Items</p>
                            </div>
                            <div class="text-right">
                                <h3 class="font-bold text-xl text-orange-400">₹${data.totalAmount}</h3>
                                <div class="mt-1">
                                    <span class="status-btn ${data.status==='pending'?'status-pending':(data.status==='cooking'?'status-cooking':'status-ready')}">
                                        ${data.status}
                                    </span>
                                </div>
                            </div>
                        </div>
                        ${isUpi ? '<div class="mt-2 text-[10px] bg-yellow-900/30 text-yellow-200 px-2 py-1 rounded border border-yellow-700/50 flex justify-between items-center"><span>⚠️ Verify UPI</span><span class="font-bold">Check</span></div>' : ''}
                        <p class="text-[10px] text-gray-500 mt-2 text-center">Tap to Manage / Edit Order</p>
                    </div>`;
                }
            });

            if(activeCount > (window.lastActiveCount || 0)) playNotification();
            window.lastActiveCount = activeCount;

            document.getElementById('view-live').innerHTML = liveHtml || '<div class="text-center text-gray-500 mt-10">No active orders</div>';
            document.getElementById('total-sales').innerText = sales;
            document.getElementById('pending-count').innerText = activeCount;
        }

        // --- ORDER MANAGER MODAL (CORE LOGIC) ---
        function openOrderManageModal(id) {
            const doc = window.ordersSnapshot.docs.find(d => d.id === id);
            if(!doc) return;
            currentOrderData = { id: id, ...doc.data() };
            currentItemsEdit = JSON.parse(JSON.stringify(currentOrderData.items)); // Deep copy for editing

            // Populate Modal
            document.getElementById('m-cust-name').innerText = currentOrderData.customerName;
            document.getElementById('m-pay-mode').innerText = currentOrderData.paymentMode;
            document.getElementById('m-address').innerText = currentOrderData.customerAddress || "No Address";
            document.getElementById('m-total').innerText = currentOrderData.totalAmount;
            
            // Buttons
            document.getElementById('btn-call').href = `tel:${currentOrderData.customerPhone}`;
            document.getElementById('btn-wa').href = `https://wa.me/91${currentOrderData.customerPhone.replace(/\D/g,'').slice(-10)}`;
            
            if(currentOrderData.location && currentOrderData.location.lat) {
                document.getElementById('btn-map').href = `https://www.google.com/maps/dir/?api=1&destination=${currentOrderData.location.lat},${currentOrderData.location.lng}`;
                document.getElementById('btn-map').classList.remove('opacity-50', 'pointer-events-none');
            } else {
                document.getElementById('btn-map').classList.add('opacity-50', 'pointer-events-none');
            }

            renderEditItems();
            document.getElementById('manage-modal').classList.remove('hidden');
            setTimeout(() => document.querySelector('.modal-content').classList.add('open'), 10);
        }

        function renderEditItems() {
            const list = document.getElementById('m-items-list');
            list.innerHTML = currentItemsEdit.map((item, index) => `
                <div class="flex justify-between items-center bg-gray-800 p-2 rounded border border-gray-700">
                    <div>
                        <p class="text-sm font-bold text-white">${item.name}</p>
                        <p class="text-xs text-gray-400">₹${item.price} each</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <button onclick="changeItemQty(${index}, -1)" class="w-6 h-6 bg-gray-700 rounded text-white font-bold">-</button>
                        <span class="text-sm font-bold w-4 text-center">${item.qty}</span>
                        <button onclick="changeItemQty(${index}, 1)" class="w-6 h-6 bg-gray-700 rounded text-white font-bold">+</button>
                    </div>
                </div>
            `).join('');
            
            // Recalculate Total locally
            const newTotal = currentItemsEdit.reduce((sum, i) => sum + (i.price * i.qty), 0);
            document.getElementById('m-total').innerText = newTotal;

            // Show Save button if changed
            const isChanged = JSON.stringify(currentItemsEdit) !== JSON.stringify(currentOrderData.items);
            const saveBtn = document.getElementById('btn-save-changes');
            if(isChanged) {
                saveBtn.classList.remove('hidden');
                saveBtn.innerText = `Save Changes (₹${newTotal})`;
            } else {
                saveBtn.classList.add('hidden');
            }
        }

        function changeItemQty(index, change) {
            if(currentItemsEdit[index].qty + change >= 0) { // Allow 0 to remove
                currentItemsEdit[index].qty += change;
                if(currentItemsEdit[index].qty === 0) currentItemsEdit.splice(index, 1);
                renderEditItems();
            }
        }

        function saveOrderChanges() {
            const newTotal = currentItemsEdit.reduce((sum, i) => sum + (i.price * i.qty), 0);
            db.collection('orders').doc(currentOrderData.id).update({
                items: currentItemsEdit,
                totalAmount: newTotal
            }).then(() => {
                showToast("Order Updated & Customer Notified");
                closeManageModal();
            });
        }

        function updateOrderStatusFromModal(status) {
            db.collection('orders').doc(currentOrderData.id).update({ status: status }).then(() => {
                showToast("Order Marked " + status);
                if(status === 'completed') closeManageModal();
            });
        }

        function closeManageModal() {
            document.querySelector('.modal-content').classList.remove('open');
            setTimeout(() => document.getElementById('manage-modal').classList.add('hidden'), 200);
        }

        function copyAddress() {
            const addr = document.getElementById('m-address').innerText;
            navigator.clipboard.writeText(addr).then(() => showToast("Address Copied"));
        }

        // --- STANDARD UTILS ---
        function showToast(msg, type='success') {
            const c = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = 'toast show';
            t.innerHTML = (type==='error' ? '❌ ' : '✅ ') + msg;
            c.appendChild(t);
            setTimeout(() => t.remove(), 2000);
        }
        function toggleShop() { db.collection('settings').doc('status').set({isOpen:!isShopOpen}); }
        function endDay() { db.collection('settings').doc('config').set({lastReset: firebase.firestore.FieldValue.serverTimestamp()}, {merge:true}); }
        function confirmAction(t, cb) { 
            document.getElementById('confirm-title').innerText = t; 
            document.getElementById('custom-confirm').classList.remove('hidden'); 
            pendingAction = cb; 
        }
        function closeConfirm(res) { 
            document.getElementById('custom-confirm').classList.add('hidden'); 
            if(res && pendingAction) pendingAction(); 
        }
        function switchTab(t) {
            ['live','history','udhaar'].forEach(x => {
                document.getElementById(`view-${x}`).classList.add('hidden');
                document.getElementById(`tab-${x}`).className = "flex-1 py-3 text-gray-500 font-bold text-sm";
            });
            document.getElementById(`view-${t}`).classList.remove('hidden');
            document.getElementById(`tab-${t}`).className = "flex-1 py-3 tab-active font-bold text-sm";
        }

        // Menu Control (Keeping it simple for stock)
        const adminMenuItems = [{id:1,name:"Chai"},{id:2,name:"Adrak Chai"},{id:3,name:"Cigarette"},{id:4,name:"Matthi"},{id:5,name:"Roll"},{id:6,name:"Biscuit"}];
        function openMenuControl() {
            db.collection('settings').doc('menu').get().then(doc => {
                const s = doc.exists ? doc.data() : {};
                document.getElementById('menu-list-items').innerHTML = adminMenuItems.map(i => 
                    `<div class="flex justify-between p-2 bg-gray-800 rounded"><span>${i.name}</span><input type="checkbox" id="stock-${i.id}" ${s[i.id]!==false?'checked':''} class="accent-green-500"></div>`
                ).join('');
                document.getElementById('menu-modal').classList.remove('hidden');
            });
        }
        function saveMenuStatus() {
            const u = {}; adminMenuItems.forEach(i => u[i.id] = document.getElementById(`stock-${i.id}`).checked);
            db.collection('settings').doc('menu').set(u).then(() => { document.getElementById('menu-modal').classList.add('hidden'); showToast("Stock Updated"); });
        }

        init();
    </script>
</body>
</html>
