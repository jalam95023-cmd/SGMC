<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGMC Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: sans-serif; }
        .order-card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; border-left: 5px solid #d35400; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .order-card.ready { border-left-color: #f1c40f; }
        .order-card.delivered { border-left-color: #2ecc71; opacity: 0.7; }
        .items-list { background: #fff5f0; padding: 10px; border-radius: 8px; font-size: 14px; margin: 10px 0; }
        .btn-status { font-size: 12px; margin-right: 5px; }
    </style>
</head>
<body>

<div class="container py-3">
    <h3 class="fw-bold text-center mb-4">👨‍💻 SGMC Admin Panel</h3>
    <div id="orders-container">
        <p class="text-center text-muted">Connecting to orders...</p>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBadYpoNTL0dHkBQO4UddRVtPIfUOlf-bA",
    authDomain: "sgmc-16568.firebaseapp.com",
    projectId: "sgmc-16568",
    storageBucket: "sgmc-16568.firebasestorage.app",
    messagingSenderId: "339041646158",
    appId: "1:339041646158:web:85d9a50a3b51b30aae351f",
    measurementId: "G-4996NPF55N"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Listen for Orders Real-time
  const q = query(collection(db, "orders"), orderBy("timestamp", "desc"));
  
  onSnapshot(q, (snapshot) => {
      const container = document.getElementById('orders-container');
      container.innerHTML = ""; // Clear list
      
      if(snapshot.empty) {
          container.innerHTML = "<p class='text-center'>Abhi koi order nahi hai.</p>";
          return;
      }

      snapshot.forEach((docSnap) => {
          const order = docSnap.data();
          const id = docSnap.id;
          
          // Format Items List
          let itemsHtml = "";
          if(order.items.chai > 0) itemsHtml += `<div>☕ Chai: <b>${order.items.chai}</b></div>`;
          if(order.items.bun > 0) itemsHtml += `<div>🍞 Bun: <b>${order.items.bun}</b></div>`;
          if(order.items.mathi > 0) itemsHtml += `<div>🍪 Mathi: <b>${order.items.mathi}</b></div>`;
          if(order.items.roll > 0) itemsHtml += `<div>🌯 Roll: <b>${order.items.roll}</b></div>`;
          if(order.items.cig.qty > 0) itemsHtml += `<div>🚬 Cig: <b>${order.items.cig.qty}</b> (${order.items.cig.brand})</div>`;
          if(order.items.pan.qty > 0) itemsHtml += `<div>✌️ Pan: <b>${order.items.pan.qty}</b> (${order.items.pan.brand})</div>`;
          if(order.items.other) itemsHtml += `<div>📝 Other: ${order.items.other}</div>`;

          // Card HTML
          const card = document.createElement('div');
          let statusClass = order.status.toLowerCase();
          card.className = `order-card ${statusClass}`;
          
          card.innerHTML = `
              <div class="d-flex justify-content-between">
                  <h5 class="m-0 fw-bold">₹${order.totalBill}</h5>
                  <span class="badge bg-secondary">${order.status}</span>
              </div>
              <div class="small text-muted mt-1">
                  👤 ${order.customerName} | 📱 <a href="tel:${order.phone}">${order.phone}</a>
              </div>
              <div class="fw-bold text-danger mt-1">📍 ${order.location}</div>
              
              <div class="items-list">${itemsHtml}</div>
              
              <div class="mt-2">
                  <button onclick="updateStatus('${id}', 'Accepted')" class="btn btn-primary btn-sm btn-status">Accept</button>
                  <button onclick="updateStatus('${id}', 'Ready')" class="btn btn-warning btn-sm btn-status">Ready</button>
                  <button onclick="updateStatus('${id}', 'Delivered')" class="btn btn-success btn-sm btn-status">Done</button>
                  <button onclick="deleteOrder('${id}')" class="btn btn-outline-danger btn-sm float-end">❌</button>
              </div>
          `;
          container.appendChild(card);
      });
  });

  // Expose functions to window
  window.updateStatus = async (id, status) => {
      await updateDoc(doc(db, "orders", id), { status: status });
  }
  
  window.deleteOrder = async (id) => {
      if(confirm("Delete kar de?")) {
          await deleteDoc(doc(db, "orders", id));
      }
  }
</script>
</body>
</html>
