<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGMC Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #2c3e50; color: white; font-family: sans-serif; }
        .order-card { background: #ecf0f1; color: #2c3e50; border-radius: 10px; margin-bottom: 15px; padding: 15px; border-left: 8px solid #e74c3c; }
        .status-ready { border-left-color: #f1c40f; background: #fffbe6; }
        .status-done { border-left-color: #27ae60; opacity: 0.6; }
        .item-list { font-size: 16px; margin: 0; padding-left: 20px; }
        .item-list li { margin-bottom: 4px; }
    </style>
</head>
<body>

<div class="container mt-3">
    <h3 class="text-center mb-4">🔥 SGMC Admin Panel</h3>
    <div id="ordersList">Loading...</div>
</div>

<audio id="notifSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  // TODO: PASTE API KEY HERE (SAME AS CUSTOMER SIDE)
  const firebaseConfig = {
    apiKey: "AIzaSyBadYpoNTL0dHkBQO4UddRVtPIfUOlf-bA",
  authDomain: "sgmc-16568.firebaseapp.com",
  projectId: "sgmc-16568",
  storageBucket: "sgmc-16568.firebasestorage.app",
  messagingSenderId: "339041646158",
  appId: "1:339041646158:web:85d9a50a3b51b30aae351f",
  measurementId: "G-4996NPF55N"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const audio = document.getElementById('notifSound');

  onSnapshot(query(collection(db, "orders"), orderBy("timestamp", "desc")), (snapshot) => {
      const list = document.getElementById('ordersList');
      list.innerHTML = ""; 

      snapshot.docChanges().forEach((change) => {
        if (change.type === "added") { try { audio.play(); } catch(e){} }
      });

      if (snapshot.empty) { list.innerHTML = "<p class='text-center'>No orders yet.</p>"; return; }

      snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const i = data.items || {}; // Short variable for items
          
          let cardClass = "order-card";
          if(data.status === 'Ready') cardClass += " status-ready";
          if(data.status === 'Delivered') cardClass += " status-done";

          // Generate HTML for items list
          let itemsHtml = "";
          if(i.chai) itemsHtml += `<li>☕ <b>${i.chai} Chai</b></li>`;
          if(i.cig && i.cig.qty) itemsHtml += `<li>🚬 <b>${i.cig.qty} Cigarette</b> <small>(${i.cig.brand || 'Any'})</small></li>`;
          if(i.pan && i.pan.qty) itemsHtml += `<li>✌️ <b>${i.pan.qty} Pan Masala</b> <small>(${i.pan.brand || 'Any'})</small></li>`;
          if(i.bun) itemsHtml += `<li>🍞 <b>${i.bun} Bun Maska</b></li>`;
          if(i.mathi) itemsHtml += `<li>🍪 <b>${i.mathi} Mathi</b></li>`;
          if(i.roll) itemsHtml += `<li>🌯 <b>${i.roll} Roll</b></li>`;
          if(i.other) itemsHtml += `<li>📦 <i>${i.other}</i></li>`;

          const html = `
            <div class="${cardClass}">
                <div class="d-flex justify-content-between">
                    <h5>${data.location}</h5>
                    <small>${data.customerName}</small>
                </div>
                <hr style="margin:5px 0 10px 0">
                <ul class="item-list">
                    ${itemsHtml}
                </ul>
                <div class="mt-3 d-flex gap-2">
                    <button onclick="updateStatus('${docSnap.id}', 'Ready')" class="btn btn-warning btn-sm flex-grow-1">🟡 Making</button>
                    <button onclick="updateStatus('${docSnap.id}', 'Delivered')" class="btn btn-success btn-sm flex-grow-1">🟢 Delivered</button>
                    <button onclick="deleteOrder('${docSnap.id}')" class="btn btn-outline-danger btn-sm">❌</button>
                </div>
            </div>
          `;
          list.innerHTML += html;
      });
  });

  window.updateStatus = async (id, s) => { await updateDoc(doc(db, "orders", id), { status: s }); };
  window.deleteOrder = async (id) => { if(confirm("Delete?")) await deleteDoc(doc(db, "orders", id)); };
</script>
</body>
</html>
