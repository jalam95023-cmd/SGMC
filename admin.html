<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGMC Admin</title>
    <link rel="manifest" href="admin_manifest.json">
    <meta name="theme-color" content="#0f0f0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0f0f0f; color: white; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        .card { background: #1f1f1f; border-radius: 12px; border: 1px solid #333; }
        .tab-active { border-bottom: 2px solid #F97316; color: #F97316; }
        
        #toast-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 100; pointer-events: none; }
        .toast { background: rgba(30, 30, 30, 0.95); border: 1px solid #333; padding: 10px 20px; border-radius: 50px; color: white; font-size: 14px; opacity: 0; transform: translateY(20px); transition: all 0.3s; display: flex; align-items: center; gap: 8px; }
        .toast.show { opacity: 1; transform: translateY(0); }
        
        #custom-confirm, #manage-modal, #sales-modal, #chat-modal { backdrop-filter: blur(5px); }
        .confirm-box { transform: scale(0.9); transition: transform 0.2s; }
        .confirm-box.open { transform: scale(1); }
        
        /* Chat Styles */
        .chat-bubble { padding: 8px 12px; border-radius: 12px; max-width: 80%; font-size: 12px; margin-bottom: 4px; }
        .chat-me { background: #F97316; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .chat-user { background: #333; color: white; align-self: flex-start; border-bottom-left-radius: 2px; }
        .unread-dot { width: 8px; height: 8px; background: red; border-radius: 50%; display: inline-block; margin-left: 5px; }
    </style>
</head>
<body class="p-4 max-w-2xl mx-auto pb-24" onclick="enableSound()">

    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-orange-500">SGMC Admin</h1>
        <div class="flex gap-2">
            <button onclick="setShopLocation()" id="loc-btn" class="w-9 h-9 rounded bg-gray-800 text-blue-400 border border-gray-600 flex items-center justify-center shadow"><i class="fas fa-map-marker-alt"></i></button>
            <button onclick="openBroadcastModal()" class="w-9 h-9 rounded bg-gray-800 text-yellow-500 border border-gray-600 flex items-center justify-center shadow"><i class="fas fa-bullhorn text-xs"></i></button>
            
            <button onclick="openMenuControl()" class="px-3 py-2 rounded text-xs font-bold bg-blue-600 text-white shadow-lg">Stock</button>
            <button id="shop-toggle-btn" onclick="toggleShop()" class="px-3 py-2 rounded text-xs font-bold bg-gray-700 shadow-lg">Loading...</button>
        </div>
    </div>

    <div class="grid grid-cols-2 gap-4 mb-4">
        <div class="card p-3 flex flex-col justify-between relative overflow-hidden cursor-pointer" onclick="openSalesAnalysis()">
            <div class="absolute top-0 right-0 w-16 h-16 bg-green-500/10 rounded-full -mr-8 -mt-8"></div>
            <div class="text-center z-10">
                <div class="flex justify-center items-center gap-2">
                    <p class="text-gray-400 text-xs uppercase tracking-wider">Sales Today</p>
                    <div onclick="event.stopPropagation(); toggleSalesPrivacy()" class="text-gray-600 hover:text-white text-[10px]"><i class="fas fa-eye" id="privacy-icon"></i></div>
                </div>
                <h2 class="text-2xl font-bold text-green-400 mt-1">₹<span id="total-sales">0</span></h2>
                <p class="text-[9px] text-gray-500 mt-1">Tap for details <i class="fas fa-chart-bar ml-1"></i></p>
            </div>
            <button onclick="event.stopPropagation(); confirmAction('Reset Day Sales?', endDay)" class="mt-2 w-full py-1 text-[10px] bg-red-500/10 text-red-400 rounded border border-red-500/20 hover:bg-red-500/20 transition">RESET DAY</button>
        </div>
        <div class="card p-3 text-center flex flex-col justify-center" onclick="stopSoundManually()">
            <p class="text-gray-400 text-xs uppercase">Active Orders</p>
            <h2 class="text-3xl font-bold text-yellow-400 my-1" id="pending-count">0</h2>
            <p class="text-[10px] text-gray-500" id="sound-status">Tap to Mute 🔇</p>
        </div>
    </div>

    <div class="flex mb-4 border-b border-gray-800">
        <button onclick="switchTab('live')" id="tab-live" class="flex-1 py-3 tab-active font-bold text-sm">LIVE</button>
        <button onclick="switchTab('chats')" id="tab-chats" class="flex-1 py-3 text-gray-500 font-bold text-sm relative">CHATS <span id="chat-badge" class="hidden absolute top-3 right-4 w-2 h-2 bg-red-500 rounded-full"></span></button>
        <button onclick="switchTab('history')" id="tab-history" class="flex-1 py-3 text-gray-500 font-bold text-sm">HISTORY</button>
        <button onclick="switchTab('udhaar')" id="tab-udhaar" class="flex-1 py-3 text-gray-500 font-bold text-sm">UDHAAR</button>
    </div>

    <div id="view-live" class="space-y-3 min-h-[50vh]"></div>
    
    <div id="view-chats" class="hidden space-y-2">
        <div id="chats-list" class="space-y-2 pb-20"></div>
    </div>

    <div id="view-history" class="hidden space-y-3"><div id="history-container"></div></div>
    <div id="view-udhaar" class="hidden space-y-3">
        <input type="text" id="search-udhaar" onkeyup="filterUdhaar()" placeholder="Search Name..." class="w-full p-2 bg-gray-800 rounded-lg border border-gray-700 text-sm mb-2 outline-none">
        <div id="udhaar-list" class="space-y-2"></div>
    </div>

    <div id="sales-modal" class="fixed inset-0 bg-black/95 hidden flex items-center justify-center p-4 z-[70]">
        <div class="bg-gray-900 border border-gray-700 p-6 rounded-2xl w-full max-w-sm shadow-2xl max-h-[80vh] overflow-y-auto">
            <h3 class="text-xl font-bold mb-4 text-white">Sales Breakdown</h3>
            <div id="sales-breakdown-list" class="space-y-2"></div>
            <button onclick="document.getElementById('sales-modal').classList.add('hidden')" class="w-full mt-4 py-3 bg-gray-800 rounded-lg text-sm text-gray-400">Close</button>
        </div>
    </div>

    <div id="broadcast-modal" class="fixed inset-0 bg-black/90 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-gray-900 border border-gray-700 p-6 rounded-2xl w-full max-w-sm">
            <h3 class="text-lg font-bold text-white mb-2">Set Announcement</h3>
            <textarea id="broadcast-input" rows="3" class="w-full bg-gray-800 border border-gray-600 rounded-lg p-3 text-white text-sm outline-none" placeholder="e.g. Shop closing at 4 PM..."></textarea>
            <div class="flex gap-3 mt-4">
                <button onclick="saveBroadcast('')" class="flex-1 py-2 bg-red-900/30 text-red-400 rounded-lg text-xs">Clear</button>
                <button onclick="saveBroadcast(document.getElementById('broadcast-input').value)" class="flex-1 py-2 bg-orange-600 text-white rounded-lg text-xs font-bold">Publish</button>
            </div>
            <button onclick="document.getElementById('broadcast-modal').classList.add('hidden')" class="w-full mt-2 py-2 text-gray-500 text-xs">Close</button>
        </div>
    </div>

    <div id="chat-modal" class="fixed inset-0 bg-black/95 hidden flex items-end justify-center z-[80]">
        <div class="bg-[#151515] w-full max-w-md rounded-t-2xl border-t border-gray-700 h-[80vh] flex flex-col">
            <div class="p-4 border-b border-gray-800 flex justify-between items-center bg-gray-900">
                <h3 class="font-bold text-white" id="chat-user-name">Chat</h3>
                <button onclick="closeChatModal()" class="text-gray-400"><i class="fas fa-times"></i></button>
            </div>
            <div id="chat-messages" class="flex-1 overflow-y-auto p-4 flex flex-col gap-2"></div>
            <div class="p-3 bg-gray-900 border-t border-gray-800 flex gap-2">
                <input type="text" id="chat-input" class="flex-1 bg-gray-800 text-white px-4 py-2 rounded-full outline-none border border-gray-700" placeholder="Type...">
                <button onclick="sendAdminMessage()" class="w-10 h-10 rounded-full bg-orange-600 text-white flex items-center justify-center"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <div id="manage-modal" class="fixed inset-0 bg-black/90 hidden flex items-end sm:items-center justify-center z-50 p-4">
        <div class="bg-[#151515] w-full max-w-sm rounded-2xl border border-gray-700 shadow-2xl modal-content flex flex-col max-h-[90vh]">
            <div class="p-4 border-b border-gray-800 flex justify-between items-center bg-gray-900/50 rounded-t-2xl">
                <div><h2 class="text-lg font-bold text-white" id="m-cust-name">Customer</h2></div>
                <button onclick="document.getElementById('manage-modal').classList.add('hidden')" class="text-gray-400"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-4 overflow-y-auto flex-1 space-y-4">
                <div class="grid grid-cols-3 gap-2">
                    <a id="btn-call" class="bg-gray-800 border border-gray-700 text-white py-3 rounded-xl flex flex-col items-center justify-center"><i class="fas fa-phone-alt text-green-400"></i> Call</a>
                    <a id="btn-map" target="_blank" class="bg-gray-800 border border-gray-700 text-white py-3 rounded-xl flex flex-col items-center justify-center"><i class="fas fa-map-marker-alt text-blue-400"></i> Map</a>
                    <button onclick="openChatFromOrder()" class="bg-gray-800 border border-gray-700 text-white py-3 rounded-xl flex flex-col items-center justify-center"><i class="fas fa-comment text-yellow-500"></i> Chat</button>
                </div>
                <div id="m-items-list" class="space-y-2"></div>
                <button onclick="saveOrderChanges()" class="w-full bg-blue-600 py-2 rounded-lg font-bold text-sm">Save PNA Changes</button>
            </div>
        </div>
    </div>

    <div id="custom-confirm" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center p-4 z-[90]">
        <div class="bg-gray-900 border border-gray-700 p-5 rounded-2xl w-full max-w-xs confirm-box">
            <h3 class="text-lg font-bold text-white mb-2" id="confirm-title">Confirm?</h3>
            <div class="flex gap-3 mt-4">
                <button onclick="closeConfirm(false)" class="flex-1 py-2 bg-gray-800 rounded-lg">Cancel</button>
                <button onclick="closeConfirm(true)" class="flex-1 py-2 bg-orange-600 rounded-lg">Confirm</button>
            </div>
        </div>
    </div>
    <div id="toast-container"></div>
    <audio id="order-sound"></audio>

    <div id="menu-modal" class="hidden"></div> <div id="settle-modal" class="hidden"></div>

    <script>
        // CONFIG
        const firebaseConfig = { apiKey: "AIzaSyBadYpoNTL0dHkBQO4UddRVtPIfUOlf-bA", authDomain: "sgmc-16568.firebaseapp.com", projectId: "sgmc-16568", storageBucket: "sgmc-16568.firebasestorage.app", messagingSenderId: "339041646158", appId: "1:339041646158:web:85d9a50a3b51b30aae351f" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // STATE
        let currentOrderData = null; let currentItemsEdit = [];
        let isShopOpen = false; let soundEnabled = false; let pendingAction = null;
        let salesHidden = false; let todaysItemsMap = {}; let salesHistoryData = [];
        let currentChatPhone = null;

        function init() {
            db.collection('settings').doc('config').onSnapshot(doc => { 
                if(doc.exists) {
                    const data = doc.data();
                    if(data.lastReset) window.lastResetSeconds = data.lastReset.seconds;
                    if(data.salesHistory) salesHistoryData = data.salesHistory;
                }
                recalculateData(); 
            });
            db.collection('settings').doc('status').onSnapshot(doc => { 
                isShopOpen = doc.exists ? doc.data().isOpen : true; 
                const btn = document.getElementById('shop-toggle-btn'); 
                btn.innerText = isShopOpen ? "OPEN" : "CLOSED"; 
                btn.className = isShopOpen ? "px-3 py-2 rounded text-xs font-bold bg-green-600 text-white" : "px-3 py-2 rounded text-xs font-bold bg-red-600 text-white"; 
            });
            db.collection('orders').orderBy('timestamp', 'desc').onSnapshot(snap => { window.ordersSnapshot = snap; recalculateData(); });
            
            // Listen for Chats
            db.collection('chats').orderBy('lastUpdated', 'desc').onSnapshot(snap => renderChatsList(snap));
        }

        // --- SOUND ---
        function enableSound() { if(!soundEnabled) { const a = document.getElementById('order-sound'); a.src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"; a.loop=true; a.play().then(()=>{a.pause(); soundEnabled=true; document.getElementById('sound-status').innerHTML='🔊 ON';}); } }
        function playNotification() { if(soundEnabled) { document.getElementById('order-sound').play().catch(()=>{}); } }
        function stopSoundManually() { document.getElementById('order-sound').pause(); document.getElementById('order-sound').currentTime=0; }

        // --- MAP & LOCATION ---
        function setShopLocation() {
            if(!navigator.geolocation) { showToast("GPS Error", "error"); return; }
            document.getElementById('loc-btn').innerHTML = '...';
            navigator.geolocation.getCurrentPosition(pos => {
                db.collection('settings').doc('location').set({ lat: pos.coords.latitude, lng: pos.coords.longitude }, {merge: true}).then(() => {
                    showToast("Shop Location Set!");
                    document.getElementById('loc-btn').innerHTML = '<i class="fas fa-map-marker-alt"></i>';
                });
            });
        }

        // --- DATA & ORDERS ---
        function recalculateData() {
            if(!window.ordersSnapshot) return;
            let liveHtml = '', sales = 0, activeCount = 0; todaysItemsMap = {};
            
            window.ordersSnapshot.docs.forEach(doc => {
                const data = doc.data(); const id = doc.id;
                
                // Analytics
                if(data.status === 'completed' && (!window.lastResetSeconds || data.timestamp.seconds > window.lastResetSeconds)) {
                    sales += data.totalAmount;
                    data.items.forEach(i => { todaysItemsMap[i.name] = (todaysItemsMap[i.name] || 0) + i.qty; });
                }

                if(['pending', 'cooking', 'ready'].includes(data.status)) {
                    activeCount++;
                    liveHtml += `
                    <div class="card p-4 border-l-4 ${data.paymentMode==='Udhaar'?'border-red-500':'border-blue-500'} cursor-pointer" onclick="openOrderManageModal('${id}')">
                        <div class="flex justify-between">
                            <h3 class="font-bold">${data.customerName}</h3>
                            <span class="font-bold text-orange-400">₹${data.totalAmount}</span>
                        </div>
                        <p class="text-xs text-gray-400">${data.items.length} items • ${data.status}</p>
                        <div class="mt-2 flex justify-end"><button class="bg-gray-800 rounded-full w-8 h-8 flex items-center justify-center"><i class="fas fa-chevron-right"></i></button></div>
                    </div>`;
                }
            });

            if(activeCount > (window.lastActiveCount || 0)) playNotification();
            window.lastActiveCount = activeCount;

            document.getElementById('view-live').innerHTML = liveHtml || '<p class="text-center text-gray-500 mt-10">No active orders</p>';
            
            const salesEl = document.getElementById('total-sales');
            salesEl.innerText = salesHidden ? "****" : sales;
            salesEl.dataset.realValue = sales;
            document.getElementById('pending-count').innerText = activeCount;
        }

        // --- ORDER MANAGER (PNA + MAP) ---
        function openOrderManageModal(id) {
            stopSoundManually();
            const doc = window.ordersSnapshot.docs.find(d => d.id === id);
            if(!doc) return;
            currentOrderData = { id: id, ...doc.data() };
            currentItemsEdit = JSON.parse(JSON.stringify(currentOrderData.items));

            document.getElementById('m-cust-name').innerText = currentOrderData.customerName;
            
            // Map Link
            const lat = currentOrderData.location?.lat;
            const lng = currentOrderData.location?.lng;
            const mapBtn = document.getElementById('btn-map');
            if(lat && lng) {
                mapBtn.href = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
                mapBtn.classList.remove('opacity-50');
            } else {
                mapBtn.removeAttribute('href');
                mapBtn.classList.add('opacity-50');
            }
            document.getElementById('btn-call').href = `tel:${currentOrderData.customerPhone}`;

            renderEditItems();
            document.getElementById('manage-modal').classList.remove('hidden');
        }

        function renderEditItems() {
            document.getElementById('m-items-list').innerHTML = currentItemsEdit.map((item, i) => `
                <div class="flex justify-between items-center bg-gray-800 p-2 rounded">
                    <span>${item.name}</span>
                    <div class="flex gap-2">
                        <button onclick="modQty(${i}, -1)" class="w-6 h-6 bg-gray-700 rounded">-</button>
                        <span>${item.qty}</span>
                        <button onclick="modQty(${i}, 1)" class="w-6 h-6 bg-gray-700 rounded">+</button>
                    </div>
                </div>`).join('');
        }
        function modQty(i, c) {
            currentItemsEdit[i].qty += c;
            if(currentItemsEdit[i].qty < 0) currentItemsEdit[i].qty = 0;
            renderEditItems();
        }
        function saveOrderChanges() {
            const total = currentItemsEdit.reduce((s, i) => s + (i.price*i.qty), 0);
            db.collection('orders').doc(currentOrderData.id).update({ items: currentItemsEdit, totalAmount: total }).then(()=>{
                showToast("Order Updated"); document.getElementById('manage-modal').classList.add('hidden');
            });
        }
        
        // --- CHAT SYSTEM ---
        function renderChatsList(snap) {
            const list = document.getElementById('chats-list');
            let unread = 0;
            list.innerHTML = snap.docs.map(doc => {
                const c = doc.data();
                if(c.unreadAdmin) unread++;
                return `
                <div onclick="openChat('${doc.id}', '${c.userName}')" class="bg-gray-800 p-3 rounded flex justify-between items-center cursor-pointer ${c.unreadAdmin ? 'border-l-4 border-red-500' : ''}">
                    <div><h4 class="font-bold">${c.userName || doc.id}</h4><p class="text-xs text-gray-400 truncate">${c.lastMessage}</p></div>
                    ${c.unreadAdmin ? '<div class="w-2 h-2 bg-red-500 rounded-full"></div>' : ''}
                </div>`;
            }).join('');
            
            const badge = document.getElementById('chat-badge');
            if(unread > 0) { badge.classList.remove('hidden'); playNotification(); } 
            else badge.classList.add('hidden');
        }

        function openChat(phone, name) {
            currentChatPhone = phone;
            document.getElementById('chat-user-name').innerText = name || phone;
            document.getElementById('chat-modal').classList.remove('hidden');
            
            // Mark read
            db.collection('chats').doc(phone).update({ unreadAdmin: false });

            // Listen to messages
            db.collection('chats').doc(phone).onSnapshot(doc => {
                if(doc.exists) {
                    const msgs = doc.data().messages || [];
                    const container = document.getElementById('chat-messages');
                    container.innerHTML = msgs.map(m => `<div class="chat-bubble ${m.sender==='admin'?'chat-me':'chat-user'}">${m.text}</div>`).join('');
                    container.scrollTop = container.scrollHeight;
                }
            });
        }

        function sendAdminMessage() {
            const txt = document.getElementById('chat-input').value.trim();
            if(!txt || !currentChatPhone) return;
            const msg = { text: txt, sender: 'admin', timestamp: Date.now() };
            db.collection('chats').doc(currentChatPhone).update({
                messages: firebase.firestore.FieldValue.arrayUnion(msg),
                lastMessage: "You: " + txt,
                lastUpdated: firebase.firestore.FieldValue.serverTimestamp(),
                unreadUser: true
            });
            document.getElementById('chat-input').value = '';
        }
        function closeChatModal() { document.getElementById('chat-modal').classList.add('hidden'); }
        function openChatFromOrder() {
            if(currentOrderData) {
                document.getElementById('manage-modal').classList.add('hidden');
                switchTab('chats');
                openChat(currentOrderData.customerPhone, currentOrderData.customerName);
            }
        }

        // --- SALES & BROADCAST UTILS ---
        function toggleSalesPrivacy() { salesHidden = !salesHidden; recalculateData(); document.getElementById('privacy-icon').className = salesHidden ? 'fas fa-eye-slash' : 'fas fa-eye'; }
        function openSalesAnalysis() {
            const list = document.getElementById('sales-breakdown-list');
            list.innerHTML = Object.entries(todaysItemsMap).map(([k,v]) => `<div class="flex justify-between p-2 bg-gray-800 rounded"><span>${k}</span><span>${v}</span></div>`).join('') || '<p>No sales today</p>';
            document.getElementById('sales-modal').classList.remove('hidden');
        }
        function openBroadcastModal() { document.getElementById('broadcast-modal').classList.remove('hidden'); }
        function saveBroadcast(msg) { db.collection('settings').doc('config').set({ broadcastMessage: msg }, {merge:true}).then(() => { showToast("Updated"); document.getElementById('broadcast-modal').classList.add('hidden'); }); }
        function endDay() { 
            const entry = { date: new Date().toLocaleDateString(), total: parseInt(document.getElementById('total-sales').dataset.realValue) };
            db.collection('settings').doc('config').set({ lastReset: firebase.firestore.FieldValue.serverTimestamp(), salesHistory: [...salesHistoryData, entry] }, {merge:true}).then(()=>showToast("Day Reset")); 
        }

        // --- UTILS ---
        function showToast(msg, type) { const t=document.createElement('div'); t.className='toast show'; t.innerText=msg; document.getElementById('toast-container').appendChild(t); setTimeout(()=>t.remove(), 2000); }
        function confirmAction(t, cb) { if(confirm(t)) cb(); }
        function toggleShop() { db.collection('settings').doc('status').set({ isOpen: !isShopOpen }); }
        function switchTab(t) { 
            ['live', 'chats', 'history', 'udhaar'].forEach(x => { document.getElementById('view-'+x).classList.add('hidden'); document.getElementById('tab-'+x).className="flex-1 py-3 text-gray-500 font-bold text-sm"; });
            document.getElementById('view-'+t).classList.remove('hidden'); document.getElementById('tab-'+t).className="flex-1 py-3 tab-active font-bold text-sm";
        }
        
        // Add Chat tab to menu control if needed
        function openMenuControl() { /* kept simple */ }

        init();
    </script>
</body>
</html>
